<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Board -->
  <rect width="600" height="200" fill="#2563EB" rx="24"/>
  <!-- Grid Pattern Definition -->
  <defs>
    <pattern id="grid-bg" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#60A5FA" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Grid Layer -->
  <rect width="600" height="200" fill="url(#grid-bg)" rx="24"/>

  <g transform="translate(50, 40) scale(1.2)">
    <g stroke="#FFFFFF" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 25 55 C 25 15, 75 15, 75 55 Z"/>
      <ellipse cx="50" cy="65" rx="45" ry="15"/>
      <line x1="50" y1="20" x2="50" y2="5"/>
      <circle cx="50" cy="5" r="4" fill="#FFFFFF"/>
      <rect x="28" y="35" width="18" height="18" rx="4"/>
      <rect x="54" y="35" width="18" height="18" rx="4"/>
      <line x1="46" y1="44" x2="54" y2="44"/>
      <circle cx="37" cy="44" r="2" fill="#FFFFFF"/>
      <circle cx="63" cy="44" r="2" fill="#FFFFFF"/>
      <path d="M 40 70 L 60 70"/>
      <line x1="-10" y1="65" x2="110" y2="65" stroke="#93C5FD" stroke-width="0.8" stroke-dasharray="2 3"/>
      <line x1="50" y1="-10" x2="50" y2="110" stroke="#93C5FD" stroke-width="0.8" stroke-dasharray="2 3"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="210" y="105" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="-1">codelang</text>
  <text x="215" y="150" font-family="'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-weight="normal" font-size="22" fill="#93C5FD">按住 Alt 划词 · 秒懂代码黑话</text>
</svg>
