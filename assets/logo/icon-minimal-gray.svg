    <circle cx="50" cy="5" r="4" fill="#EF4444"/>
    <rect x="28" y="35" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/>
    <rect x="54" y="35" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/>
    <line x1="46" y1="44" x2="54" y2="44" stroke="#1E293B" stroke-width="4"/>
    <circle cx="37" cy="44" r="3" fill="#1E293B"/>
    <circle cx="63" cy="44" r="3" fill="#1E293B"/>
    <path d="M 40 70 L 60 70" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>