<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>codelang</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 280px;
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      font-size: 13px;
      color: #1f2328;
      background: #ffffff;
    }
    h1 { font-size: 14px; margin: 0 0 8px 0; }
    .row { display: flex; gap: 6px; margin-bottom: 8px; }
    input {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 13px;
      background: #ffffff;
      color: #1f2328;
      box-sizing: border-box;
    }
    button {
      padding: 6px 12px;
      background: #1f6feb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .result {
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 8px;
      margin-top: 8px;
      background: #f6f8fa;
      min-height: 40px;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .meta { font-size: 11px; color: #57606a; margin-top: 4px; }
    .link {
      display: block;
      margin-top: 10px;
      font-size: 11px;
      color: #0969da;
      text-decoration: none;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0d1117; color: #e6edf3; }
      input { background: #0d1117; color: #e6edf3; border-color: #30363d; }
      .result { background: #161b22; border-color: #30363d; }
    }
  </style>
</head>
<body>
  <h1>codelang</h1>
  <div class="row">
    <input id="q" placeholder="输入词语，回车查询" autofocus />
    <button id="go">查</button>
  </div>
  <div id="result" class="result">在任意网页选中词语即弹出解释卡片。</div>
  <div id="meta" class="meta"></div>
  <a class="link" id="openOptions">设置 API key</a>
  <script src="popup.js"></script>
</body>
</html>
