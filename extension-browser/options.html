<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>codelang 设置</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      max-width: 560px;
      margin: 40px auto;
      padding: 0 24px;
      color: #1f2328;
      background: #ffffff;
    }
    h1 { font-size: 18px; margin-bottom: 4px; }
    .sub { color: #57606a; font-size: 13px; margin-bottom: 24px; }
    .row { margin-bottom: 16px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; color: #57606a; }
    select, input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 13px;
      box-sizing: border-box;
      background: #ffffff;
      color: #1f2328;
    }
    button {
      padding: 8px 16px;
      background: #1f6feb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #1158c7; }
    button.secondary {
      background: #f6f8fa;
      color: #1f2328;
      border: 1px solid #d0d7de;
    }
    button.secondary:hover { background: #eaeef2; }
    .status { margin-top: 10px; color: #1a7f37; font-size: 12px; min-height: 16px; }
    .status.err { color: #cf222e; }
    .help {
      font-size: 11px;
      color: #57606a;
      margin-top: 4px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0d1117; color: #e6edf3; }
      select, input { background: #0d1117; color: #e6edf3; border-color: #30363d; }
      button.secondary { background: #21262d; color: #e6edf3; border-color: #30363d; }
    }
  </style>
</head>
<body>
  <h1>codelang 设置</h1>
  <div class="sub">配置 LLM 兜底（本地词库未命中时调用）。不填则只用本地词库。</div>

  <div class="row">
    <label>Provider</label>
    <select id="provider">
      <option value="anthropic">Anthropic (Claude)</option>
      <option value="openai">OpenAI</option>
    </select>
  </div>

  <div class="row">
    <label>API Key</label>
    <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
    <div class="help">本地存储在 chrome.storage.sync，不会上传任何第三方</div>
  </div>

  <div class="row">
    <label>Model（可选）</label>
    <input id="model" type="text" placeholder="Anthropic 默认 claude-haiku-4-5-20251001 / OpenAI 默认 gpt-4o-mini" />
  </div>

  <div class="row">
    <button id="save">保存</button>
    <button id="clearCache" class="secondary" style="margin-left:8px">清空 AI 缓存</button>
  </div>

  <div id="status" class="status"></div>

  <script src="options.js"></script>
</body>
</html>
