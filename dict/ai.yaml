# AI / LLM / 大模型术语

- term: LangChain
  aliases: [langchain]
  category: devterm
  meaning: 想象工厂流水线——传送带上的零件依次经过切割机、焊接机、组装机、检测机，最后出一部成品。LangChain 就是 LLM 应用的这种串联框架：把语言模型 + 工具 + 记忆 + 向量库等组件像流水线一样串起来。2023 年 LLM 应用栈的开荒者，特别红，后来生态被吐槽太重。
  example: 用 LangChain 接公司 PDF + 向量库做一个能问答的客服机器人。

- term: LlamaIndex
  aliases: [llamaindex, GPT Index]
  category: devterm
  meaning: 想象把图书馆 1 万本书塞进 ChatGPT 大脑——一次塞不下。LlamaIndex 就专门干这件事的框架：把你的私有文档切片、建索引、按问题检索相关片段塞给 LLM。和 LangChain 同期出现，但聚焦"喂数据"这一件事。
  example: 用 LlamaIndex 把公司 wiki 全部喂进去，做一个内部 RAG 问答系统。

- term: LangGraph
  aliases: [langgraph]
  category: devterm
  meaning: 想象 LangChain 是一条单向流水线（A→B→C→出货），LangGraph 是整个工厂园区——可以根据中间检测结果回到某个工位重做、可以分叉走多条路、可以循环测试到合格才放行。适合复杂 agent 流程。
  example: 用 LangGraph 写一个能反复反思修正的 agent，每步看自己上一步对不对。

- term: LangSmith
  aliases: [langsmith]
  category: devterm
  meaning: 想象工厂每个工位装上摄像头——成品出问题能回放每一步看哪个工位出错。LangSmith 是 LangChain 团队出的调试+评测平台：记录每次 LLM 调用、可视化整条 agent 链路、跑评测集。线上 agent 出问题不上 LangSmith 就是抓瞎。
  example: agent 经常给错答案，上 LangSmith 一看是某个工具调用返回了错数据。

- term: AutoGen
  aliases: [autogen, Microsoft AutoGen]
  category: devterm
  meaning: 想象一个项目组而不是单兵——产品 + 开发 + 测试互相打配合。AutoGen 是微软的多 agent 协作框架：让多个 LLM 角色互相对话完成任务，比单 agent 一锤子干强很多。
  example: 用 AutoGen 让一个 agent 写代码、另一个 agent 当 reviewer 提改进意见。

- term: CrewAI
  aliases: [crewai]
  category: devterm
  meaning: 和 AutoGen 一类——多 agent 协作框架，特色是强调"团队角色分工"：你定义经理 / 调研员 / 文案 / 校对，CrewAI 按角色协调他们工作。比 AutoGen 更面向工程化场景。
  example: 用 CrewAI 模拟一个内容创作团队，写一篇专题文章经过这几个角色协作完成。

- term: MCP
  aliases: [Model Context Protocol]
  category: devterm
  literal: Model Context Protocol
  meaning: 想象电子设备的 USB-C 接口——以前各家充电口五花八门，现在统一一种插头到处通。MCP 是 Anthropic 2024 年推的开放协议，规范"AI 模型 ↔ 外部工具/数据源"通信。Claude Desktop、Cursor 都接了 MCP，写一个 MCP server 多家 AI 都能用。
  example: 写一个 MCP server 暴露公司 wiki 搜索能力，Claude 桌面端立刻能查公司知识。

- term: ReAct
  aliases: [react prompting]
  category: devterm
  literal: Reasoning + Acting
  meaning: 想象福尔摩斯破案——"先想（这把刀很锋利说明凶手不普通），然后行动（去验尸），然后观察结果（发现伤口角度对不上），再想，再行动……"循环到结案。ReAct 就是让 LLM 走这种"思考→行动→观察→思考"的 agent 范式。
  example: 让 LLM 用 ReAct 范式查天气——先想"我要调天气工具"，行动调用，观察返回，再回答用户。

- term: CoT
  aliases: [Chain of Thought, 思维链]
  category: devterm
  literal: Chain-of-Thought
  meaning: 想象小学生做应用题——老师要求"写过程，别只写答案"，否则错了也不知道哪步错。CoT 就是让 LLM "把推理过程一步步写出来再给答案"，比直接答更准。最简形式就在 prompt 加 "let's think step by step"。
  example: 数学题加 CoT 提示，GPT-4 准确率从 60% 提到 90%。

- term: ToT
  aliases: [Tree of Thought, 思维树]
  category: devterm
  literal: Tree-of-Thought
  meaning: CoT 升级版。想象解谜题：CoT 是一条线推到底，错了就完；ToT 同时探索好几条思路，发现死胡同就剪掉、回到上一步换条路。像下棋时考虑多步未来。效果好但开销大。
  example: 解 24 点游戏用 ToT 比 CoT 准 4 倍，但 token 消耗 10 倍。

- term: few-shot
  aliases: [few shot, 少样本]
  category: devterm
  meaning: 想象教侄子写自我介绍——你不讲一堆理论，直接给他看三份样本"我叫 X、几岁、喜欢什么"。他立刻照葫芦画瓢。few-shot 就是在 prompt 里给 LLM 几个 input → output 示例，它照着学新任务。不用训练就能教，便宜效果显著。
  example: 给 3 个"原始评论 → 提取的产品名"示例做 few-shot，提取准确率从 60% 升到 90%。

- term: zero-shot
  aliases: [zero shot, 零样本]
  category: devterm
  meaning: 不给任何示例直接让 LLM 干活——靠它预训练时学到的通用能力裸答。和 few-shot 相对：zero-shot 是"凭印象答"，few-shot 是"看了样本答"。GPT-4 这种大模型 zero-shot 已经很多事都能干。
  example: 不给任何例子直接让 GPT-4 翻译中文到法语，效果就已经接近职业译者。

- term: in-context learning
  aliases: [ICL, 上下文学习]
  category: devterm
  meaning: 大模型的神奇能力——你只是在 prompt 里给几个例子，它就当场学会一个新任务，但它的参数一个字节都没改。像一个聪明实习生看你示范两遍立刻会做。few-shot 就是这能力的体现。
  example: ICL 让大模型不训练就能适应新任务，是 2020 年 GPT-3 论文出来时震惊业界的核心发现。

- term: prompt engineering
  aliases: [提示工程, prompt 工程]
  category: devterm
  meaning: 想象问律师同一个问题，怎么问决定答案质量——"我开车撞人怎么办"vs"作为加州居民，2024 年我开车撞人后应如何处理责任和保险，请按步骤回答"。后者答得详尽且专业。prompt engineering 就是这种"怎么问 LLM 得到最好答案"的工程实践。
  example: 同一个 GPT 模型 prompt 改一下，效果差 30% 是常事。

- term: system prompt
  aliases: [system message, 系统提示]
  category: devterm
  meaning: 想象给员工新入职培训定的规矩——"接客户必须微笑、不能透露内部信息"。LLM 的 system prompt 就是这种"开场规则"：对话开头先告诉它你是谁、能说什么不能说什么。优先级比用户消息高，用户改不了。
  example: 客服 bot 的 system prompt 设"只回答产品问题，遇到其他话题礼貌拒绝"。

- term: Transformer
  aliases: [transformer]
  category: devterm
  meaning: 2017 年 Google 一篇论文（Attention Is All You Need）提出的神经网络架构，从此改变了 AI 圈。当代所有大模型（GPT/Claude/Gemini/Llama）底层都是 Transformer。它的核心创新：用 attention 机制代替了之前的循环结构，又快又能学远距离关系。
  example: 没有 Transformer 就没有 ChatGPT，2017 年那篇论文是 AI 史上最重要的几篇之一。

- term: attention
  aliases: [Attention, 注意力机制]
  category: devterm
  meaning: 想象你读一句话"小明给小红的礼物，让她非常开心"——读到"她"时大脑自动跳回去看"她"指谁。attention 机制就是让神经网络也学会这种"读到一个词，看回前文哪些词跟它最相关"。Transformer 的灵魂。
  example: attention 矩阵能可视化"模型读到这个词时在关注前文哪些词"。

- term: self-attention
  aliases: [自注意力]
  category: devterm
  meaning: attention 应用在"自己看自己"的版本——序列里每个词都和序列内所有其他词算一遍关联度。这样模型能学到"这句话里词和词的关系网"。Transformer 的核心算子。
  example: self-attention 能让模型理解"那只追猫的狗"里"追"是狗的动作不是猫的，靠的就是它。

- term: multi-head attention
  aliases: [MHA, 多头注意力]
  category: devterm
  meaning: 想象读一句话时大脑同时从几个角度看——一组看语法关系、一组看语义关系、一组看情感色彩。Multi-head attention 就是把 attention 拆成多个"头"并行算，每个头学一种独立的模式。比单头强很多。
  example: GPT-4 一层就有几十个 attention head，每个学不同的语言规律。

- term: encoder
  aliases: [Encoder, 编码器]
  category: devterm
  meaning: 想象同声翻译先把整段中文听完理解清楚（编码），再开口说英文（解码）。Transformer 里 encoder 就是负责"理解输入"的部分，把整段输入压成一份内部表示。BERT 就是纯 encoder 架构，适合理解任务（分类、判断、搜索）。
  example: encoder-only 模型如 BERT 不擅长写文章，但很擅长判断"这两句话意思一样吗"。

- term: decoder
  aliases: [Decoder, 解码器]
  category: devterm
  meaning: encoder 的另一半——负责"产出内容"。它根据已有内容一个 token 一个 token 往外写。GPT/Claude/Llama 都是纯 decoder 架构，专门生成。decoder-only 模型适合写文章、对话、补全。
  example: ChatGPT 一边打字一边出字，就是 decoder 一个 token 一个 token 往外吐。

- term: MoE
  aliases: [Mixture of Experts, 专家混合, 混合专家, 混合专家模型]
  category: devterm
  literal: Mixture of Experts
  meaning: 想象医院里几十个专家科室——病人来时只看症状被分给最对口的两三个专家，不用全院出动。MoE 就是这种大模型架构：模型里有几十个"专家"子网络，每个 token 进来只激活几个相关专家。总参数巨大但每次推理便宜。Mixtral / DeepSeek 都是 MoE。
  example: Mixtral 8x22B 总参数 141B，但每个 token 只用约 39B，推理快、容量大。

- term: token
  aliases: [Token]
  category: devterm
  meaning: 想象 LLM 不是按"字"或"词"读文本，而是按"token"读——一个 token 大约是 0.75 个英文单词，或 1-2 个汉字。这是 LLM 处理的最小单位，按它计费、按它限上下文。"一条 prompt 1500 token"=大概 1000 个英文词或 700 多个汉字。
  example: ChatGPT 一条提示 1500 token，刚好够塞进 GPT-4o 的 128k 上下文窗。

- term: tokenizer
  aliases: [Tokenizer, 分词器]
  category: devterm
  meaning: 把人类文本切成 token 的工具。"hello world" 可能被切成 ["hel", "lo", " wor", "ld"]——不一定按词，而是按训练时统计出的高频片段。每个模型有自己的 tokenizer，GPT 用 tiktoken、Llama 用 SentencePiece。中文 token 化效率一般比英文低，所以中文消耗 token 更多。
  example: 同样一句话英文可能 10 token、中文可能 20 token——按 token 计费时中文用户吃亏。

- term: embedding
  aliases: [Embedding, 嵌入, 向量]
  category: devterm
  meaning: 想象用一组坐标描述每个词的"位置"——猫在(0.9, 0.1)、狗在(0.85, 0.15)、汽车在(0.1, 0.9)。猫和狗距离近、和汽车距离远。embedding 就是把文本（或图像）压成几百维浮点数向量，让计算机能"算两段内容意思有多近"。
  example: 把文档全 embed 进向量库，搜索时用"语义距离"找最相关的段。

- term: vector DB
  aliases: [vector database, 向量数据库, 向量库]
  category: devterm
  meaning: 普通数据库找"等于 X 的记录"，向量库找"和 X 这条向量最像的 N 条"。专门为 embedding 设计、能极快做"最近邻搜索"。Pinecone/Weaviate/Milvus/Chroma/Qdrant 都是。RAG 应用必备的中间件。
  example: 公司知识库 10 万篇文档全 embed 进 Pinecone，用户提问时秒检索最相关 5 篇喂给 LLM。

- term: cosine similarity
  aliases: [余弦相似度]
  category: devterm
  meaning: 算两个向量"方向有多像"的数学方法——想象两支箭，朝同一方向是 1（完全相似），垂直是 0，反向是 -1。embedding 检索的标准距离度量。0.85 以上就算很相似了。
  example: 两段文本 embedding 的 cosine similarity 0.92，说明意思非常接近。

- term: semantic search
  aliases: [语义搜索]
  category: devterm
  meaning: 想象百度搜"减肥方法"只找出含"减肥"字眼的页面（关键词搜索），而 semantic search 能找出"瘦身方案"、"如何变苗条"——理解你要的意思。基于 embedding：把搜索词和所有内容都转向量，找最近的。
  example: 公司知识库换成 semantic search 后，员工搜"差旅怎么报销"也能搜到《出差费用申报指南》。

- term: context window
  aliases: [上下文窗口, 上下文长度]
  category: devterm
  meaning: 想象 LLM 工作时记忆容量有限——给它塞 200 页书没问题，塞 2000 页就吐了。context window 就是这上限：Claude 200k token、Gemini 2M token。超出就得截断或先用 RAG 检索精华片段塞给它。
  example: 长 PDF 200 页超出 context window，得切片向量化做 RAG，按问题检索相关段喂给模型。

- term: hallucination
  aliases: [幻觉, AI 幻觉]
  category: devterm
  literal: 幻觉
  meaning: 想象班里那个最会吹牛的学生——老师叫起来回答，明明不知道却一脸严肃地编一个看似合理的答案。LLM 一本正经地编造事实就是这种"幻觉"：日期、人名、引用全是瞎说但看起来真。RAG 和事实核查能减轻但消不掉。
  example: 让 LLM 写报告引用论文，它编了三篇根本不存在的——典型幻觉。

- term: pre-training
  aliases: [预训练, pretrain, 预训]
  category: devterm
  meaning: 想象培养一个通识学者——让他读完互联网上所有能找到的书、文章、代码。pre-training 就是这阶段：用海量文本训练基础模型让它学会语言规律和通用知识。是大模型训练第一阶段（之后才是 post-training 的 SFT/RLHF）。这一步最烧钱：GPT-4 估烧 1 亿美金、Llama 3 在 15 万亿 token 上训。"预训练 + 微调"是大模型训练经典范式。
  example: 这家从头预训练 70B 模型烧了 2000 万美金算力。

- term: fine-tuning
  aliases: [fine tuning, 微调, finetune]
  category: devterm
  meaning: 想象通识学者经过 pre-training 已经啥都懂一点，现在让他专攻法律——给他读几千份判例、合同。fine-tuning 就是在预训练基础模型之上用专业数据再训一遍，让它适配具体任务/领域。
  example: 用 10 万条法律文书 fine-tune 一个律所专用模型，比通用 GPT 准得多。

- term: SFT
  aliases: [supervised fine-tuning, 监督微调, 指令微调, instruction tuning, instruct tuning]
  category: devterm
  literal: Supervised Fine-Tuning
  meaning: 想象老师教学生作文——一边出题一边告诉"这种题该这样答"，给一万套范例。SFT 就是给 LLM 喂"问题 → 标准回答"成对的数据，教它学会按指令回答。这是从只会续写的基座模型变成会对话的 Chat 模型的第一步。
  example: 拿 10 万条"问题→人写的标准答案"做 SFT 训一周，基座变 Chat。

- term: RLHF
  aliases: [人类反馈强化学习]
  category: devterm
  literal: Reinforcement Learning from Human Feedback
  meaning: 想象训狗——你给它两个答案 A 和 B，告诉它"A 比 B 好"，狗逐渐学会偏好 A 这一类。RLHF 就是让人类标注员对 LLM 输出打"A 比 B 好"的偏好，然后用强化学习把这种偏好教给模型。ChatGPT 出圈的关键技术。
  example: 经过 RLHF 的模型回答更礼貌、更有用、更少胡说，比纯 SFT 强一大截。

- term: DPO
  aliases: [Direct Preference Optimization]
  category: devterm
  literal: Direct Preference Optimization
  meaning: RLHF 简化版。RLHF 要先训一个"奖励模型"再用强化学习优化，两步太复杂还容易翻车。DPO 数学上证明可以跳过奖励模型直接用偏好数据训 LLM，简单稳定。2023 起广泛替代 RLHF。
  example: 小团队微调没资源搭复杂 RLHF 管线，DPO 一步到位省一半事。

- term: LoRA
  aliases: [lora, Low-Rank Adaptation]
  category: devterm
  literal: Low-Rank Adaptation
  meaning: 想象给大型机器人加个小耳机让它学新方言——机器本身没动，外挂一个小模块就改性格。LoRA 就这思路：冻结原模型不动，只在旁边训一个很小的"低秩适配器"模块，训练成本是全参微调的 1%，效果接近。开启个人微调时代。
  example: 用 LoRA 在一张 4090 上就能微调 7B 模型，过去要 8 张 A100。

- term: QLoRA
  aliases: [qlora]
  category: devterm
  meaning: LoRA 升级版——先把原模型压成 4-bit（量化）省一大半显存，再上 LoRA 训。结果：24GB 消费级 GPU 上能微调 65B 模型，过去得 8 张专业卡。让民间玩转大模型微调成为可能。
  example: QLoRA 让你在一张 4090 上 fine-tune Llama 70B，开源社区的春天。

- term: PEFT
  aliases: [peft, Parameter-Efficient Fine-Tuning]
  category: devterm
  literal: Parameter-Efficient Fine-Tuning
  meaning: 所有"只训少量参数就让大模型学会新技能"方法的统称——LoRA、Prefix Tuning、Adapter 都属于 PEFT 家族。和"全参微调"对应，省 99% 训练成本。HuggingFace 出了同名的 PEFT 库。
  example: 资源有限就用 PEFT 家族方法，别想着全参微调一个 70B 模型。

- term: distillation
  aliases: [知识蒸馏, distill]
  category: devterm
  literal: 蒸馏
  meaning: 想象老师带徒弟——老师智慧渊博但行动慢，徒弟跟着学几年，能力八九成、动作快十倍。distillation 就是用大模型当"老师"训一个小模型当"学生"：学生学老师的输出分布，能力接近但小快便宜。
  example: 从 GPT-4 distill 出一个 7B 学生模型部署到手机端，能在断网时跑。

- term: quantization
  aliases: [模型量化, 权重量化]
  category: devterm
  meaning: 想象图片从 100MB 高清压成 5MB 缩略图——大致还能认出但细节糊了。模型量化就这思路：把模型权重从精确的 16/32 位浮点压成粗略的 8/4 位整数。模型小一半到八分之一、推理快、代价是少量精度损失。注意：和"量化指标"那个量化完全两码事。
  example: Llama 70B 全精度 140GB，量化到 4-bit 后只占 35GB，能在 48GB GPU 跑。

- term: INT4
  aliases: [4-bit, int4]
  category: devterm
  meaning: 4 位整数——每个权重只能取 16 个数。极致压缩，模型大小是 FP16 的 1/4。代价是精度损失明显，但配合 QLoRA 等技术效果还能接受。手机/嵌入式设备跑大模型的常用选择。
  example: INT4 量化让 7B 模型只占 4GB 内存，能在树莓派上跑起来。

- term: INT8
  aliases: [8-bit, int8]
  category: devterm
  meaning: 8 位整数——每个权重 256 个数可选。常见的"性价比最高"量化精度：模型瘦一半，精度几乎无损。生产推理的默认选择。
  example: 推理服务用 INT8 量化，吞吐翻倍质量没变化，性价比之王。

- term: FP16
  aliases: [half precision, 半精度]
  category: devterm
  literal: Floating Point 16-bit
  meaning: 16 位浮点（半精度），比传统 32 位浮点 FP32 占内存少一半。GPU 训练和推理常用，速度快、精度还行。代价：极端数值易溢出。常和 FP32 混用做 mixed precision 训练取平衡。
  example: GPU 训练用 FP16 + FP32 mixed precision，速度翻倍精度不掉。

- term: BF16
  aliases: [bfloat16]
  category: devterm
  literal: brain floating point 16
  meaning: Google 出的 16 位浮点变种——比 FP16 把指数位扩大、精度位减小。能表示的数值范围更大不容易溢出，训练时数值更稳。Llama、Claude 等大模型训练首选。
  example: Llama 训练用 BF16 而不是 FP16，loss 不容易出 NaN。

- term: temperature
  aliases: [温度参数]
  category: devterm
  literal: 温度
  meaning: 想象调音台的「创意度」旋钮——拧到 0 永远播放同一个标准答案，开大就加上各种随机效果。LLM 的 temperature 参数控制输出随机性：0 = 总是答概率最高的（稳定但无聊），高 = 更随机更有创意。代码任务调 0，写诗调 1.0+。
  example: 客服 bot temperature 设 0 保证答案一致，作家辅助工具调 0.8 让它脑洞大。

- term: top-p
  aliases: [nucleus sampling]
  category: devterm
  meaning: 一种采样策略——选下一个词时只从"累积概率前 p 的候选"里挑。比如 p=0.9 意思是"看概率从高到低累加到 90% 那批词，从这批里选"。比 top-k 更聪明，能自适应词的概率分布形状。
  example: top-p=0.9 是常用配置，既不失多样性又不会选到太离谱的词。

- term: top-k
  aliases: [top k]
  category: devterm
  meaning: 一种采样策略——每步只在概率最高的 K 个候选词里选。K=1 退化为贪心、K=∞ 完全随机。简单粗暴。一般和 temperature 配合用。
  example: top-k=50 限制候选池大小，避免选到尾部的奇怪词。

- term: greedy decoding
  aliases: [greedy, 贪心解码]
  category: devterm
  meaning: 想象迷宫里每步都选眼前最宽的那条岔路——不一定全局最优但当下最稳。LLM 的贪心解码每步都选概率最高的 token，没有随机性。等同于 temperature=0。代码生成、数据提取这类需要稳定输出的任务默认用它。
  example: 代码生成任务默认用 greedy decoding，避免随机性导致每次答案不同。

- term: beam search
  aliases: [集束搜索]
  category: devterm
  meaning: 想象探险队不只走一条路——同时派 5 队人探，每步保留进度最好的 5 条路线继续。beam search 就是 LLM 同时维护 K 条候选生成序列，每步扩展并保留 top-K。机器翻译常用，比贪心好但贵 K 倍。
  example: 翻译模型用 beam search size=5，比贪心翻译质量明显好。

- term: KV cache
  aliases: [kv cache, KV 缓存]
  category: devterm
  meaning: 想象口算"123 + 456 + 789"——你算完前两步得 579，下一步直接 579+789，不会从头再加一遍。KV cache 就是 LLM 推理时把"前面看过的 token 计算结果"存起来，下个 token 接着算不重头来。大大加速但占显存。
  example: 长对话上下文 KV cache 占的显存比模型本身还多，是长上下文推理的硬瓶颈。

- term: TTFT
  aliases: [Time To First Token, 首 token 延迟]
  category: devterm
  literal: Time To First Token
  meaning: 用户按下回车到看到 LLM 输出第一个字的时间——心理上最关键的指标。即使总输出快，TTFT 长用户也觉得"卡"。优化 TTFT 主要靠优化 prompt 处理速度和首层计算。
  example: 客服 bot TTFT 800ms 用户已经在皱眉，目标降到 300ms 以下。

- term: prompt caching
  aliases: [prompt cache, 提示缓存]
  category: devterm
  meaning: 想象你每天问同一个秘书"今天日程"——他知道你的偏好不用每次重问。LLM 服务的 prompt caching 类似：你 prompt 前面长的系统提示+知识库内容服务端缓存，下次同样 prompt 不重新算。Anthropic / OpenAI 都支持，能省 50% 成本。
  example: RAG 应用每次都塞同样的 5KB 知识库片段，开 prompt caching 省一半钱。

- term: streaming
  aliases: [流式输出, 流式响应]
  category: devterm
  meaning: 想象朋友打字回你消息——不是写完一段一次发，是一个字一个字蹦出来你能边看边想。LLM streaming 就这体验：模型一边生成一边吐 token，用户更早看到内容、感觉更快。ChatGPT 的"打字机"效果就是。底层一般用 SSE。
  example: 接口改成 streaming 后用户体感快了 3 倍，其实总输出时间没变只是首字快。

- term: function calling
  aliases: [tool use, tool calling, 工具调用]
  category: devterm
  meaning: 想象老板说"查下今天北京天气"——你不知道但能打电话给天气服务问。LLM 的 function calling 就这能力：你给它一堆可用工具，它判断"该用哪个工具+传什么参数"，外部跑完结果再喂回来给它继续。Agent 的基础能力。
  example: 给 LLM 配天气工具，问"北京冷不冷"时它输出 `get_weather(city="北京")` 让外部跑。

- term: agent
  aliases: [Agent, AI agent]
  category: devterm
  meaning: 想象一个会主动办事的助理——你说"订下周飞东京的票"，它自己查日历、比价、订机票、加日程，不用你一步步盯。AI agent 比一问一答的 chatbot 更进一步：能自主决策、调多个工具、循环到完成目标。Devin、Manus 这些都是 agent。
  example: 写一个 agent，自动读 GitHub issue → 写代码 → 提 PR，全流程不用人。

- term: multimodal
  aliases: [多模态]
  category: devterm
  meaning: 想象一个人能听、能说、能看、能写——五官全开。多模态 LLM 就这种：同时能吃文字、图片、音频、视频。看图说话、画图理解、识别截图全 OK。GPT-4V / Claude 3 / Gemini 都是多模态。
  example: 把设计稿截图发给 Claude，它直接生成对应代码——这是多模态的力量。

- term: vision model
  aliases: [视觉模型, VLM]
  category: devterm
  meaning: 能"看图"的 LLM。截图它能读出 UI 元素、表格、图表数据。是多模态的一个子集（专门视觉）。VLM = Vision Language Model。
  example: 用 vision model 让 AI 自动从设计图生成 React 代码，准确度已经很高。

- term: AI benchmark
  aliases: [跑分数据集, eval benchmark]
  category: devterm
  literal: AI 基准测试
  meaning: 想象高考——一套标准题目让所有学生都做，分数能直接横向比。AI benchmark 就是 LLM 圈的统一考卷：MMLU 测通识、HumanEval 测编程、GSM8K 测数学。每个新模型出来都要刷一遍这些 benchmark 排名次。
  example: 新模型发布必报 MMLU/HumanEval 几个 benchmark 分数，方便和 GPT-4 比。

- term: MMLU
  category: devterm
  literal: Massive Multitask Language Understanding
  meaning: 57 个学科（数学、历史、医学、法律……）的多选题集，测 LLM 通识。被引用最多的 benchmark 之一。GPT-4 在 MMLU 上 86%，已超过人类专家水平。
  example: GPT-4 MMLU 86%、Claude 3.5 86.8%、人类专家 89.8%。

- term: HumanEval
  aliases: [humaneval]
  category: devterm
  meaning: OpenAI 出的 164 道 Python 编程题集，测 LLM 写代码能力。给函数签名和文档让模型补完。早期模型 30%，现在顶尖模型 90%+，差不多打满了。
  example: Claude 3 在 HumanEval 上 92%，超过了人类平均码农。

- term: SWE-bench
  aliases: [swebench]
  category: devterm
  meaning: Princeton 出的真实 GitHub issue 数据集——给 LLM 看 issue 描述+整个代码库，让它写补丁修 bug。比 HumanEval 难得多（接近真工程），是 agent 时代的硬核 benchmark。
  example: 顶级 agent 在 SWE-bench Verified 上做到 70% 已是行业领先。

- term: Hugging Face
  aliases: [HuggingFace, HF, hf]
  category: devterm
  meaning: 想象 GitHub 但专门给 AI 模型用——所有开源模型、数据集都挂这里。"AI 界的 GitHub"。同时也是著名的 transformers 库的出品方，社区主导地位。
  example: 从 Hugging Face 下载 Llama 模型，几行 transformers 代码就能跑起来。

- term: Llama
  aliases: [LLaMA, llama]
  category: devterm
  meaning: Meta（Facebook 母公司）开源的大模型系列——从 Llama 1（2023.2）到 Llama 3.3。开源圈的"标杆基座"，社区微调、研究、私有部署的起点几乎都是 Llama。
  example: 公司想私有部署 ChatGPT 替代品一般跑 Llama 70B。

- term: Mistral
  aliases: [mistral, Mixtral]
  category: devterm
  meaning: 法国 AI 公司，开源模型领域的另一强者。Mistral 7B（小但强）、Mixtral 8x7B（MoE 架构）都是社区明星。和 Meta 的 Llama 是开源圈两大旗舰。
  example: 内存有限想要质量好的小模型，Mistral 7B 是首选。

- term: Gemini
  aliases: [gemini]
  category: devterm
  meaning: Google 出的多模态大模型系列。最大特色：超长上下文（Gemini 1.5 Pro 支持 2M token）和原生多模态。和 GPT/Claude 三国鼎立。
  example: 让 AI 看一部完整电影做总结？Gemini 200 万 token 上下文够吃下整部。

- term: o1
  aliases: [GPT-o1, o1-preview, o1-mini]
  category: devterm
  meaning: OpenAI 2024 年发的"推理模型"——回答前先在内部长时间默想（看不见的 CoT），再吐答案。复杂数学/代码题准确率比 GPT-4 高很多，代价是慢和贵。开启 reasoning 模型新流派。
  example: 让 o1 解奥数题正确率是 GPT-4 的 3 倍，代价是答一题要 30 秒+。

- term: vLLM
  aliases: [vllm]
  category: devterm
  meaning: 想象 LLM 推理的"超级引擎"——同样的模型在 vLLM 上跑比裸用 HuggingFace 快 20 倍。核心创新：PagedAttention（仿操作系统虚拟内存方式管理 KV cache）。生产环境部署 LLM 几乎必装。
  example: 自建 LLM 服务在 vLLM 上跑 Llama 70B，单卡吞吐够支撑 1000+ 并发用户。

- term: Ollama
  aliases: [ollama]
  category: devterm
  meaning: 在自己电脑跑 LLM 的"极简遥控器"——一行 `ollama run llama3` 自动下载并启动。开发者最爱的本地 LLM 工具。免费、隐私、不烧 API 钱。
  example: 写 demo 不想花 API 钱，本地 ollama 起一个 llama3 调用就行。

- term: Pinecone
  aliases: [pinecone]
  category: devterm
  meaning: 最早做向量数据库的商业 SaaS 公司（2019 年成立，2023 年 RAG 火起来时一飞冲天）。即开即用，省去自建运维。
  example: 公司知识库用 Pinecone 省事，几十块钱一个月接入一个 RAG 应用。

- term: Chroma
  aliases: [chroma, ChromaDB]
  category: devterm
  meaning: 开源向量数据库，最大特点是"和 Python/LangChain 集成最丝滑"——几行代码起一个。本地开发、原型阶段首选。
  example: 写一个 RAG demo 用 Chroma 几分钟就能跑起来，不用部署任何服务。

- term: Milvus
  aliases: [milvus]
  category: devterm
  meaning: Zilliz 公司出的开源向量数据库，性能强、企业级。适合亿级以上向量规模的生产场景。运维比 Pinecone 复杂但便宜。
  example: 公司有 5 亿条文档向量化，自建 Milvus 集群存。

- term: Weaviate
  aliases: [weaviate]
  category: devterm
  meaning: 开源向量数据库，特色是"知识图谱 + 向量"混合检索——既支持语义搜，也支持基于实体关系的精确查询。适合结构化数据多的场景。
  example: 商品数据既要按描述语义搜也要按类别价格过滤，用 Weaviate 一把搞定。

- term: Qdrant
  aliases: [qdrant]
  category: devterm
  meaning: Rust 写的开源向量数据库——性能突出、内存效率好。是 Pinecone 自建替代的热门选项。
  example: 性能压榨到极致的场景选 Qdrant 替 Pinecone，自建省钱还快。

- term: Stable Diffusion
  aliases: [SD, stable diffusion]
  category: devterm
  meaning: Stability AI 出的开源文生图模型——你输入"夕阳下的猫"，它画出来。最大特色：开源 + 社区生态最丰富，几千种风格 LoRA、各种工具链全。绘画爱好者的"乐高"。
  example: 用 Stable Diffusion + ControlNet 控制构图，复刻任何画风。

- term: diffusion model
  aliases: [扩散模型]
  category: devterm
  meaning: 想象从噪点画恢复出图——先把好图反复加噪声变模糊；模型学会反向去噪步骤。生成时给纯噪声让它一步步去噪出图。当代 AI 画图、视频生成主流架构。Stable Diffusion / DALL-E / Sora 全是它。
  example: Sora 能从一段文字生成连贯视频，底层就是 diffusion model 的延伸。

- term: DALL-E
  aliases: [DALLE, dall-e]
  category: devterm
  meaning: OpenAI 的文生图模型系列。DALL-E 3 已经融进 ChatGPT——你在对话里说"画一只穿西装的猫"就直接画。是闭源、易用但社区生态远不如 Stable Diffusion。
  example: 让 ChatGPT 画图就是它调 DALL-E 3 在背后操作。

- term: Sora
  category: devterm
  meaning: OpenAI 2024 年发的文生视频模型——给一段描述能生成几十秒连贯高清视频，画质和物理感前所未有。让短视频和影视行业紧张。
  example: Sora 出来后好几个 stock video 公司股价大跌，被 AI 抢饭碗。

- term: ChatGPT
  aliases: [chatgpt]
  category: devterm
  meaning: OpenAI 2022 年 11 月发的对话产品——5 天破百万用户、2 个月破亿。AI 正式"出圈"进入大众视野的引爆点。背后是 GPT 系列模型，但 ChatGPT 是面向用户的产品形态。
  example: 让 ChatGPT 帮写 PPT 大纲、改邮件、答疑，是无数职场人的日常。

- term: Claude
  aliases: [claude]
  category: devterm
  meaning: Anthropic 出的对话模型系列（Sonnet/Haiku/Opus 三档）。和 GPT/Gemini 三国鼎立。代码、长上下文是 Claude 强项。注：codelang 这个工具就是用 Claude 写的。
  example: 写复杂代码我用 Claude，写营销文案有人觉得 GPT 更顺手——各擅胜场。

- term: Cursor
  aliases: [cursor]
  category: devterm
  meaning: AI 编程编辑器——把 VS Code fork 一份深度整合 Claude/GPT。能在编辑器里直接和 AI 对话改代码、自动补全、跨文件理解项目。2024 年 AI 编程领域最火的工具，估值飙升。
  example: 从 VS Code 切到 Cursor 后，写代码效率翻倍，常听到的说法。

- term: Windsurf
  aliases: [windsurf]
  category: devterm
  meaning: Codeium 公司出的 AI 编辑器，对标 Cursor，强调"全自主 agent 模式"——让 AI 自己开多个文件、跑命令、调试。和 Cursor 抢同一批用户。
  example: Windsurf 的 Cascade agent 模式比 Cursor 的更激进，能跑得更远但出错更难纠。

- term: Copilot
  aliases: [GitHub Copilot, copilot]
  category: devterm
  meaning: 2021 年 GitHub + OpenAI 出的代码补全 AI——AI 编程鼻祖。当时震撼世界。现在功能被 Cursor / Windsurf 超越，但仍是历史地位无可替代的开拓者。
  example: 2021 年 Copilot 出来时大家担心程序员失业，现在习惯它跟习惯输入法补全一样。

- term: emergence
  aliases: [emergent ability, 涌现, 涌现能力, 涌现现象]
  category: devterm
  meaning: 想象孩子学说话——一岁前只会咿呀，某天突然蹦出一个完整词组。LLM 也有类似神奇：参数从 1B 涨到 10B 再到 100B，某些能力（few-shot 学习、CoT 推理）突然冒出来，小模型完全没有。这种"量变到质变"叫涌现。
  example: GPT-3 突然展现的少样本学习能力，是 AI 涌现现象的经典例子。

- term: scaling law
  aliases: [Scaling Laws, 缩放定律]
  category: devterm
  meaning: 一条经验规律：模型性能 ∝ 参数量 × 数据量 × 计算量 的幂律——越烧钱越强、且性能曲线很可预测。"力大砖飞"的理论基础。OpenAI 等公司就是基于 scaling law 决定继续烧几亿美元做 GPT-5。
  example: 根据 scaling law 推断，再大 10 倍参数模型还能涨能力——这是 GPT-5 等模型的押注。

- term: alignment
  aliases: [模型对齐, AI alignment]
  category: devterm
  meaning: 让 AI 行为符合人类意图、价值观的研究——别让它说脏话、别教人造弹药、别推销极端思想。RLHF/DPO/Constitutional AI 都是 alignment 技术。注：和大厂"开会对齐"完全不是一回事。
  example: alignment 是 AI 安全核心问题——能力很强又听话才安全，能力强不听话最危险。

- term: jailbreak
  aliases: [越狱, 提示越狱, jailbreaking, prompt jailbreak]
  category: devterm
  meaning: ① **AI 越狱（当代默认含义）**——想象诱骗保险柜：本来不开，但绕过密码用社会工程让它开。jailbreak 就是用特殊 prompt 绕过 LLM 安全护栏让它输出本来禁止的内容（教暴力、写黄文、说脏话）。"奶奶漏洞""DAN 模式""扮演故事"是经典套路。模型公司不停打补丁、越狱者不停想新招——AI 安全攻防的主要战场。② **iOS 越狱（历史含义）**——iPhone 解锁系统限制装非 App Store 应用，2010 年代盛行，现在因 iOS 越来越开放（侧载、第三方输入法都合法了）已经没落，年轻人都不知道这词了。
  example: AI "用扮演故事方法越狱 ChatGPT 写禁内容"；iOS "10 年前 iPhone 越狱才能装第三方输入法"（如今已无人在意）。

- term: red team
  aliases: [红队]
  category: devterm
  meaning: 想象电影里的反派演练——红队就是故意扮"坏人"挖系统漏洞的团队。AI 上线前红队会专门花几周时间想方设法用恶意输入、jailbreak、对抗样本攻击模型，找出问题再修补。
  example: Claude / GPT 发版前都跑大量 red team 测试，把能挖到的漏洞先修了。

- term: guardrail
  aliases: [护栏]
  category: devterm
  meaning: 想象高速公路边的护栏——车失控时挡一下别冲下山。给 LLM 加的 guardrail 就是各种安全限制：敏感话题挡掉、敏感词过滤、输出格式校验。NeMo Guardrails / Guardrails AI 都是相关库。
  example: 客服 bot 加 guardrail "不允许聊政治、宗教、薪资"，避免 PR 风险。

- term: evals
  aliases: [eval, 评测]
  category: devterm
  meaning: 想象给学生出一份系统化的"期末考试题集"+"评分标准"——LLM 应用的 evals 一样：一组代表性问题 + 怎么判断回答好不好。改完 prompt 跑一遍 evals 看回归是否有质量下降。和软件单测类似但分数有主观成分。
  example: 改了 prompt 跑一遍 evals，30 道题里有 3 道质量下降，得回滚 prompt 调整。

- term: structured output
  aliases: [JSON mode, 结构化输出]
  category: devterm
  meaning: 想象问律师"我能起诉吗"——他可能说一长段，但你想要一张表"能/不能/原因/建议"。让 LLM 严格按 JSON schema 输出就是 structured output：你说要什么字段它就给什么，方便程序解析。Claude/GPT 都原生支持。
  example: 接口要求 JSON 就开 structured output，不用从自然语言里抠字段。

- term: tokens per second
  aliases: [tok/s, tok per s]
  category: devterm
  meaning: LLM 推理速度的核心指标——每秒能吐多少 token。GPT-4 大约 30 tok/s、Claude Sonnet 60 tok/s、Groq 上的 Llama 能跑到 500+。越高用户体感越流畅。
  example: 这模型 80 tok/s 已经够流畅，用户感觉不到等待。

- term: 上下文工程
  aliases: [context engineering]
  category: devterm
  meaning: prompt engineering 的进化版——不只是"怎么写好那段提示词"，还包括"该塞什么背景、检索哪些资料、给什么例子、怎么管理历史对话、怎么裁剪"。Agent 时代真正考验工程能力的是 context engineering。
  example: agent 老答错是 prompt 没写好？多半是 context engineering 出了问题——背景信息没塞对。

- term: 提示词
  aliases: [prompt, Prompt]
  category: devterm
  meaning: 你给 LLM 的输入文本——告诉它你是谁、要它做什么、给它什么背景。设计好提示词是用 LLM 的基本功，"prompt 工程师"短暂火过一段。
  example: 同一个模型，"用大白话解释幂等" vs "解释幂等" 后者答得简略很多——这就是提示词设计的力量。

# --- batch 7 expansion: 2024-2026 AI / Agent 新术语 ---

- term: 智能体
  aliases: [AI 智能体, intelligent agent]
  category: devterm
  meaning: AI Agent 的中文翻译——能自主决策、调工具、循环执行直到完成目标的 LLM 应用。和单次问答的 chatbot 不一样：智能体能自己规划步骤、调工具、看结果再决定下一步。2024-2025 创投圈最热的词。
  example: 用 Claude SDK 写一个能自动读 GitHub issue 提 PR 的智能体。

- term: 多智能体
  aliases: [multi-agent, Multi-Agent, 多智能体协作]
  category: devterm
  meaning: 多个 AI Agent 互相协作完成任务的系统——比如一个调研、一个写代码、一个 review。比单 agent 更像团队作业。AutoGen / CrewAI / LangGraph 都是多智能体框架。
  example: 用 AutoGen 让"产品经理"和"工程师"两个 agent 对话出方案。

- term: Agent Skills
  aliases: [Skills, Anthropic Skills, Agent Skill]
  category: devterm
  meaning: Anthropic 2025 年 12 月发布的开放标准——把领域知识 + 脚本 + 资源打包成一个 Skill 文件夹，agent 按需加载。和 MCP 互补：MCP 管"工具能不能用"，Skill 管"用对不对"。类比给员工的"标准操作手册"。
  example: 给 Claude 配一个"公司 Java 编码规范"Skill，写代码自动遵守。

- term: Sub-agent
  aliases: [subagent, 子智能体, sub agent]
  category: devterm
  meaning: Claude Code 引入的"专业子助手"——主 agent 把特定任务分发给有专门领域知识的 sub-agent 处理。解决"上下文腐烂"（主 agent 上下文太长易乱）问题。
  example: 主 agent 把代码安全审计任务交给 security-reviewer sub-agent 处理。

- term: Computer Use
  aliases: [电脑使用, CUA, computer use]
  category: devterm
  literal: Computer Use Agent
  meaning: Anthropic 2024 年推出的 Claude 能力——让 AI 像人一样操作电脑：截屏、移动鼠标、敲键盘、点按钮。从"问答"进化到"代你办事"。OpenAI 的 Operator 是对标产品。
  example: 让 Claude Computer Use 打开浏览器订机票，全程不用动手。

- term: Browser Use
  aliases: [browser-use, browser use]
  category: devterm
  meaning: 让 AI agent 控制浏览器的开源框架——比 Computer Use 范围窄但更专精。爬数据、自动填表、绕过 captcha 等。
  example: 用 Browser Use 写脚本自动从招聘网站爬职位。

- term: 思考预算
  aliases: [thinking budget, reasoning effort, reasoning budget]
  category: devterm
  meaning: 给推理模型设的"思考时间上限"——告诉模型最多用多少 token 内部思考再给答案。预算大答案准但慢且贵，小则反之。Claude 4 / o1 系列都有这个参数。
  example: 数学题把 thinking budget 设到 8000 token，准确率比默认高 30%。

- term: 推理模型
  aliases: [reasoning model, thinking model, 思考模型]
  category: devterm
  meaning: 给出答案前先长时间"内部默想"的 LLM——o1 / Claude 4 reasoning / DeepSeek R1 都是。比传统 LLM 慢且贵但复杂题（数学/代码/规划）准确率高一大截。test-time compute 的代表。
  example: 这道奥数题给推理模型做正确率 95%，给普通 GPT 才 40%。

- term: extended thinking
  aliases: [扩展思考, extended-thinking]
  category: devterm
  meaning: Claude 3.7 起加的特性——让模型在回答前显式做长时间思考（用户看不见但占 token）。介于"普通 LLM"和"专门推理模型"之间，开/关可控。
  example: Claude 4.5 开 extended thinking 写复杂代码比关掉准很多。

- term: Deep Research
  aliases: [深度研究, deep research]
  category: devterm
  meaning: OpenAI / Anthropic / Google 各家都出的"AI 自动写研究报告"功能——给个题目，AI 自己上网搜十几小时、读几十篇文章、综合写报告。5-30 分钟出几千字深度文章。
  example: 让 ChatGPT Deep Research 做"中国新能源车出口分析"，半小时拿到 30 页报告。

- term: Devin
  aliases: [devin]
  category: devterm
  meaning: Cognition AI 2024 年发的"第一个 AI 软件工程师"——能独立完成端到端编程（读 issue → 写代码 → 跑测试 → 提 PR）。被吹爆又被打脸（演示视频造假争议），但开启了 coding agent 商业化。
  example: Devin 出来时大家担心程序员被淘汰，后来发现还差得远。

- term: Manus
  aliases: [manus]
  category: devterm
  meaning: 蝴蝶效应 2025 年 3 月发的中国版"通用 agent"——能浏览网页、写文档、用电脑。发布时邀请码炒到几千块。让国内 agent 创业热度起飞。
  example: Manus 演示能自己买机票订酒店，刷爆 AI 圈。

- term: v0
  aliases: [v0.dev]
  category: devterm
  meaning: Vercel 出的"AI 生成 UI"产品——你说"帮我做个登录页"，它直接生成 React 代码 + 即时预览。前端原型工具的革命。
  example: 用 v0 一句话生成 dashboard 雏形，再扔到 Cursor 改细节。

- term: Bolt
  aliases: [bolt.new]
  category: devterm
  meaning: StackBlitz 出的"AI 全栈应用生成"——浏览器里跑 Node.js + 调 LLM 生成完整 Web 应用。一句话从前端到部署一把搞定。
  example: 用 Bolt 5 分钟做完 MVP，扔给客户看效果。

- term: Lovable
  aliases: [lovable.dev]
  category: devterm
  meaning: 类似 v0 / Bolt 的 AI 应用生成器——更聚焦"商业可用应用"。2024-2025 欧美创业圈爆火，号称"非技术创始人也能造 SaaS"。
  example: Lovable 让产品经理自己 prototype 出 demo 不用等程序员。

- term: vibe coding
  aliases: [氛围编程, vibe-coding]
  category: devterm
  meaning: Andrej Karpathy 2025 年提的概念——程序员不再逐行写代码，而是用自然语言指挥 AI 写，按"vibe"（感觉）来。Cursor / Windsurf / Claude Code 都是 vibe coding 工具。
  example: 现在我写代码基本都是 vibe coding，自己敲键盘的时间不到 10%。

- term: AI native
  aliases: [AI 原生, AI-first, AI 优先]
  category: devterm
  meaning: 从架构开始就基于 AI 设计的产品/工具，而不是给老产品贴 AI 标签。Cursor 是 AI native 编辑器，VS Code + Copilot 插件不是。
  example: 真正的 AI native 应用，AI 是核心交互不是辅助按钮。

- term: agentic
  aliases: [agentic AI, Agentic]
  category: devterm
  meaning: agent 的形容词——形容系统"有多大 agent 自主性"。"高 agentic"=自主决策强、人少干预；"低 agentic"=每步要人确认。agent 是名词二选一，agentic 是程度连续值。
  example: ChatGPT 普通对话 agentic 低，自动写报告的 Deep Research agentic 高。

- term: DeepSeek
  aliases: [深度求索, deepseek]
  category: devterm
  meaning: 中国 AI 公司，2025 年初发的 V3/R1 模型震惊全球——600B 参数、训练成本只 OpenAI 1/10、开源且性能逼平 GPT-4。2025 年度热词。
  example: DeepSeek R1 出来后大家发现中国 AI 也能做到 SOTA。

- term: Qwen
  aliases: [通义千问, 千问, qwen, 通义]
  category: devterm
  meaning: 阿里巴巴的开源大模型系列——Qwen 1/2/2.5/3 几代，中文场景强项。和 DeepSeek、Llama 鼎立开源圈。
  example: 中文任务用 Qwen 微调，比 Llama 强很多。

- term: Kimi
  aliases: [月之暗面, Moonshot, kimi]
  category: devterm
  meaning: 月之暗面公司出的对话产品。2024 火过一阵主打超长上下文（200 万字），2025 推出 K2 强化推理。
  example: 长文档分析用 Kimi 比 GPT 强，能塞 200 万字。

- term: 豆包
  aliases: [Doubao, doubao]
  category: devterm
  meaning: 字节跳动出的对话产品。中文 C 端 AI 助手第一阵营。和文心一言、Kimi、智谱清言抢用户。
  example: 我妈用豆包帮她写文章，比百度搜好用。

- term: 智谱
  aliases: [GLM, 智谱清言, ChatGLM]
  category: devterm
  meaning: 智谱 AI（GLM 系列）——清华系出来的国产 AI 公司，模型 GLM-4 / GLM-4.5 等。To B 业务做得好。
  example: 政企客户多用智谱的私有化部署。

- term: 通义灵码
  aliases: [Lingma, 灵码]
  category: devterm
  meaning: 阿里出的 AI 编程助手——对标 GitHub Copilot 和 Cursor。集成进 VS Code、JetBrains。国内大厂 AI 编程工具的代表。
  example: 用通义灵码补全代码省 50% 打字。

- term: Claude Code
  aliases: [claude code, claudecode]
  category: devterm
  meaning: Anthropic 2025 年发的命令行 AI 编程工具——直接在 terminal 跑 claude 让 AI 接管编程任务。支持 Sub-agent、Skills、MCP 等高级特性。和 Cursor 抢用户但定位更"命令行原生"。
  example: 用 Claude Code 让 AI 接管整个 PR 流程，自己读 issue 写代码提 PR。

- term: AI Worker
  aliases: [AI 员工, AI 工人, AI workforce, Workforce, workforce]
  category: devterm
  meaning: 把 AI agent 部署成"虚拟员工"的产品形态——能自动处理客服、邮件、报告。和 chatbot 区别：worker 主动干活而非被动应答。Salesforce 的 Agentforce 是代表。
  example: Salesforce Agentforce 把 AI Worker 直接卖给企业当客服。

- term: 端到端
  aliases: [端到端流程, 端到端 agent]
  category: devterm
  meaning: 从输入到输出全链路一气呵成——比如端到端 agent 从读 issue 到部署代码全自动，中间不用人介入。也常用于机器学习（端到端训练）。注意：和已有 e2e（end-to-end 测试）相关但侧重不同，e2e 那条专指测试。
  example: 端到端 agent 让小公司也能跑出大厂级自动化流程。

- term: test-time compute
  aliases: [推理时计算, 推理阶段算力, inference-time compute]
  category: devterm
  meaning: 模型在推理（不是训练）阶段消耗的计算量。推理模型靠 inference 时多想（多花算力）换准确率，是 2024-2025 的新 scaling law。
  example: o1 的优势在 test-time compute——回答前默想 30 秒比 GPT-4 准。

- term: 低代码
  aliases: [low-code, no-code, 无代码, lowcode]
  category: devterm
  meaning: 通过拖拽控件/可视化配置代替写代码搭应用。让产品/运营也能造工具。钉钉宜搭、飞书 Aily、Bubble 都是。LLM 出现后又被冲击——AI 写代码更灵活。
  example: 老板让 HR 自己用低代码搭个考勤系统。

- term: AI 编程
  aliases: [AI coding, AI 编码, AI 写码]
  category: devterm
  meaning: 用 AI 辅助或主导写代码的实践。从 Copilot 补全（辅助）→ Cursor 对话（伙伴）→ Devin/Claude Code（接管）三代演进。2024-2026 程序员行业最大变革。
  example: AI 编程让一个人能干以前小团队的活，但也加剧"会用 AI 的卷死不会用的"。

- term: 上下文腐烂
  aliases: [context rot]
  category: devterm
  meaning: LLM 对话太长后"记性变差"——开头说过的事到后面忘了或弄混。即使在 context window 内也会发生，是注意力机制的固有问题。Sub-agent 设计就是为解决它。
  example: 这个 agent 跑了两小时上下文腐烂，把 user 名字记错了。

# ====================
# 新一代 AI 编程工具（2024-2026）
# ====================

- term: Cline
  aliases: [cline]
  category: ai
  meaning: VS Code 上最火的开源 AI 编程 agent 插件——能自己读代码、改代码、跑命令。完全开源，配各种 LLM 用。Claude Code/Cursor 的开源平替。
  example: 装 Cline 插件后 VS Code 也能用 Claude 做 agent 编程。

- term: Aider
  aliases: []
  category: ai
  meaning: 命令行 AI 编程工具——开源、跑在终端里、和 git 深度集成。改完自动提 commit。极客圈口碑很高的轻量级 Claude Code 平替。
  example: 用 Aider 在终端里跟 GPT-4 结对编程。

- term: Continue
  aliases: [continue.dev]
  category: ai
  meaning: 开源的 VS Code/JetBrains AI 编程插件——Cursor 的开源替代。可以配置任意 LLM（包括本地模型）。企业自部署友好。
  example: 公司不让用 Cursor，装 Continue 配自家模型。

- term: Codex
  aliases: [OpenAI Codex, codex CLI]
  category: ai
  meaning: OpenAI 早年训的代码模型（已弃），2025 年 OpenAI 重新发了 Codex CLI——和 Claude Code 同类的命令行 agent。
  example: OpenAI 推 Codex CLI 对标 Claude Code。

- term: Tabnine
  aliases: []
  category: ai
  meaning: 最早的 AI 代码补全工具之一——比 Copilot 早。企业级私有部署友好，安全合规向。被 Copilot 抢了大部分市场。
  example: 这家金融公司装 Tabnine 私有化，不让用 Copilot。

- term: Codeium
  aliases: []
  category: ai
  meaning: 免费 AI 代码补全工具——Copilot 的免费替代品。后来出了 Windsurf IDE。个人开发者用得多。
  example: 自己玩玩用 Codeium，不用花 Copilot 订阅费。

- term: Replit Agent
  aliases: []
  category: ai
  meaning: Replit 推的网页版 AI 编程 agent——你描述需求，它在浏览器里直接帮你建项目、写代码、部署。零环境配置就能上手做小项目。
  example: 用 Replit Agent 一句话搭出了个小工具部署。

- term: Trae
  aliases: []
  category: ai
  meaning: 字节跳动 2024 年底推的 AI IDE——对标 Cursor。免费、内置豆包大模型、中文环境友好。国内开发者用得多。
  example: 国内用 Trae 替代 Cursor 没法支付的问题。

- term: Zed
  aliases: []
  category: platforms
  meaning: Rust 写的现代代码编辑器——前 Atom/GitHub 团队做的。原生快、对协作和 AI 支持好。VS Code 之外的另一条路线。
  example: 试了下 Zed，启动快得离谱。

- term: Junie
  aliases: []
  category: ai
  meaning: JetBrains 自家 2025 年推的 AI 编程 agent——内置到 IntelliJ/PyCharm 等全家桶。对标 Cursor 但专注 JetBrains 用户。
  example: 用 Junie 在 IntelliJ 里写 Java，比 Copilot 更懂项目结构。

- term: RooCode
  aliases: [Roo Code]
  category: ai
  meaning: Cline 的一个流行 fork——加了更多模式（架构师/代码/问答），可自定义 prompt。开源 agent 圈活跃项目。
  example: 用 RooCode 配 Claude 做大型重构。

- term: Augment
  aliases: [Augment Code]
  category: ai
  meaning: 企业级 AI 编程平台——主打"理解超大代码库"。融了几亿美金，硅谷新星。卖给大公司。
  example: Augment 主打能吃下 Google 量级的 monorepo。

# ====================
# AI 框架 / 库 / 工具（v3 补漏）
# ====================

- term: smolagents
  aliases: [smol agents, smolagent]
  category: ai
  meaning: HuggingFace 2024 年底推的极简 agent 框架——核心思路是让 LLM 直接生成 Python 代码（CodeAgent）而非 JSON tool call，更灵活更省 token。"smol"=small，几百行实现一个 agent 库。
  example: 用 smolagents 几十行代码就跑通了一个 search agent。

- term: PydanticAI
  aliases: [pydantic ai, pydantic-ai]
  category: ai
  meaning: Pydantic 团队 2024 年推的 agent 框架——核心卖点是"用 Pydantic 模型定义输出和工具"，类型安全、IDE 自动补全。FastAPI 那套体验搬到 agent 圈。Python 圈技术口碑很好。
  example: 我们 agent 用 PydanticAI 写，类型安全好维护。

- term: DSPy
  aliases: [dspy]
  category: ai
  meaning: Stanford 出的 prompt 编程框架——不让你手写 prompt 字符串，而是声明输入输出"签名"，DSPy 自动用样本优化 prompt。"程序合成 prompt"思路代表作。
  example: 用 DSPy 自动优化 prompt，比手调好 20%。

- term: Instructor
  aliases: [instructor python]
  category: ai
  meaning: 让 LLM 输出结构化数据（Pydantic 对象）的 Python 库——自动重试、自动校验、自动重新 ask。OpenAI structured output 出来前最流行的方案，现在仍广泛用。
  example: 用 instructor 提取 JSON 比手写 prompt 稳很多。

- term: Outlines
  aliases: [outlines python]
  category: ai
  meaning: 强约束输出库——能让 LLM 100% 输出合法 JSON/正则/上下文无关文法。靠在采样阶段直接屏蔽不合规 token 实现。本地模型场景非常实用。
  example: 用 Outlines 跑 Llama 输出严格符合 JSON Schema。

- term: LiteLLM
  aliases: [litellm]
  category: ai
  meaning: 统一 LLM API 调用的代理层——一份代码同时调 OpenAI/Anthropic/Gemini/本地模型。屏蔽差异、做负载均衡、限流。BerriAI 出品，开源极火。
  example: 用 LiteLLM 当代理层，模型供应商随便切。

- term: llama.cpp
  aliases: [llamacpp]
  category: ai
  meaning: Georgi Gerganov 写的 C++ LLM 推理引擎——核心创新：把模型量化（INT4/INT8）让笔记本能跑 Llama。本地 LLM 革命的引擎。Ollama、LM Studio 都基于它。
  example: MacBook M3 上用 llama.cpp 跑 Llama 70B Q4 量化版。

- term: LM Studio
  aliases: [lmstudio]
  category: ai
  meaning: 桌面应用——本地一键下载和跑 Llama/Qwen/Mistral 等模型。图形界面友好，适合不想敲命令行的人。Mac/Windows/Linux 全平台。
  example: 用 LM Studio 本地跑 Qwen 写日记。

- term: Open WebUI
  aliases: [open webui, openwebui]
  category: ai
  meaning: 给本地 LLM（通过 Ollama）套一个像 ChatGPT 的 Web 聊天界面。开源、自部署、社区超活跃。是"用 Ollama 跑本地模型"的事实标准前端。
  example: 用 Open WebUI + Ollama 搭了私有 ChatGPT。

- term: LangFlow
  aliases: [langflow]
  category: ai
  meaning: 拖拖拽拽搭 LangChain 应用——可视化 agent/RAG 编排。对不会写代码的非技术用户友好。开源。
  example: 给运营用 LangFlow 搭了一个客服 bot。

- term: Flowise
  aliases: [flowise]
  category: ai
  meaning: 和 LangFlow 同类——拖拽搭 AI 应用，基于 LangChain。开源、Node.js。两家在抢同一个生态位。
  example: 用 Flowise 搭了内部知识库问答。

- term: n8n
  aliases: []
  category: platforms
  meaning: 开源的工作流自动化平台——本来是"Zapier 平替"，2024 年起接 LLM 节点变成"AI 自动化"利器。能本地部署。技术圈和小公司很爱用。
  example: 用 n8n 搭了一个微信群消息归档到 Notion 的 agent 工作流。

- term: Dify
  aliases: []
  category: ai
  meaning: 中国开源的 LLM 应用开发平台——Web 界面里建 chatbot/agent/RAG/工作流，能接所有主流 LLM。开源版+SaaS 双轨。被国内中小公司广泛采用做企业 AI 应用。
  example: 公司用 Dify 自部署了一套客服 bot。

- term: FastGPT
  aliases: [fastgpt]
  category: ai
  meaning: 中国开源的"基于 LLM 的知识库问答"系统——和 Dify 是同类竞品。专注 RAG 场景，工作流灵活。开源活跃。
  example: 部署 FastGPT 做了内部文档检索。

- term: Coze
  aliases: [扣子, coze.com, coze.cn]
  category: ai
  meaning: 字节跳动的 AI agent 开发平台——海外版叫 Coze、国内版叫"扣子"。零代码搭 bot、能发布到飞书/微信/Discord。商业化 Dify 的对手。
  example: 用 Coze 搭了一个抖音运营助手发到飞书。

- term: AG2
  aliases: [ag2]
  category: ai
  meaning: 多 agent 协作框架——前身是微软 AutoGen，2024 年改名 AG2 独立运营。让多个 agent 互相对话完成复杂任务的代表框架之一。
  example: 用 AG2 搭了"产品+开发+QA"三个 agent 协作生成项目代码。

- term: Mastra
  aliases: [mastra]
  category: ai
  meaning: TypeScript 的 agent 框架——Gatsby 创始人做的。主打"在 TS 项目里写 agent"，前端工程师友好。2024 年新晋热门项目。
  example: 用 Mastra 在 Next.js 项目里直接写 agent。

- term: Marvin
  aliases: [marvin ai]
  category: ai
  meaning: Prefect 团队做的 AI 工具库——把 LLM 包装成"AI 函数"（用装饰器声明）。Python 圈技术派喜欢，但生态比 LangChain 小。
  example: 写小工具用 Marvin 比 LangChain 简洁。

- term: AgentChat
  aliases: [agent chat]
  category: ai
  meaning: AutoGen/AG2 团队 2024 年重构出的新核心——更现代的多 agent 对话框架，作为 AG2 内的下一代 API。和老 AutoGen 设计哲学有差异。
  example: 新项目用 AgentChat 而不是老 AutoGen API。

- term: TGI
  aliases: [Text Generation Inference]
  category: abbr
  literal: Text Generation Inference
  meaning: HuggingFace 出的 LLM 推理引擎——生产级、企业向。和 vLLM 是直接竞品。提供 OpenAI 兼容 API、连续批处理。
  example: HF 内部用 TGI 部署他家所有 model。

- term: Haystack
  aliases: [haystack ai, deepset]
  category: ai
  meaning: deepset 公司开源的 RAG/搜索框架——和 LlamaIndex 同类。德国团队做的，企业级用户多。在 NLP 圈历史比 LLM 圈早。
  example: 这家欧洲企业用 Haystack 做内部知识库。

- term: Comet
  aliases: [comet browser, perplexity comet]
  category: ai
  meaning: Perplexity 推出的 AI 浏览器——内嵌 AI agent，能自动总结网页/对比商品/填表/订机票。和 Arc、The Browser Company 等 AI 浏览器赛道竞争。
  example: 装了 Comet 浏览器，购物前自动比价超方便。

# ====================
# 中文 AI 圈高频词（媒体/产品/职场语境必备）
# ====================

- term: AIGC
  aliases: [AI Generated Content, AI 生成内容, 生成式 AI 内容]
  category: abbr
  literal: AI Generated Content
  meaning: AI 生成的内容——文字、图片、视频、音乐、代码全算。中文媒体最爱用的"统称"词。2022 年底 ChatGPT 出来后"AIGC 元年"叫了一整年。国内监管层"AIGC 服务管理办法"也是这词。和"生成式 AI（GenAI）"几乎同义，但 AIGC 偏内容产物视角、GenAI 偏技术能力视角。
  example: 这家做 AIGC 营销文案工具，月活破百万。

- term: GenAI
  aliases: [Generative AI, 生成式 AI, 生成式人工智能]
  category: abbr
  literal: Generative AI
  meaning: 能"生成新东西"的 AI——和"判别式"（判断猫/狗）相对。LLM、Stable Diffusion、Sora 都是 GenAI。麦肯锡 2023 年《GenAI 的经济影响》报告把这词推向主流。Gartner 把它列入 Top 10 战略技术多年。
  example: GenAI 让普通员工的产能拔升 30%——麦肯锡口径。

- term: 大模型
  aliases: [foundation model, 基础大模型, 通用大模型]
  category: ai
  literal: large (language) model / foundation model
  meaning: 中国 AI 圈对 LLM 的本土化叫法——一般指千亿参数级别、能干多种任务的预训练大模型。Stanford 2021 年提"foundation model"的官方对应。GPT-4、Claude、Gemini、Llama、DeepSeek、文心、通义、豆包都是大模型。和"小模型/专用模型"对应。"百模大战"是 2023-24 中国 AI 圈奇景。
  example: 这家创业公司又自研了一个大模型，市场反应平平。

- term: 具身智能
  aliases: [embodied AI, embodied intelligence, 具身 AI]
  category: ai
  literal: embodied intelligence
  meaning: 有"身体"的 AI——不只是聊天框里的 LLM，而是装在机器人/无人车/穿戴设备上、能感知物理世界并动手做事的 AI。2024-25 中国 AI 圈最大风口之一（人形机器人浪潮）。宇树科技、智元、银河通用是国内代表。Tesla Optimus、Figure 01 是海外代表。
  example: 具身智能赛道国内一年融了 200 亿。

- term: 世界模型
  aliases: [world model]
  category: ai
  literal: world model
  meaning: AI 在脑内"模拟物理世界"的能力——看几帧视频就能预测下一帧、想象一个不存在的场景。Yann LeCun 2022 年起力推 LeCun 的 JEPA 路线就是世界模型，反对纯 LLM 路线。Sora、Genie、Cosmos 也算。"AI 有没有世界模型"是路线之争核心。
  example: LeCun 说 LLM 没有世界模型，永远到不了 AGI。

- term: 文生图
  aliases: [text-to-image, T2I]
  category: ai
  literal: text-to-image
  meaning: 输入一句话生成一张图——Stable Diffusion、Midjourney、DALL-E、即梦、可灵图都是。2022-23 引爆 AIGC 风口。和"图生图"（image-to-image，参考图改图）配套。中国"文生图"app 月活前三：即梦/可灵/通义万相。
  example: 用文生图给小说插画，10 秒一张。

- term: 文生视频
  aliases: [text-to-video, T2V]
  category: ai
  literal: text-to-video
  meaning: 输入一句话生成一段视频——OpenAI Sora 引爆。国内可灵（快手）、即梦（字节）、Vidu、Hailuo 都是文生视频代表。和"图生视频""视频续写"配套。一分钟生成一段视频的成本从几十美金降到几毛钱。
  example: 文生视频做短视频开头，一天能产 50 条素材。

- term: 算力
  aliases: [compute, computing power, AI compute]
  category: ai
  literal: compute / computing power
  meaning: AI 训练/推理需要的 GPU 计算能力——衡量单位 TFLOPS / FLOPs。"算力是 AI 时代的电力"是 2023 年最火比喻。OpenAI 训 GPT-4 据估烧了 1 亿美金算力。"国产算力"指华为昇腾、寒武纪等替代 NVIDIA。"算力荒"是真实存在的——H100 在中国限制出口。
  example: 这家初创公司光算力预算就 5 亿一年。

- term: 算力卡
  aliases: [GPU 卡, AI 芯片]
  category: ai
  literal: AI accelerator chip
  meaning: 专用于 AI 训练/推理的芯片——NVIDIA H100/H200/B200、华为昇腾 910B/910C、寒武纪思元、AMD MI300。一张 H100 黑市曾炒到 40 万人民币。"显存大小"是算力卡的核心指标（决定能跑多大模型）。
  example: 公司囤了 1000 张 H100 算力卡，估值翻倍。

- term: 百模大战
  aliases: []
  category: ai
  literal: war of 100+ Chinese LLMs
  meaning: 2023 年中国互联网公司+创业公司+大学+央企集体下场训练大模型的盛况——一年内冒出 100+ 大模型。"清华系六小虎"、"BAT+字节+华为"+"AI 四小龙" 都来。2024 年开始洗牌，DeepSeek、智谱、阶跃、月之暗面 等留下。
  example: 百模大战烧了 200 亿，活下来不超过 20 家。

- term: AI 元年
  aliases: [Year of AI]
  category: ai
  literal: the year AI went mainstream
  meaning: 中文媒体最爱给"某年是 AI 元年"贴标签——2017（AlphaGo）、2018（BERT）、2022（ChatGPT）、2023（GPT-4 + 文生图 + AIGC）、2024（Sora + 智能体）都被叫过。叫得多了反讽——"AI 元年喊了 5 年还在元年"。
  example: 2025 又被叫 "智能体元年"，听腻了。

- term: 知识库
  aliases: [knowledge base, KB, vectorstore]
  category: ai
  literal: knowledge base (RAG)
  meaning: RAG 系统里检索的"外脑"——把公司文档/产品 wiki/法规条文切片+向量化存起来。用户提问时先去知识库找最相关几段塞进 prompt。Coze、Dify、扣子、Notion AI 都做知识库。和"通用大模型"区别：知识库提供专有数据。
  example: 给客服 bot 接公司知识库，准确率从 60% 提到 92%。

- term: 提示词工程师
  aliases: [prompt engineer, AI 训练师]
  category: ai
  literal: prompt engineer
  meaning: 2023 年炒得最热的新职业——专门给 LLM 写 prompt 让它干活。年薪一度被传 30-50 万美金。但 2024 后被 Claude / GPT-4 的"自然语言能听懂"打回原形，专职岗位大减、变成所有岗位都该会的基础技能。
  example: 这岗位 JD 写"3 年提示词工程师经验"，明显是泡沫。

- term: AI 工程师
  aliases: [AI engineer, ML engineer]
  category: ai
  literal: AI engineer
  meaning: 偏工程实现的 AI 岗位——和算法工程师区别：算法偏研究和模型开发、AI 工程师偏把模型集成进产品。Latent Space 团队推广的"新岗位"叫法。月薪国内 30-80k、硅谷 30-50w 美金。"AI 全栈"=前端+后端+模型微调全包。
  example: 这家招 AI 工程师，要求会 LangChain + FastAPI + 微调 LLM。

- term: 算法工程师
  aliases: [algorithm engineer, ML scientist, 算法工程]
  category: ai
  literal: algorithm engineer
  meaning: 中国互联网公司的核心技术岗——做推荐、广告、CV、NLP、风控算法。和 AI 工程师区别：算法工程师偏研究和模型本身、AI 工程师偏工程集成。字节跳动算法工程师"七天速成"梗源于这岗位。月薪 30-80k、大厂顶尖能上百万。
  example: 字节算法工程师卷度全行业第一。

- term: 数据标注师
  aliases: [data labeler, data annotator, 标注员]
  category: ai
  literal: data annotator
  meaning: 给训练数据打标签的人——AI 训练的"流水线工人"。低端：图片框框、文字分类；高端：RLHF 评分员（要 PhD）。2023 后 AI 大厂为 RLHF 招"高端标注师"开 5-10w 美金，"数据标注"从血汗工厂变白领新岗。Scale AI 是巨头。
  example: 数据标注师月薪 3w 看起来低，但 Scale AI 高端标注 5 万刀年薪。

- term: 跑模型
  aliases: [训模型]
  category: slang
  literal: training/running ML models
  meaning: AI 工程师 / 研究员日常术语——可以指训练（"跑实验"）也可以指推理（"用 vLLM 跑模型"）。"跑通了" =实验跑出基线，"跑挂了" =训练崩溃 OOM 或 NaN loss。互联网公司面试"你跑过什么模型"是核心问题。
  example: 这家招人要求"跑过 70B 以上大模型"。

- term: 炼丹
  aliases: [alchemy, ML alchemy]
  category: slang
  literal: ML alchemy
  meaning: 训练神经网络的"调参"过程像炼丹——加入数据/参数像加药材，烧炉子（GPU）几小时几天，开炉看效果好坏全靠玄学。"炼丹师"=ML 工程师自嘲。"炼丹失败"=训了很久 loss 不降。"丹方"=超参数配置。
  example: 这次炼了一周丹效果还不如上次，玄学。

- term: 后训练
  aliases: [post-training, alignment training]
  category: ai
  literal: post-training
  meaning: 预训练完后让模型"会说话/听话"的阶段——SFT（监督微调）+ RLHF（人类反馈强化学习）+ DPO。预训练学的是"什么字接什么字"，后训练教它"如何当一个有用、无害、诚实的助手"。Anthropic、OpenAI 的 secret sauce 大半在后训练。
  example: 这模型预训练强但后训练拉胯，回答动不动开始胡说。

- term: DeepSeek 时刻
  aliases: [DeepSeek moment]
  category: slang
  literal: DeepSeek moment
  meaning: 2025 年 1 月 DeepSeek-R1 发布——以 1/20 的训练成本做出和 OpenAI o1 持平的推理模型。NVIDIA 单日跌 17%、美国 AI 行业集体震动。"DeepSeek 时刻"成中国 AI 出海里程碑、也是"算力护城河"叙事的最大裂痕。
  example: DeepSeek 时刻之后，硅谷再也不敢小看中国 AI 团队。

- term: 国产替代
  aliases: [domestic substitution]
  category: jargon
  literal: domestic substitution (semiconductor / AI)
  meaning: 用国产产品替代被卡脖子的进口——AI 圈主要指芯片（华为昇腾替 H100）、框架（昇思替 PyTorch）、生态（飞桨/MindSpore 替 PyTorch）。2022 年美国出口管制后成主旋律。资本市场最大主题之一。
  example: 这家全栈国产替代，从训练框架到推理芯片都不用 NVIDIA。

- term: AI 教父
  aliases: [Godfather of AI]
  category: ai
  literal: Godfather of AI
  meaning: 通常指深度学习三巨头 Geoffrey Hinton（多伦多）、Yann LeCun（NYU/Meta）、Yoshua Bengio（蒙特利尔）——2018 年图灵奖共同获奖人。Hinton 2023 年从 Google 离职公开担忧 AI 风险后"AI 教父"标签更猛。也偶尔加 Andrew Ng、Karpathy（年轻一代叫"AI 网红"更多）。
  example: AI 教父 Hinton 警告 AI 风险，业界震动。

- term: 奇点
  aliases: [singularity, technological singularity, AI 奇点]
  category: ai
  literal: technological singularity
  meaning: 假设 AI 智能超越人类后引发的连锁飞跃点——技术发展进入无法预测的指数曲线。Ray Kurzweil 2005 年《奇点临近》预言 2045 年到来。Sam Altman、Elon Musk 都引用过。AI 末日论 vs AI 加速论的核心分歧词。
  example: Kurzweil 还在坚持 2045 奇点，越来越多人觉得更早。

- term: 超对齐
  aliases: [superalignment]
  category: ai
  literal: superalignment
  meaning: 让"比人类聪明的 AI"和人类目标一致的技术——OpenAI 2023 年专门成立 superalignment 团队、Ilya Sutskever 领衔，承诺 20% 算力投入。2024 年 Ilya 离开、团队解散，引发"OpenAI 是否还认真做安全"的质疑。Anthropic 在做类似工作但叫"Constitutional AI / RSP"。
  example: 超对齐团队解散后，OpenAI 安全叙事崩了一半。

- term: AI 安全
  aliases: [AI safety]
  category: ai
  literal: AI safety
  meaning: 防止 AI 造成大规模伤害的研究——包括对齐（让 AI 听话）、可解释性（看懂 AI 在想啥）、能力评估（测 AI 多危险）、policy（监管协调）。Anthropic 的存在意义、OpenAI 的争议焦点、英国 AI Safety Institute、Frontier Model Forum 都围绕这个。
  example: Anthropic 整个公司就是为 AI 安全而生。

- term: AI 平权
  aliases: [democratize AI, AI 民主化]
  category: ai
  literal: democratize AI
  meaning: 让 AI 能力下放给每个人——开源模型（Llama、DeepSeek）、低门槛工具（Coze、Dify）、教育普及（吴恩达课程）。Meta 用"AI 平权"为开源策略背书、对抗 OpenAI 闭源。中国"百模大战"+"DeepSeek 平价"也是平权叙事。
  example: 开源模型让 AI 平权，小公司也能跑 70B 模型。

- term: AI 取代
  aliases: [AI replacement, AI 替代人]
  category: ai
  literal: AI replacement of jobs
  meaning: 2023 后最热的社会焦虑——"AI 会不会取代我"。最早倒下的：内容审核、初级翻译、文案、客服、平面设计、入门程序员。Goldman Sachs 预测 3 亿岗位"暴露"AI 影响。Anthropic CEO Dario 估计 5 年内白领初级岗 50% 消失。
  example: 文案岗 AI 取代率最高，3 年内被 GenAI 卷得换岗。

- term: 大模型应用
  aliases: [LLM app, GenAI app, AI 应用]
  category: ai
  literal: LLM-powered application
  meaning: 基于 LLM API 做的产品——Chatbot、AI 搜索、AI 写作、AI 翻译、AI 客服。"套壳"是早期 AI 应用的贬义说法，但"套壳+场景理解+数据"也能做出值钱产品（Perplexity、Cursor 都是）。AI 应用 vs 大模型本体之争是 2024-25 商业化主线。
  example: 这家做大模型应用，把 Claude API 包装成法律助手，年 ARR 500w。

- term: 套壳
  aliases: [LLM wrapper, GPT wrapper]
  category: slang
  literal: LLM API wrapper
  meaning: 直接调用别人家大模型 API 做产品的贬义说法——"你这不就是套了个 GPT 壳吗"。早期被嘲讽，后来发现套壳得好的（Perplexity / Cursor / Notion AI）反而盈利，比自研大模型公司更早赚钱。"套壳与否"已经不是问题、"套壳套得是否聪明"才是。
  example: 这家"套壳"做了 500 万 ARR，比某些自研大模型公司活得好。

# --- batch: Anthropic 模型族 / AI-Native 工作流（《组织的回归》补词）---

- term: Haiku
  aliases: [haiku, Claude Haiku, Claude 3 Haiku, Claude 3.5 Haiku, Claude 4 Haiku, Claude 4.5 Haiku]
  category: ai
  literal: Claude Haiku
  meaning: 想象快餐店三档套餐——便宜快、平衡、豪华全家桶。Haiku 是 Anthropic 三档里最小最快最便宜的那档。轻量任务（分类、判断、摘要、路由）用它最划算。Claude Code 的 /goal 机制就用 Haiku 当裁判模型——评估"目标达成与否"这种判断题不值得动用 Sonnet/Opus。名字来自俳句（最短诗体），和 Sonnet（十四行）/ Opus（史诗）三档分明。
  example: Agent 流水线里用 Haiku 做意图分类，Sonnet 干活，Opus 兜底复杂推理。

- term: Sonnet
  aliases: [sonnet, Claude Sonnet, Claude 3.5 Sonnet, Claude 3.7 Sonnet, Claude 4 Sonnet, Claude 4.5 Sonnet, Claude 4.6 Sonnet]
  category: ai
  literal: Claude Sonnet
  meaning: Anthropic 三档里的中档——价格不离谱、能力够顶大多数任务，是日常主力。写代码、读长文档、跑 agent 的默认选项。Claude Code 默认模型就是 Sonnet。坊间共识：Sonnet 是 Anthropic 投入调优最多的一档，多次公开评测对标 GPT 头部模型。名字来自十四行诗。
  example: 公司项目主力用 Sonnet，省钱又能打，搞不定的活才切 Opus。

- term: Opus
  aliases: [opus, Claude Opus, Claude 3 Opus, Claude 4 Opus, Claude 4.5 Opus, Claude 4.7 Opus]
  category: ai
  literal: Claude Opus
  meaning: Anthropic 三档里的顶配——最聪明也最贵，token 单价比 Sonnet 贵几倍。复杂推理、大型代码重构、长链 agent 规划用它。名字来自 Opus（大型作品/史诗）。2025-2026 年 Claude Opus 4.x 系列在代码评测多次刷榜，"愿意花钱就用 Opus"是 AI 工程圈共识。
  example: 这次大重构切 Opus 一次跑通，花了五刀 token，省了俩小时人工。

- term: DiNOv2
  aliases: [dinov2, DINOv2, DiNO v2]
  category: ai
  literal: self-DIstillation with NO labels v2
  meaning: 想象有人把一亿张图片喂给模型，让它自己学会"看图能不能找出相似的图"——不告诉它图里是什么。DiNOv2 就这么练出来的视觉特征模型。Meta 2023 年开源的自监督视觉 backbone，给图片输出高维 embedding，做检索/分类/检测的下游任务都好用。有 Small/Base/Large/Giant 多个变种 tradeoff 不同。和 CLIP 区别：CLIP 是图文对齐学的、DiNOv2 是纯视觉自监督。CV 圈做 embedding 默认选项之一。
  example: 浮窗专利监控用 DiNOv2 抽图像 embedding 做相似检索，比 ResNet 准得多。

- term: AI-Native Workforce
  aliases: [AI native workforce, AI 员工团队, AI 团队, AI-Native 团队]
  category: ai
  literal: AI-Native Workforce
  meaning: 想象一家公司全员是 AI——每个 AI 有独立邮箱、独立工号、独立记忆、独立岗位档案——这就是 AI-Native Workforce。2025-2026 年新冒出的产品定位（Helio 为代表）：AI 不当"助手"，而是当"同事"。HR Manager、PM、前端、设计师都是独立 AI 角色，有 JD、有审计、彼此能在频道里"吵架"。和 [[AI Worker]] 概念相近但更强调"组织结构原生为 AI 设计"——把人类一百年积累的"职责分离 + 交叉校验"重新装回到 AI 协作里，反对全能 Agent 单点兜底。
  example: Helio 押的就是 AI-Native Workforce 方向，给你招"团队"而不是给你"配置 agent"。
