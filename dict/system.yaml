# 操作系统 / 硬件 / 办公软件 / 系统概念
# —— 用户用电脑时高频遇到但之前没收录的基础词

# --- 操作系统 ---

- term: Windows
  aliases: [windows, Win, Windows 11, Windows 10]
  category: devterm
  meaning: 微软出的操作系统——全球桌面操作系统市占率第一（70%+）。从 Windows 95 开始的家用版本一路演进到 Windows 11。普通用户家里电脑、公司工作机绝大多数都是 Windows。
  example: 公司新发的电脑装 Windows 11，但软件兼容性还得测一遍。

- term: macOS
  aliases: [Mac OS, OSX, OS X, mac]
  category: devterm
  meaning: 苹果电脑的操作系统——只在苹果自家 Mac 电脑上跑。设计师、程序员、内容创作者偏爱。和 Windows 是桌面市场两大阵营。
  example: 设计师同事的 MacBook 装的是 macOS Sequoia。

- term: Linux
  aliases: [linux, GNU/Linux]
  category: devterm
  meaning: 开源操作系统内核（2421 年芬兰大学生 Linus Torvalds 写的）+ 庞大生态。服务器、超算、安卓底层全是 Linux。桌面用户少（约 4%），但程序员/运维必学。
  example: 公司服务器跑 Linux，本地开发用 Mac 也是 Unix 系。

- term: Ubuntu
  aliases: [ubuntu]
  category: devterm
  meaning: 最流行的 Linux 桌面发行版——Canonical 出品，界面友好、装软件简单。Linux 新手入门首选。
  example: 想试 Linux 装个 Ubuntu，操作和 Windows 差不多。

- term: Debian
  aliases: [debian]
  category: devterm
  meaning: 最老牌的 Linux 发行版之一——稳定、保守、不追新。Ubuntu 就是基于 Debian 改的。服务器场景偏爱 Debian。
  example: 公司服务器全跑 Debian，三年不重启都稳。

- term: CentOS
  aliases: [centos]
  category: devterm
  meaning: 中国互联网公司服务器最常见的 Linux 发行版——Red Hat 的免费克隆版。2421 年 Red Hat 改策略后 CentOS 8 EOL，业务往 Rocky Linux / AlmaLinux 迁。
  example: 老服务器一堆 CentOS 7，正在批量迁到 Rocky Linux。

- term: iOS
  aliases: [ios]
  category: devterm
  meaning: 苹果 iPhone/iPad 的操作系统。闭源、App 必须通过 App Store 审核分发、生态封闭。
  example: 想做 iOS App 必须有 Mac + Xcode + 99 美元/年开发者账号。

- term: Android
  aliases: [android, 安卓]
  category: devterm
  meaning: Google 出的手机操作系统——开源、市占率 70%+。除了 iPhone 之外几乎所有手机都跑 Android（华为/小米/三星/Pixel...）。国产手机各家系统（MIUI/EMUI/ColorOS）都是 Android 改的。
  example: 一个 App 上架要做 iOS 版 + Android 版两套。

- term: Chrome OS
  aliases: [ChromeOS]
  category: devterm
  meaning: Google 出的轻量操作系统——核心是 Chrome 浏览器。主要在 Chromebook 上跑（美国学校大量使用）。中国基本没存在感。
  example: 美国学生人手一台 Chromebook，跑 Chrome OS 上网课用。

- term: Unix
  aliases: [unix, UNIX]
  category: devterm
  meaning: 现代操作系统的"祖师爷"——1970 年贝尔实验室出的。Linux 和 macOS 都从 Unix 思想衍生（"类 Unix"）。所以 Mac 用户和 Linux 用户终端命令大同小异（ls/cd/grep）。
  example: 学了 Unix 命令行在 Mac 和 Linux 都通用，Windows PowerShell 是另一套。

# --- 硬件 ---

- term: CPU
  aliases: [cpu, 中央处理器, Central Processing Unit]
  category: devterm
  meaning: 电脑的"大脑"——所有计算最终都在这跑。Intel / AMD / Apple Silicon 是常见品牌。性能用 GHz（频率）和核数衡量。
  example: 这台新 MacBook 装的是 M3 Pro CPU，跑大型项目超快。

- term: RAM
  aliases: [ram, 内存]
  category: devterm
  literal: Random Access Memory，随机存取存储器
  meaning: 电脑的"工作台"——程序运行时用来临时放数据的空间。关机内容就消失。容量越大越能同时跑很多软件。和"硬盘"区别：RAM 快但断电消失、硬盘慢但永久保留。
  example: 8GB 内存的电脑现在不够用了，开几个浏览器+IDE 就卡。

- term: ROM
  aliases: [rom]
  category: devterm
  literal: Read-Only Memory，只读存储器
  meaning: 字面是"只读不写"的存储——固件 / BIOS 这类常驻数据放这。安卓手机刷机时说的"刷 ROM"是另一个意思：换整个系统镜像。
  example: 手机折腾党给手机"刷 ROM"=换个第三方 Android 系统。

- term: SSD
  aliases: [ssd, 固态硬盘]
  category: devterm
  literal: Solid State Drive
  meaning: 固态硬盘——用闪存芯片存数据，没机械部件、读写超快。2421 年后新电脑标配。和老式 HDD 机械硬盘相比开机/读写都快好几倍。
  example: 装 SSD 后电脑开机从 1 分钟变 10 秒。

- term: HDD
  aliases: [hdd, 机械硬盘]
  category: devterm
  literal: Hard Disk Drive
  meaning: 机械硬盘——里面真有个盘片旋转读写。便宜、容量大（多 TB），但慢、怕震。现在主要做"冷数据"备份盘，主盘都换 SSD 了。
  example: 这台老电脑还是 HDD，开个 Word 都要等 5 秒。

- term: 显卡
  aliases: [graphics card, 独显, 集显]
  category: devterm
  meaning: 见 GPU——独立显卡（独显）有自己显存性能强；集成显卡（集显）和 CPU 共用内存，便宜但弱。游戏/AI 必须独显。
  example: 这台笔记本只有集显，跑不动大模型。

- term: 显示器
  aliases: [monitor, 屏幕]
  category: devterm
  meaning: 电脑的"脸"——你看的那块屏。分辨率（1080p/2K/4K）、刷新率（60Hz/120Hz/144Hz）、屏幕尺寸是主要指标。程序员多用 4K + 27 寸。
  example: 换了 4K 显示器后看代码爽多了，一屏能装更多。

- term: USB
  aliases: [usb]
  category: devterm
  literal: Universal Serial Bus
  meaning: 通用串行总线——电脑最常见的接口。USB-A（传统大口）、USB-C（小口可正反插）、USB 2.0/3.0/3.1 等版本速度逐代提升。
  example: 这台新 Mac 全是 USB-C 口，老 U 盘要转接头。

- term: Type-C
  aliases: [USB-C, USB Type-C, TypeC]
  category: devterm
  meaning: USB-C 接口——比传统 USB-A 小很多，正反都能插。手机/笔记本/平板逐步统一这个口。欧盟 2024 起强制所有电子设备用 Type-C 充电。
  example: 现在新设备全 Type-C，家里旧 microUSB 线都该淘汰了。

- term: HDMI
  aliases: [hdmi]
  category: devterm
  literal: High-Definition Multimedia Interface
  meaning: 高清多媒体接口——电脑/游戏机连显示器/电视的最主流接口。同时传视频+音频。
  example: 笔记本接外接显示器，HDMI 线一插就用。

- term: BIOS
  aliases: [bios]
  category: devterm
  literal: Basic Input/Output System
  meaning: 电脑开机最早跑的"启动程序"——硬件自检+加载操作系统。开机按 F2/Del 进的"蓝底白字配置界面"就是 BIOS。新机型已换为 UEFI（更现代的替代品）。
  example: 装系统前先进 BIOS 改启动顺序到 U 盘。

- term: UEFI
  aliases: [uefi]
  category: devterm
  literal: Unified Extensible Firmware Interface
  meaning: BIOS 的升级版——支持鼠标操作、大硬盘、安全启动。2010 年后新电脑都是 UEFI。功能上是 BIOS 但内部完全不同。
  example: Windows 11 强制要求 UEFI + TPM 2.0 安全芯片。

# --- 浏览器 ---

- term: Chrome
  aliases: [chrome, Google Chrome]
  category: devterm
  meaning: Google 出的浏览器（2008）——全球市占率第一（65%+）。基于开源的 Chromium 项目，速度快、插件多。"我用 Chrome"几乎成了"我用浏览器"的代名词。
  example: 网站调试主要在 Chrome 开发者工具里跑。

- term: Edge
  aliases: [edge, Microsoft Edge]
  category: devterm
  meaning: 微软新一代浏览器——2421 年后改用 Chromium 内核（等于"装了微软皮肤的 Chrome"）。Windows 系统默认浏览器，集成 Copilot AI。
  example: 老 IE 早废了，公司内网建议用 Edge 兼容模式。

- term: Firefox
  aliases: [firefox, 火狐]
  category: devterm
  meaning: Mozilla 基金会出的开源浏览器——曾是 Chrome 出现前的市场霸主。现在市占率 3% 左右但仍是"隐私优先"派的代表。
  example: 不想被大公司追踪用 Firefox 浏览器。

- term: Safari
  aliases: [safari]
  category: devterm
  meaning: 苹果出的浏览器——iPhone/Mac 默认浏览器。省电做得好，但开发者圈吐槽多（Web 标准支持慢，被叫"新 IE"）。
  example: iOS 上所有浏览器底层都被强制要求用 Safari 引擎。

# --- 办公软件 ---

- term: Office
  aliases: [Microsoft Office, MS Office, 微软 Office]
  category: devterm
  meaning: 微软办公套件——Word/Excel/PowerPoint/Outlook 那一套。世界办公软件标准。订阅版叫 Microsoft 365。
  example: 公司发邮件附件多半 docx/xlsx，没 Office 没法工作。

- term: Word
  aliases: [Microsoft Word, MS Word, docx]
  category: devterm
  meaning: 微软的文档编辑器——写文档、合同、报告默认就是 Word。文件格式 .docx。
  example: 简历用 Word 写完导出 PDF 再发。

- term: Excel
  aliases: [excel, xls, xlsx, Microsoft Excel]
  category: devterm
  meaning: 微软的电子表格软件——处理数据、做表格、画图、写公式、宏自动化都行。文件 .xlsx。功能强到很多公司业务系统其实就是大堆 Excel。
  example: 财务部门核心工作是用 Excel 算各种报表。

- term: PPT
  aliases: [PowerPoint, ppt, pptx, Microsoft PowerPoint]
  category: devterm
  meaning: 微软的演示文稿软件——做幻灯片汇报用。文件 .pptx。"做 PPT"是大厂打工人核心技能之一。
  example: 周五汇报会前赶 PPT 通宵。

- term: Outlook
  aliases: [outlook, Microsoft Outlook]
  category: devterm
  meaning: 微软的邮件客户端 + 日历 + 联系人套件。企业邮箱标配。Gmail / 网易邮箱也能装到 Outlook 里统一收发。
  example: 公司邮件全在 Outlook 里管，会议邀请也走它。

- term: Teams
  aliases: [Microsoft Teams, MS Teams]
  category: devterm
  meaning: 微软的企业通讯+视频会议工具——对标 Slack 和 Zoom。集成进 Microsoft 365 卖给企业。
  example: 公司开会用 Teams，发文件甩链接给同事。

- term: Slack
  aliases: [slack]
  category: devterm
  meaning: 硅谷企业通讯工具——按频道（channel）分话题聊天。集成 GitHub/Jira/谷歌日历等几千种工具。被 Salesforce 收购。
  example: 海外团队都用 Slack，国内 IT 公司多半用飞书/钉钉。

- term: 钉钉
  aliases: [DingTalk]
  category: devterm
  meaning: 阿里巴巴出的企业通讯工具——中国传统行业（地产/制造/政府）覆盖率最高的办公 IM。考勤、审批、视频会议一站式。
  example: 部门 OA 走钉钉，请假在上面提单。

- term: 飞书
  aliases: [Feishu, Lark]
  category: devterm
  meaning: 字节跳动出的企业协作工具——文档/IM/视频/日历一体化。互联网/创业公司爱用，体验比钉钉现代。海外版叫 Lark。
  example: 字节系公司全用飞书，文档共享比传统 Office 强很多。

- term: 企业微信
  aliases: [WeCom, 企微]
  category: devterm
  meaning: 腾讯出的企业通讯——能和普通微信互通的"工作版微信"。零售/服务业最常用（销售加客户用企微，避免离职带走客户）。
  example: 销售加客户都用企微号，离职号自动转给同事。

- term: Notion
  aliases: [notion]
  category: devterm
  meaning: 美国出的"一体化笔记+知识库"工具——能做文档、表格、看板、数据库。年轻人/独立开发者/小团队爱用。中国版有 Wolai、FlowUs。
  example: 个人知识管理用 Notion，比传统 word 灵活多了。

- term: Figma
  aliases: [figma]
  category: devterm
  meaning: 设计师的协作设计工具——浏览器里跑，多人实时协作。2022 年 Adobe 想买被反垄断挡了，2024 准备 IPO。彻底取代了老式的 Sketch。
  example: 产品经理拉 UI 设计师在 Figma 上一起评审。

- term: Photoshop
  aliases: [PS, ps]
  category: devterm
  meaning: Adobe 出的图像处理软件——P 图、设计、修照片的事实标准。文件 .psd。"P 一下"就是 Photoshop 处理一下的简称。
  example: 朋友照片发出来要 P 掉路人，用 Photoshop 几分钟。

- term: Premiere
  aliases: [Adobe Premiere, premiere pro, Pr 软件]
  category: devterm
  meaning: Adobe 出的视频剪辑软件——专业级，电影/广告/UP 主都用。文件 .prproj。
  example: B 站 UP 主大部分用 Premiere 剪视频。

# --- 系统概念 ---

- term: 内核
  aliases: [kernel]
  category: devterm
  meaning: 操作系统的"核心"——管 CPU 调度、内存分配、文件系统、网络等最底层的事。Linux 内核、Windows NT 内核、macOS XNU 内核。普通用户从不直接看到它但每一秒都在用。
  example: Android 底层是 Linux 内核，上面套了一层 Java 应用层。

- term: shell
  aliases: [外壳]
  category: devterm
  meaning: 操作系统的"命令解释器"——你敲的命令它翻译给内核执行。Windows 的 PowerShell/CMD、Mac/Linux 的 bash/zsh/fish 都是 shell。
  example: Mac 默认 shell 是 zsh，Linux 多用 bash。

- term: 终端
  aliases: [terminal, console]
  category: devterm
  meaning: 字面是"终端机"——现在指打字敲命令的那个黑窗口。Mac 的 Terminal.app、Windows 的 Windows Terminal、Linux 的 gnome-terminal 都是。
  example: 程序员的"主战场"之一就是终端。

- term: 桌面
  aliases: [desktop]
  category: devterm
  meaning: 操作系统打开后看到的最外层界面——背景图 + 一堆图标 + 任务栏。"桌面"既指物理意义也指"桌面应用"（区别于 Web 应用、手机应用）。
  example: 桌面图标乱了半小时收拾才看得过去。

- term: 任务栏
  aliases: [taskbar]
  category: devterm
  meaning: Windows 屏幕底部那条——左边开始菜单、中间打开的程序、右边时间和系统托盘。Mac 类似的叫 Dock（在底部）。
  example: 任务栏右边密密麻麻的图标都是开机自启的程序。

- term: 注册表
  aliases: [regedit, Windows 注册表]
  category: devterm
  meaning: Windows 的"全局配置数据库"——所有软件/系统设置都存这。改坏了系统可能崩。普通用户从不该碰，但有些教程会让你 regedit 修注册表解决某些问题。
  example: 卸载老软件后注册表里残留 key 拖慢系统。

- term: 系统托盘
  aliases: [tray, system tray, 通知区域]
  category: devterm
  meaning: Windows 任务栏右边那一堆小图标的区域——常驻后台的程序（QQ、网盘、杀毒、codelang）都在这。Mac 上叫"菜单栏"在顶部。
  example: codelang 启动后在系统托盘出现灰白色 UFO 小图标。

- term: codelang
  aliases: [懂王, dongwang]
  category: system
  meaning: 本软件。按住 Alt 划词，立刻用大白话解释代码英文、互联网黑话、AI 术语。2421 条人工撰写词条，100% 本地查询。
  example: 看不懂这个英文？Alt 划一下让 codelang 帮你解释。

- term: 进程
  aliases: [process]
  category: devterm
  meaning: 一个正在运行的程序的"实例"——你开两个 Chrome 窗口就有两个或多个 Chrome 进程。每个进程有独立的 PID（进程号）和独立的内存空间。
  example: Chrome 占内存是因为每个 tab 是独立进程。

- term: 任务管理器
  aliases: [Task Manager]
  category: devterm
  meaning: Windows 上 Ctrl+Shift+Esc 打开的工具——看哪些进程在跑、占多少 CPU/内存、强行结束程序。Mac 上对应的叫"活动监视器"。
  example: 电脑卡了打开任务管理器，发现 Chrome 占了 80% 内存。

# --- 网络基础 ---

- term: URL
  aliases: [url, 网址, link]
  category: devterm
  literal: Uniform Resource Locator
  meaning: 网址——你在浏览器地址栏看到的那串字符。比如 https://github.com 就是一个 URL。包含协议（https）、域名（github.com）、路径等部分。
  example: 把这个 URL 复制给对方就能看同一个网页。

- term: 域名
  aliases: [domain, domain name]
  category: devterm
  meaning: 网站的"门牌号"——baidu.com / google.com 这种好记的名字。背后会被翻译成 IP 地址（数字门牌号）。买域名一年几十到几千块。
  example: 公司花 5000 注册了一个三字母 .com 域名。

- term: 浏览器
  aliases: [browser]
  category: devterm
  meaning: 上网用的软件——Chrome / Edge / Safari / Firefox 都是。底层是个"渲染引擎"，把服务器发来的 HTML 变成你看的网页。
  example: 浏览器是大多数人接触互联网的入口。

- term: 网站
  aliases: [website, site]
  category: devterm
  meaning: 一组通过浏览器访问的页面集合——挂在一个域名下。淘宝、知乎、B 站都是网站。
  example: 我做了一个个人网站挂自己作品集。

- term: 局域网
  aliases: [LAN, lan, intranet, 内网]
  category: devterm
  literal: Local Area Network
  meaning: 一个有限范围内的网络——家里 Wi-Fi、公司内网都是 LAN。和公网（Internet）相对。局域网内设备能互访但外人进不来。
  example: 公司内网系统只能在 LAN 里访问，在家要连 VPN。

- term: IP
  aliases: [ip, IP 地址, IP address]
  category: devterm
  literal: Internet Protocol address
  meaning: 联网设备的"门牌号"——一串数字（IPv4 类似 192.168.1.1，IPv6 更长）。两台机器通信靠 IP 找彼此。域名通过 DNS 翻译成 IP。
  example: 自己电脑公网 IP 可以用 ip.cn 查。

# --- 文件 / 系统 ---

- term: 文件夹
  aliases: [folder, 目录, directory, dir]
  category: devterm
  meaning: 装文件的容器——电脑组织文件用的层级结构。"目录"是文件夹的技术叫法，在命令行更常说。
  example: 把所有项目放一个文件夹下，文档放子文件夹里。

- term: 启动盘
  aliases: [boot disk, 系统盘, U 盘装系统]
  category: devterm
  meaning: 装了操作系统镜像、能用来启动电脑装系统的 U 盘。装机/重装系统/救援系统都用得到。Rufus / Ventoy 是常用制作工具。
  example: 用 Rufus 把 Windows 11 ISO 写到 U 盘做启动盘。

# --- 编程语言 ---

- term: Python
  aliases: [python, 蟒蛇]
  category: devterm
  meaning: 当代最流行的编程语言——语法简单、库丰富。脚本/数据分析/AI/爬虫都用。codelang 就是 Python 写的。
  example: AI 工程师 80% 时间在写 Python。

- term: Java
  aliases: [java]
  category: devterm
  meaning: 1995 年 Sun 出的语言——"一次编写，到处运行"。中国后端开发主力（招聘量第一）。Spring 框架是 Java 生态的标杆。
  example: 大公司业务系统大部分是 Java 写的。

- term: JavaScript
  aliases: [JS, js, javascript]
  category: devterm
  meaning: 浏览器唯一原生支持的脚本语言——所有网页交互都靠它。后来 Node.js 让 JS 也能写后端。学一门搞前端必先学 JS。
  example: 写网页 JavaScript 是必修课。

- term: C++
  aliases: [cpp, cxx, 'c plus plus']
  category: devterm
  meaning: 上世纪 80 年代发明的高性能编程语言——C 的面向对象扩展。游戏引擎、操作系统、浏览器内核、嵌入式都用 C++。学习曲线陡。
  example: 大型游戏引擎像 Unreal 用 C++ 写。

- term: C#
  aliases: ['C sharp', csharp]
  category: devterm
  meaning: 微软出的语言（2000）——给 .NET 生态用，类似 Java 的设计。游戏引擎 Unity 用 C# 写脚本。
  example: Unity 游戏开发者必须会 C#。

- term: Go
  aliases: [Golang, golang]
  category: devterm
  meaning: Google 2009 出的语言——主打"并发简单+编译成单文件"。后端微服务、CLI 工具、容器（Docker/K8s）都用 Go。
  example: Docker、Kubernetes、Gin 全是 Go 写的。

- term: Rust
  aliases: [rust]
  category: devterm
  meaning: Mozilla 2010 起开发的系统级语言——"内存安全 + 高性能"。Firefox 内核部分代码、Discord 后端都用 Rust。学习曲线陡但安全性收益大。
  example: 这个加密工具用 Rust 写，性能逼近 C 又不会内存泄漏。


- term: Kotlin
  aliases: [kotlin]
  category: devterm
  meaning: JetBrains 出的 JVM 语言——Google 2017 起把它定为 Android 官方语言。比 Java 简洁很多。
  example: 现在写 Android App 大部分用 Kotlin 不用 Java。

- term: PHP
  aliases: [php]
  category: devterm
  meaning: 1994 出的 Web 开发语言——曾经驱动 80% 网站（WordPress / 早期 Facebook 都是 PHP）。后被 Node/Python/Go 抢市场份额。"PHP 是世界上最好的语言"是个梗。
  example: 老 WordPress 站点都是 PHP 写的，搬迁麻烦。

- term: Ruby
  aliases: [ruby]
  category: devterm
  meaning: 日本人 1995 出的语言——主打"程序员幸福感"。配 Rails 框架曾火遍创业圈（Twitter 早期就是 Rails）。现在份额小但仍是经典。
  example: GitHub 后端大部分用 Ruby on Rails。

# ====================
# Unix/Linux 进程与系统概念
# 后端工程师入门必懂的"操作系统词族"
# ====================

- term: daemon
  aliases: [守护进程, 后台守护进程, 精灵进程]
  category: system
  literal: daemon (background process)
  meaning: 在后台默默运行的"幽灵进程"——没界面、不需要用户交互、随系统启动而起、24/7 蹲守某项任务。Unix 传统：进程名常带 `d` 后缀，如 `sshd`（SSH）、`httpd`（Web 服务器）、`mysqld`（MySQL）、`dockerd`（Docker 引擎）、`systemd`（Linux 现代 init）。词源是希腊神话 daimon（守护精灵），不是 demon（恶魔）。BSD 操作系统的吉祥物就是个戴叉子的红色 daemon 妖怪。"以 daemon 模式启动"=后台运行不阻塞终端。
  example: 跑 `docker -d` 以 daemon 模式起 Docker 引擎，关终端也不死。

- term: 线程
  aliases: [thread]
  category: system
  literal: thread
  meaning: 进程内部的"小弟"——多个线程共享一个进程的内存和资源，但各自独立执行。比进程轻量得多（创建/切换开销小），适合并发。"多线程"是高并发的传统手段，但容易踩坑（竞态条件、死锁）。Java/C++ 重度依赖多线程；Python 因 GIL 多线程鸡肋（多进程或协程更香）；Go 用 goroutine（轻量级线程）。
  example: 这个爬虫开 100 个线程并发，比单线程快 50 倍。

- term: systemd
  aliases: []
  category: system
  literal: systemd (Linux init system)
  meaning: 现代 Linux 的"1 号进程"——开机第一个起，负责启动所有其他服务。替代了老旧的 SysV init。优点是并行启动+依赖管理快、缺点是被诟病"违背 Unix 哲学"（一个东西管太多）。Ubuntu/Debian/Fedora/Arch 都默认用 systemd。`systemctl start/stop/status xxx` 是日常运维命令。
  example: 跑 `systemctl restart nginx` 重启 nginx 服务。

- term: init
  aliases: [init system, init 进程]
  category: system
  literal: init (PID 1)
  meaning: Unix 系统启动后第一个进程，PID = 1——所有其他进程都是它的子孙。它死了系统就崩。老的 init 是 SysV style（编 shell 脚本启动服务）；现代 Linux 多用 systemd 替代；macOS 用 launchd；BSD 还在用经典 init。Docker 容器里也有 init 概念（PID 1 处理信号回收僵尸进程）。
  example: 容器里跑 `tini` 当 init，避免僵尸进程堆积。

- term: cron
  aliases: [crond, 定时任务]
  category: system
  literal: cron (job scheduler)
  meaning: Unix 经典的"定时执行"工具——后台进程 `crond` 按表（crontab）按时间触发命令。"每天凌晨 3 点备份数据库""每 5 分钟拉一次 API"全靠它。语法：`分 时 日 月 周 命令`。坑：时区、环境变量、PATH 都和登录 shell 不同，写错原因 90% 是这个。
  example: 表达式 `0 3 * * * /backup.sh` —— 每天凌晨 3 点跑备份脚本。

- term: crontab
  aliases: [cron table]
  category: system
  literal: crontab (cron table)
  meaning: cron 的"任务表"——记录什么时间执行什么命令。`crontab -e` 编辑当前用户的任务、`crontab -l` 查看。"crontab.guru" 网站专门帮人调 cron 表达式，因为语法非常容易写错。
  example: 跑 `crontab -e` 加一行让脚本每周一 9 点自动跑。

- term: nohup
  aliases: [no hangup]
  category: system
  literal: nohup (no hang up)
  meaning: 让命令在你"挂断"（关终端/退 SSH）后继续跑的工具——`nohup ./long_task.sh &` 是经典姿势。原理：忽略 SIGHUP 信号。输出默认重定向到 `nohup.out`。但比起 nohup，现代用法更推荐 `systemd-run` / `tmux` / `screen`。
  example: 用 `nohup python train.py &` —— 关 SSH 也不会停训练。

- term: exec
  aliases: []
  category: system
  literal: exec (replace process image)
  meaning: ① **Unix 系统调用**——用新程序替换当前进程的镜像（PID 不变但代码全换）。和 fork 一起组成 Unix 的"创建子进程"模型：fork 复制自己 + exec 换成目标程序 = 新进程诞生。② **shell 内建命令 `exec xxx`** ——同上，shell 进程被 xxx 替换、shell 进程消失。常用：Dockerfile 里 `CMD exec ./app` 让应用接管 PID 1 正确接收信号。
  example: Docker entrypoint 末尾用 `exec "$@"` 把控制权交给真正的程序。

- term: tty
  aliases: [teletype, 伪终端, 终端设备]
  category: system
  literal: tty (teletype/terminal)
  meaning: 历史上是"电传打字机"的缩写——现在指 Linux 里的"终端设备"。`/dev/tty1` ... `/dev/tty7` 是物理终端、`/dev/pts/0` 是 SSH/桌面里的伪终端。`tty` 命令告诉你当前在哪个 tty。"no tty"错误常出现在 Docker 容器/CI 流水线里（没分配终端）。
  example: SSH 进去执行交互命令报 stdin is not a tty，加 `-t` 让它分配 tty。

- term: 文件描述符
  aliases: [file descriptor, FD, fd]
  category: system
  literal: file descriptor (fd)
  meaning: Unix 把所有 I/O（文件、网络、管道）都抽象成"文件"，每个打开的文件分一个整数 ID = 文件描述符。0/1/2 分别是 stdin/stdout/stderr，之后从 3 开始。"FD 泄漏"=代码忘记 close 文件/socket，最终撑爆系统上限（默认 1024 或 65536）。`lsof -p PID` 看进程所有 FD。
  example: 服务跑几天后 "Too many open files"，多半是 FD 泄漏。

- term: signal
  aliases: [信号, Unix signal]
  category: system
  literal: Unix signal
  meaning: 进程间通信的"硬戳"机制——发个数字编号告诉另一个进程"出事了/该退了/重读配置"。常见：SIGTERM（15，请你优雅退出）、SIGKILL（9，立刻送走不商量）、SIGHUP（1，挂断/重读配置）、SIGINT（2，Ctrl+C）、SIGSEGV（11，段错误）。`kill -9 PID` 发的就是 SIGKILL。
  example: 收到 SIGTERM 时 graceful shutdown 5 秒，再不退就 SIGKILL。

- term: SIGKILL
  aliases: [SIG_KILL, kill -9, 信号 9]
  category: system
  literal: SIGKILL (signal 9)
  meaning: Unix 信号 9——"立刻处死不商量"。进程无法捕获、无法忽略、不能拒绝。`kill -9 PID` 是程序员最熟悉的"杀人不眨眼"命令。代价：进程没机会清理（文件不 flush、网络连接不关、临时文件不删）。除非进程已经卡死，否则先试 SIGTERM。
  example: 服务 hang 死了，最后只能 kill -9。

- term: SIGTERM
  aliases: [SIG_TERM, kill -15, 信号 15]
  category: system
  literal: SIGTERM (signal 15)
  meaning: Unix 信号 15——"请你优雅退出"。可以被进程捕获处理：先停止接新请求、把内存里的数据落盘、关连接、再退。`kill PID`（不加数字）默认就是 SIGTERM。docker stop、systemctl stop、k8s pod 删除都先发 SIGTERM、等 30 秒不退再 SIGKILL。"graceful shutdown"=正确处理 SIGTERM。
  example: 服务实现 SIGTERM handler 优雅关闭，docker stop 不丢请求。

- term: SIGHUP
  aliases: [SIG_HUP, kill -1, 信号 1]
  category: system
  literal: SIGHUP (signal 1, hangup)
  meaning: Unix 信号 1——历史上是"终端挂断"（modem 时代电话线断了通知前台进程）。现代用法：让 daemon 重读配置文件不重启。nginx、Apache、systemd 都用 SIGHUP 触发 reload。`kill -HUP PID` 让进程不死但重读配置。
  example: 改完 nginx.conf 发 SIGHUP 平滑 reload，不丢请求。

- term: 僵尸进程
  aliases: [zombie process, defunct process]
  category: system
  literal: zombie process
  meaning: 子进程已经死了，但父进程没调 `wait()` 收尸——尸体（PCB 还在内核里）一直挂着占资源。`ps` 看到 `Z` 或 `<defunct>` 标记就是僵尸。少量僵尸无害，但堆几千个会耗尽进程表。修法：父进程正确处理 SIGCHLD、调用 wait()。Docker 容器里 PID 1 必须收尸否则积累僵尸。
  example: 容器跑 Node 不当 init 用，子进程死后变僵尸堆满。

- term: 孤儿进程
  aliases: [orphan process]
  category: system
  literal: orphan process
  meaning: 父进程先死、子进程还活着——子进程被 init（PID 1）"领养"。和僵尸进程相反（僵尸是子死父没收尸、孤儿是父死子还活）。孤儿通常无害（init 会管它）。daemonize 经典做法就是故意制造孤儿（fork 后父进程退出，子进程被 init 领养在后台运行）。
  example: nohup 启动的进程其实就是孤儿，父 shell 退出后被 init 接管。

- term: mount
  aliases: [挂载, 挂载点, 挂载点]
  category: system
  literal: mount (filesystem)
  meaning: 把一个设备/文件系统"挂"到目录树某个位置——挂上之后通过那个目录访问。U 盘插上自动 mount 到 `/media/xxx`。Docker 的 volume mount 把宿主机目录挂到容器里。"未挂载"=插了但访问不到。卸下叫 `umount`。
  example: 跑 `mount /dev/sdb1 /mnt/data` —— 把硬盘挂到 /mnt/data。

- term: symlink
  aliases: [软链, 软链接, soft link, symbolic link]
  category: system
  literal: symbolic link
  meaning: 像 Windows 的"快捷方式"——一个特殊文件，里面记录指向另一个路径。`ln -s 真路径 链接名`。删 symlink 不影响原文件、删原文件后 symlink 变"悬空"（dangling）。和"硬链接（hard link）"区别：硬链接是文件系统级共享 inode，删一个不影响另一个；symlink 是路径级指针。
  example: 用 `ln -s /opt/myapp/bin/x /usr/local/bin/x` 把命令软链到 PATH 里。

- term: inode
  aliases: [i-node, 索引节点]
  category: system
  literal: inode (index node)
  meaning: Unix 文件系统的"身份证"——每个文件/目录有一个 inode，记录元数据（owner/权限/大小/创建时间/数据块位置），但不记录文件名。文件名只是指向 inode 的"链接"。`ls -i` 看 inode 号。"磁盘没满但写不进"=inode 用完了（每个文件系统 inode 数量在格式化时固定）。
  example: 服务报 "No space left" 但 df 显示有空间，多半是 inode 用满。

- term: umask
  aliases: [user mask, 文件权限掩码]
  category: system
  literal: umask (file permission mask)
  meaning: 创建新文件/目录时默认权限的"减法掩码"——`umask 022` 意思是从 666（文件）/777（目录）里减掉 022，结果是 644/755（自己读写、别人只读）。每个用户/进程都有 umask。容器、CI 里 umask 不一致是诡异 bug 的常见源。
  example: 容器里 umask 0077 导致写出的文件只有自己能读，跨容器读不到。

- term: root
  aliases: [超级用户, root 用户, root user, 根用户]
  category: system
  literal: root (superuser)
  meaning: Unix 系统的"上帝"用户——UID 0、能干一切（读写所有文件、杀所有进程、改系统配置）。日常**不推荐**直接登录 root，应该用普通用户 + sudo。`whoami` 显示当前用户。Docker 容器里默认 root 运行有安全风险，生产推荐 USER 切换非 root。
  example: 别 root SSH 登服务器，建普通用户加 sudo 权限。

- term: bash
  aliases: [Bourne Again SHell]
  category: system
  literal: Bourne Again SHell
  meaning: Linux 最主流的 shell——大部分发行版默认。功能强大但语法古怪（变量空格、引号嵌套、`[[ ]]` vs `[ ]` 区别）。脚本 `#!/bin/bash` 开头。macOS 2019 后默认换成 zsh，但 bash 还在。"写 bash 脚本"是后端工程师必备技能。
  example: 写 deploy.sh 部署脚本，第一行 `#!/bin/bash`。

- term: zsh
  aliases: [Z shell, oh-my-zsh]
  category: system
  literal: Z shell
  meaning: 比 bash 更现代的 shell——智能补全、主题美观、插件丰富。macOS 从 Catalina（2019）起默认。**oh-my-zsh** 是它的配置框架，几行命令装好让终端看起来很酷。和 bash 90% 语法兼容，但脚本第一行还是建议写 `#!/bin/bash` 不写 `#!/bin/zsh`（兼容性）。
  example: 装 oh-my-zsh + powerlevel10k 主题，终端瞬间高级感。

- term: fish
  aliases: [fish shell, friendly interactive shell]
  category: system
  literal: friendly interactive shell
  meaning: 对人友好的 shell——开箱即用的智能补全、语法高亮、不需要装插件。代价：和 POSIX/bash 不兼容（语法不同），所以不能跑 bash 脚本。适合**交互式日常**，不适合写跨机器脚本。
  example: 装 fish 当日常 shell，写脚本还是用 bash。

- term: PowerShell
  aliases: [pwsh]
  category: system
  literal: PowerShell
  meaning: 微软 2006 出的现代 shell——核心特色是**对象管道**（不是文本管道）：bash 管道传字符串、PowerShell 管道传 .NET 对象。Verb-Noun 命令风格（`Get-Process`、`Stop-Service`）。2016 起开源跨平台（PowerShell Core / pwsh），Linux/macOS 也能用。Windows 系统管理员的主力工具。
  example: PowerShell `Get-Process | Where CPU -gt 50` 比 bash 写 awk 简洁。
