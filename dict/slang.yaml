# 职场/程序员俚语
- term: 八股
  aliases: [八股文, 背八股]
  category: slang
  literal: 明清科举的固定文体
  meaning: 面试必背的标准问答题，如"Java 内存模型""HTTP/TCP 三次握手"。不一定真用到，但不背过不了面试。
  example: 后端校招就是卷八股。

- term: 卷
  aliases: [内卷, 太卷了]
  category: slang
  literal: 卷起来
  meaning: 大家都拼命加码导致整体性价比下降。"卷加班""卷 KPI"。
  example: 部门里一个人开始 996，全组就被卷了。

- term: 润
  aliases: [润了, 跑路]
  category: slang
  literal: run 的音译
  meaning: 离职 / 移民 / 跑路。
  example: 干够三年我就润了。

- term: 大厂
  aliases: [互联网大厂]
  category: slang
  literal: 大公司
  meaning: 国内一般指字节/阿里/腾讯/美团/拼多多/快手等头部互联网公司。海外类似有 FAANG（Meta/Apple/Amazon/Netflix/Google）。
  example: 准备秋招冲大厂。

- term: 螺丝钉
  aliases: [拧螺丝, 拧螺丝钉]
  category: slang
  literal: 一颗小螺丝
  meaning: 自嘲。大厂分工细，每个人只负责一小块，没法看全局。
  example: 我就一拧螺丝的，整个链路问产品。

- term: 业务
  aliases: [做业务, 业务方]
  category: slang
  literal: 业务部门
  meaning: 程序员语境里指"贴近变现的应用层开发"，和"做底层/做技术"相对。做业务=快速堆需求，做技术=搞中间件/编译器/操作系统。
  example: 我转岗想从业务去基础架构。

- term: 35 岁危机
  aliases: [35岁, 35 岁]
  category: slang
  literal: 35 岁的危机
  meaning: 国内互联网潜规则，35 岁后程序员普遍面临裁员/招聘歧视/晋升天花板。
  example: 想想 35 岁危机，副业得搞起来。

- term: 晋升答辩
  aliases: [述职, 晋升评审]
  category: slang
  literal: 升职面试
  meaning: 升职前的评审会，向更高级评委 PPT 汇报自己干了啥。包装能力 = 答辩硬通货。
  example: 这个季度先憋个大项目，年底晋升答辩用。

- term: ddl
  aliases: [DDL, deadline]
  category: slang
  literal: deadline 的缩写
  meaning: 截止时间。"ddl 是第一生产力"。
  example: ddl 是周五前提测，今晚得赶完。

- term: 摸鱼
  aliases: [划水, 挂机, AFK]
  category: slang
  literal: slacking off / idle
  meaning: ① **上班摸鱼（职场含义）**——上班时间偷懒做私事，刷手机、看 B 站、撸猫。"摸鱼学"是当代社畜生存哲学。② **游戏挂机（游戏含义）**——游戏里挂着不操作：挂线练等级、挂机收资源、挂阶段任务。原神、奇迹暖暖鼓励挂机；竞技游戏摸鱼=演员队友。"摸鱼挂机"是社畜的双倍快乐：上班摸鱼挂游戏。
  example: 职场 "周五下午摸鱼看 B 站"；游戏 "这游戏挂机 8 小时一晚升一级，摸鱼神器"。

# --- batch 4 expansion: 俵语 ---

- term: 996
  aliases: [9-9-6]
  category: slang
  literal: 早 9 晚 9，一周 6 天
  meaning: 中国互联网臭名昭著的工作制。马云 2019 说"996 是福报"翻车后大家都假装不提了。
  example: 我上一家是 996，逃出来了。

- term: 007
  category: slang
  literal: 0 点到 0 点，一周 7 天
  meaning: 比 996 更狠：24 小时随时待命，一周七天。游戏行业冲版本时常见。
  example: 这项目快上线了，全组 007。

- term: 大小周
  aliases: [大周, 小周]
  category: slang
  meaning: 这周休一天（大周），下周休两天（小周）轮换。比 996 体面但实际比双休累。字节、快手都搞过、后取消。
  example: 字节早年搞大小周，2021 年取消了。

- term: 福报
  aliases: [996 福报]
  category: slang
  literal: 佛教用语
  meaning: 马云原话"能 996 是修来的福报"，被员工反讽到沦为黑话。"福报"=变相加班 PUA。
  example: 老板说"加班是福报"，我笑而不语。

- term: PUA
  aliases: [职场 PUA]
  category: slang
  literal: Pickup Artist（起源于把妹术语）
  meaning: 职场里指上级通过否定/打压让你怀疑自己价值，更便宜地榨干你。"被 PUA 了"=被精神控制。
  example: 老板天天说你不行，这就是 PUA。

- term: 大饼
  aliases: [大饼 PPT]
  category: slang
  meaning: 老板许的空头愿景。"老板又画大饼了"=又说一通让你拼命但不兑现的话。
  example: 期权大饼吃了三年，公司还没上市。

- term: HR
  aliases: [hr]
  category: slang
  literal: Human Resources
  meaning: 人力资源部门。互联网公司里 HR 三件套：招人 + 谈薪 + 谈离职。
  example: HR 找我聊，多半是绩效或者优化。

- term: 优化
  aliases: [被优化]
  category: slang
  literal: 字面"变更好"
  meaning: 大厂裁员的委婉说法。"被优化"=被裁。听起来积极，实际就是滚蛋。
  example: 这季度组里优化了 3 个人。

- term: N+1
  aliases: [N加1, n+1 补偿]
  category: slang
  meaning: 裁员标准补偿：每工作一年补一个月工资，多 1 个月代通知金。N=工作年数。如果直接走还有 2N。
  example: 这次裁员给的 N+1，部分人争取到了 2N。

- term: 毕业
  aliases: [毕业了, 突然毕业]
  category: slang
  literal: 从学校毕业
  meaning: 互联网公司裁员的更委婉说法（腾讯 2022 起带火）。"我毕业了"=被裁了。
  example: 鹅厂这波又毕业了一批人。

- term: 福利
  aliases: [大厂福利]
  category: slang
  meaning: 大厂特指各种非工资待遇：免费三餐、健身房、班车、年假、股票。也是面试时挑公司的硬指标。
  example: 字节福利还行，餐补 + 房补 + 健身房。

- term: leader
  aliases: [Leader, 直属 leader]
  category: slang
  literal: 领导
  meaning: 互联网公司不太说"领导"，说 leader。"我 leader 说"=我老板说。
  example: 这个问题我先问下我 leader。

- term: TL
  aliases: [tl, tech lead, team leader]
  category: slang
  literal: Team Leader / Tech Lead
  meaning: 小团队负责人，通常带 5-10 人。半技术半管理。
  example: 升 TL 后开会变多了，写码变少。

- term: 一线
  aliases: [一线大厂]
  category: slang
  meaning: 行业里头部公司。"一线大厂" ≈ BAT + 字节/美团/拼多多/快手 等。
  example: 校招优先冲一线大厂。

- term: 二线
  aliases: [二线公司, 二三线]
  category: slang
  meaning: 没到头部但也不小的互联网公司。如携程、滴滴、贝壳、知乎等。
  example: 二线公司压力小点，薪资也低 20%。

- term: 三本
  aliases: [民办, 双非]
  category: slang
  meaning: 中国大学层级俚语：985/211/双非/三本，越往后越被简历筛挂。双非=非 985 非 211。
  example: 双非简历进大厂基本要靠内推。

- term: 简历倒挂
  aliases: [倒挂]
  category: slang
  meaning: 后入职的同事工资比早入职的老员工高。校招新人薪资涨太快经常导致倒挂。
  example: 新人比我多 2000，倒挂了。



- term: P 几
  aliases: [P7, P8, 阿里 P 级]
  category: slang
  meaning: 阿里巴巴的技术等级体系（P1-P14），P6 ≈ 中级、P7 ≈ 高级、P8 ≈ 专家。圈内常用来横向比职级。
  example: 字节 2-2 大概对标阿里 P7。

- term: T 几
  aliases: [T3, T4]
  category: slang
  meaning: 腾讯/华为的职级体系（T1-T4 各分小段）。T3-1 应届、T3-2 中级、T3-3 高级 ...
  example: 鹅厂 T3.3 对标阿里 P7。

- term: BG
  aliases: [bg, 事业群]
  category: slang
  literal: Business Group，事业群
  meaning: 大厂内部最大的业务划分。腾讯有 WXG（微信）、PCG（视频/QQ）、CSIG（云）等。
  example: 跨 BG 调岗手续比较麻烦。

- term: BU
  aliases: [bu, 事业部]
  category: slang
  literal: Business Unit，事业部
  meaning: BG 下的一级业务单元。比 BG 小，比小组大。
  example: 我们 BU 这季度营收破 10 亿。

- term: 鄙视链
  aliases: [技术鄙视链]
  category: slang
  meaning: 圈子里互相看不起的食物链。前端 vs 后端、Java vs PHP、用 Mac vs Windows，全都有鄙视链。
  example: 程序员鄙视链：写 C++ 的看不起写 Java 的，写 Java 的看不起写 PHP 的。

- term: 调休
  aliases: [周末调休]
  category: slang
  meaning: 国内法定节假日的反人类发明：放假前后挪周末凑出长假。"国庆放 8 天但前后要连上 6 天班"。
  example: 这个国庆调休调得人想骂人。



- term: 跳槽
  aliases: [换工作]
  category: slang
  meaning: 离职去另一家公司，最常见的加薪方式。"跳一次涨 30%"。
  example: 这家干够两年我就跳槽。

- term: 背调
  aliases: [背景调查, background check]
  category: slang
  meaning: 入职前的尽调：核实学历、上家工作、有无违规。互联网公司常委托第三方做。
  example: 简历别写假，背调一查全露馅。

- term: 卡学历
  aliases: [学历门槛]
  category: slang
  meaning: 招聘环节按学历筛人。大厂校招 985 起步、双非简历常被系统直接刷掉。
  example: 这岗卡 985，我双非投了直接挂。

- term: 老板
  aliases: [我老板]
  category: slang
  literal: 字面老板
  meaning: 互联网公司里"老板"是相对说法，不一定是 CEO。"我老板"=我直属上级，可能是个组长。
  example: 我老板让我加班，没办法。

- term: 一号位
  aliases: [一号位负责人]
  category: slang
  meaning: 一个事业/项目的总负责人。"业务一号位"=这条业务最高头儿。
  example: 这个新业务的一号位是 VP 亲自挂帅。

- term: 大头兵
  aliases: [小兵]
  category: slang
  meaning: 基层执行者，自嘲。没决策权，老板让干啥干啥。
  example: 我就是个大头兵，老板要做我能咋办。

- term: 老白男
  aliases: [老白]
  category: slang
  meaning: 调侃硅谷高管多是中年白人男性。引申：固化保守的管理层。
  example: 这家公司高管全是老白男，思路太老。

# --- batch 8 expansion: 2024-2026 网络流行语 ---

- term: 班味
  aliases: [去班味]
  category: slang
  meaning: 想象一个人下班回家衣服都还能闻到打工的味道——皱、僵、面无表情。"班味儿"就是这种"上班把人腌入味"的疲惫状态。"去班味"=周末/请假努力洗掉这种感觉。2024 年度十大流行语之一。
  example: 周五晚上跟朋友吃饭，他说"你怎么班味这么浓"——我才意识到一周没笑过。

- term: 牛马
  aliases: [我是牛马, 牛马 NPC, 牛马一头]
  category: slang
  literal: 干苦活的牲口
  meaning: 自嘲打工人——任劳任怨、可替换、没尊严。比"螺丝钉"更狠（螺丝钉至少是机器零件）。2024 起爆火，是"打工人"的升级版自嘲。
  example: 这个项目又通宵，我真是牛马命。

- term: 上岸
  aliases: [上岸了, 顺利上岸]
  category: slang
  literal: 从水里登上岸边
  meaning: 从动荡/不确定状态进入稳定状态。考研上岸=考上了；考公上岸=进体制；求职上岸=拿到 offer；恋爱上岸=对象稳了。2020 后高频词。
  example: 同学考公考了三年终于上岸，朋友圈晒了一周。

- term: 显眼包
  category: slang
  meaning: 形容人群里特别引人注目、爱出风头/搞怪的角色。带友好玩笑意，不是贬义。"我家狗狗是显眼包"=它总抢镜头。也常用于植物/动物/物品的拟人化吐槽。
  example: 全公司就这位同事穿粉西装来上班，标准显眼包。

- term: 含金量
  aliases: [含金量很高, 含金量上升]
  category: slang
  literal: 含金的比例（化学/经济术语）
  meaning: 形容某事/某证书/某选项的实际价值。"这奖含金量高"=真有分量。也用于反讽——"这工作含金量真高"可能是说没什么实质收获。
  example: 这场比赛含金量太低，全是新人参赛，赢了也不值钱。

- term: 搞抽象
  aliases: [抽象艺术家, 抽象工坊, 玩抽象]
  category: slang
  literal: 反常规荒诞的内容
  meaning: 形容反常规、戏谑、不按常理出牌的行为或言论。源自游戏主播"抽象工坊"。"这人好抽象"=他在搞怪；"搞个抽象"=故意整个怪的。2024 顶流词。
  example: 老板穿西装去蹦迪——他这是搞抽象。

- term: 偷感
  aliases: [偷感很重, 偷感拉满]
  category: slang
  literal: 偷偷摸摸的感觉
  meaning: 形容做事或说话时小心翼翼、生怕被人发现的状态。常用于自嘲社恐时的窘态。
  example: 同事请假悄悄从工位溜走，偷感非常重。

- term: 红温
  aliases: [红温了, 红温了哥]
  category: slang
  literal: 脸红到发烫
  meaning: 形容被气到/紧张到脸红发烫上头。源自游戏圈："这把红温了"=气到不行。延伸到职场、社交场景。
  example: 老板当众点名批评他，整个人当场红温。

- term: 摆烂
  aliases: [开摆, 摆了, 我摆了]
  category: slang
  literal: 摆出烂的姿态
  meaning: 既然努力也没用，干脆放任不管随它去。和"躺平"近义但更主动："摆烂"是主动放弃挣扎让事情自己烂下去。
  example: 这周 KPI 完不成了，干脆摆烂。

- term: 整顿职场
  aliases: [00 后整顿职场]
  category: slang
  meaning: 调侃年轻员工（特别是 00 后）对不合理职场规则的反抗——准点下班、拒绝团建、跟老板讲规则。半玩笑半真实。
  example: 00 后入职第一周就拒绝团建，整顿职场了属于是。

- term: 情绪价值
  aliases: [提供情绪价值, 情绪价值拉满]
  category: slang
  meaning: 一个人/产品/服务带给你正向情绪的能力。"提供情绪价值"=让你舒服开心。在恋爱、社交、消费各种语境大量出现。
  example: 这个朋友情绪价值拉满，跟她聊天总能开心。

- term: 情绪稳定
  aliases: [情绪稳定的成年人]
  category: slang
  meaning: 字面是"不容易激动"，但流行语境多带反讽——大家都自称"情绪稳定的成年人"，实际谁都在崩溃边缘。
  example: 老板骂完我还能笑出来，情绪稳定的成年人.jpg。

- term: 大冤种
  aliases: [冤种, 我又是大冤种]
  category: slang
  meaning: 自嘲背了不该背的锅、被坑了的人。"我是大冤种"=我又当替罪羊了。
  example: 同事休假我接锅，今天又当大冤种。

- term: 蚌埠住了
  aliases: [绷不住了, 我蚌埠住了, 我绷不住]
  category: slang
  literal: 绷不住的谐音梗（蚌埠是安徽地名）
  meaning: 笑得绷不住了、忍不住了。"我蚌埠住了"等于"我笑死了"。
  example: 这段子太搞了，我蚌埠住。

- term: 离谱
  aliases: [离大谱, 离谱他妈给离谱开门, 太离谱了]
  category: slang
  literal: 离开正常的谱
  meaning: 形容某事很荒唐、不可思议。升级版"离大谱""离谱他妈给离谱开门"用来强化情绪。
  example: 这操作直接离谱，谁能想到。

- term: yyds
  aliases: [永远的神, YYDS]
  category: slang
  literal: 永远的神（拼音首字母）
  meaning: ① **饭圈/通用感叹（默认含义）**——表达对某人/某物极致崇拜。"梅西 yyds"=梅西永远是最强的。已成全网通用感叹语。② **股市语境（反指效应）**——散户给爱股的"封神"称号（茅台 YYDS、英伟达 YYDS）。但叫得越响离顶越近，社群高频喊 YYDS 时常常是阶段顶部信号。市场会教做人。
  example: 饭圈 "这家麻辣烫 yyds 吃了五年"；股市 "喊英伟达 YYDS 的时候一般要跌了"。

- term: 玩梗
  aliases: [接梗, 整梗, 玩烂梗]
  category: slang
  meaning: 用流行段子/网络梗来表达或开玩笑。"会玩梗"=懂网络文化、有亲和力。也有"玩烂梗"贬义。
  example: 这条微信玩梗玩得太顺手，全是 yyds 和绝绝子。

- term: 整活
  aliases: [整个大活, 整活儿]
  category: slang
  meaning: 搞点不一样的事情吸引眼球。多带积极意味——主动制造内容/笑点/惊喜。和"搞抽象"区别：整活=有目的的搞事，搞抽象=纯反逻辑。
  example: 公司年会让我们整活，准备搞个反串。

- term: 上价值
  aliases: [开始上价值, 别上价值]
  category: slang
  meaning: 把简单事情或普通对话升华到意义、哲学、人生层面。多带反讽——"别上价值了"=别瞎拔高。
  example: 老板讲 KPI 突然开始上价值，扯到人生意义。

- term: I人
  aliases: [I 人, I-人, I型]
  category: slang
  literal: MBTI 人格分类的 Introvert（内向）
  meaning: 自我定位社交属性——I 人=内向、社恐、独处充电、不爱社交。MBTI 2023 起在中国年轻人里爆火，I/E 已成日常自我介绍标签。
  example: 同事约我团建，我说我是 I 人，让我自己回家充电。

- term: E人
  aliases: [E 人, E-人, E型]
  category: slang
  literal: MBTI 人格分类的 Extravert（外向）
  meaning: 自我定位社交属性——E 人=外向、社牛、人多兴奋。和 I 人配对。
  example: 我是 E 人，周末不出门跟人聊天会发霉。

- term: emo
  aliases: [emo 了, 我 emo 了, 有点 emo]
  category: slang
  literal: emotional 缩写
  meaning: 莫名陷入低落情绪。和"抑郁"区别：emo 是短暂的、矫情式的、可分享的；抑郁是病。"我 emo 了"=我有点丧但说不上为啥。
  example: 看完电影一个人坐了半小时，有点 emo 了。

- term: 老六
  aliases: []
  category: slang
  literal: 源自 CS 游戏第六个位置最阴险
  meaning: 形容做事不按套路、阴险偷袭、坑队友的人。"你这老六"=你这人真阴。
  example: 同事抢了我提的方案功劳，纯老六行为。

- term: 上桌
  aliases: [终于上桌了, 上桌吃饭]
  category: slang
  literal: 上餐桌吃饭（被纳入正式圈子）
  meaning: 从配角/边缘进入主流舞台。"上桌"=被纳入正式圈子、被认真对待。常用于体育/政治/商业语境。
  example: 国货品牌终于上桌了，连巴黎时装周都请了。

- term: 信息差
  aliases: [赚信息差, 信息差红利]
  category: slang
  meaning: 利用别人不知道而你知道的信息差异赚钱/办事。"信息差红利"=别人不知道的赚钱机会。
  example: 这门生意全靠信息差，懂的人在闷声发财。

- term: 浪浪山小妖怪
  aliases: [浪浪山, 小妖怪]
  category: slang
  literal: 2024《中国奇谭》动画短片角色
  meaning: 上美影《中国奇谭》里底层小妖怪——梦想离开浪浪山去见世面，最后发现外面也没那么好。隐喻打工人"逃离北上广"又回老家的循环。2025 年度十大流行语。
  example: 北漂三年又回老家了，活成了浪浪山小妖怪。

- term: 多巴胺穿搭
  aliases: [多巴胺]
  category: slang
  literal: 多巴胺是让人快乐的神经递质
  meaning: 鲜艳明亮配色的穿衣风格，看了让人开心。2023 火起来的时尚关键词。和"美拉德""老钱风"是不同风格代号。
  example: 夏天换多巴胺穿搭，柠檬黄配薄荷绿。

- term: citywalk
  aliases: [city walk, 城市漫步, 城市散步]
  category: slang
  literal: 城市漫步
  meaning: 不带具体目的在城市里溜达——看街景、随机进店、拍照。2023 起在年轻人间流行的"低消费高体验"生活方式。和"特种兵旅游"对应另一极。
  example: 周末去上海武康路 citywalk，一下午没花什么钱。

- term: 数字游民
  aliases: [Digital Nomad]
  category: slang
  literal: 数字时代的游牧民族
  meaning: 远程办公满世界跑的工作方式——在大理/清迈/巴厘岛租屋办公一两个月再换地方。互联网时代年轻人理想生活样本之一。
  example: 朋友辞职当数字游民，现在在清迈，每月开销 8000。

- term: 副业刚需
  aliases: [搞副业, 副业必须有]
  category: slang
  meaning: 副业已成"刚需"——单一工资养不活、对抗 35 危机、抵御失业。年轻人焦虑式生存策略。
  example: 同事白天上班晚上做小红书博主，副业刚需了。

- term: 团建
  aliases: [公司团建, 部门团建]
  category: slang
  literal: 团队建设活动
  meaning: 公司组织的非正式集体活动——爬山、烧烤、KTV、剧本杀。多用于增进感情，但年轻人普遍嫌烦（周末被强占）。和"整顿职场"配对——00 后开始集体拒绝团建。
  example: 周五下班通知周六团建，整顿职场之心又起。

- term: 出海
  aliases: [出海业务, 全球化]
  category: slang
  literal: 船出大海
  meaning: 中国互联网公司把业务做到海外——TikTok 出海、Shein 出海、Temu 出海。2020 后中国互联网增长饱和后的主流方向。
  example: 老板今年战略重点是出海，先去东南亚。

- term: 电子榨菜
  aliases: []
  category: slang
  meaning: 吃饭时下饭看的视频/直播/短剧。"榨菜"=配饭咸菜。"今天电子榨菜是什么"=吃饭看啥。
  example: 我每天午饭电子榨菜是抖音搞笑合集。

- term: 电子布洛芬
  aliases: []
  category: slang
  meaning: 看了能让人解压、止烦的视频/内容。布洛芬是止疼药。常见类型：可爱小动物、解压视频、ASMR。
  example: 工作累了刷会儿猫咪视频当电子布洛芬。

- term: 电子木鱼
  aliases: [赛博木鱼]
  category: slang
  meaning: 手机 App 模拟敲木鱼"功德+1"。在年轻人中流行作为减压玩具或玄学加持。和"上香""赛博烧香"是一脉相承的网络迷信文化。
  example: 写完代码点电子木鱼，敲到上线无 bug。

- term: AI 焦虑
  aliases: [AI 取代焦虑]
  category: slang
  meaning: 担心 AI 进步太快会取代自己工作的焦虑。2023 ChatGPT 出圈后大规模蔓延。设计师、客服、文案、程序员各群体都有。
  example: 看 Cursor 写代码这么强我 AI 焦虑直接炸。

- term: 价值密度
  aliases: [信息价值密度]
  category: slang
  meaning: 单位时间/篇幅传递的有效信息量。"这视频价值密度高"=干货多废话少。LLM 流行后大家更敏感"被废话刷屏"，这词高频起来。
  example: 这本书价值密度太低，看十页只记住一句话。

- term: 注意力经济
  aliases: []
  category: slang
  meaning: 一种商业模式认知——用户的注意力比时间更稀缺，App 都在抢你的注意力。抖音、小红书、新闻 App 都是注意力经济产物。
  example: 短视频 App 设计成 infinite scroll 就是吃定了注意力经济。

# --- batch 9: 程序员/AI 圈对话里夹的基础英文词 ---

- term: slang
  aliases: [俚语]
  category: slang
  literal: 俚语
  meaning: 英文里"非正式的、圈内人才懂的说法"。比如本词典里的"互联网黑话"对应英文就是 internet slang。中文程序员/AI 讨论里常夹这个词。
  example: codelang 的 slang.yaml 文件就是收"俚语类词条"的。

- term: jargon
  aliases: [行话, 术语]
  category: slang
  literal: 行话
  meaning: 某个行业/圈子内部专用、外人听不懂的词汇。"互联网黑话"在英文里就是 internet jargon。和 slang 区别：jargon 偏专业术语，slang 偏俚语口语。
  example: This is industry jargon = 这是行话。

- term: glossary
  aliases: [术语表, 词汇表]
  category: slang
  literal: 术语表
  meaning: 一份"专门解释某领域术语的词汇表"。技术文档结尾常有 glossary 解释生词。codelang 这个工具本质就是一个可悬浮查询的 glossary。
  example: 论文最后附的 Glossary 解释了文中所有 AI 术语。

- term: vocabulary
  aliases: [vocab, 词汇量]
  category: slang
  literal: 词汇量
  meaning: 你认识的词的总集合。"build vocabulary"=积累词汇。中文圈也会说"扩充 vocab"。
  example: 学英文先扩 vocabulary，再练语法。

- term: idiom
  aliases: [习语, 成语]
  category: slang
  literal: 习语
  meaning: 字面意思不等于实际意思的固定搭配。中文的"画蛇添足"、英文的"break the ice"都是 idiom。学外语最难记的那部分。
  example: 英文里"Hit the ground running"是个 idiom，意思是开局就快速进入状态。

- term: buzzword
  aliases: [流行词, 热门词]
  category: slang
  literal: 嗡嗡作响的词（暗喻被讨论得很热闹）
  meaning: 一段时间内被滥用、人人都在说但很多人其实没搞懂的词。互联网"中台"、AI "agentic"都是 buzzword。常带轻微贬义——"It's just a buzzword"=就是个噱头。
  example: AI Agent is the buzzword of 2025 = AI Agent 是 2025 的年度热词。

- term: meme
  aliases: [梗, 表情包]
  category: slang
  literal: 模因（生物学概念）
  meaning: 网络上病毒式传播的图片、视频、说法。中文圈说"玩梗"对应英文 meme。Dawkins 最早提出，但现在 99% 用法都是"网络上那个图"。
  example: This is a classic meme = 这是个经典梗。

- term: viral
  aliases: [病毒式传播, 爆款]
  category: slang
  literal: 像病毒一样传播
  meaning: 内容快速大范围传播。"go viral"=火爆出圈。和"破圈""引爆"同义。
  example: 这条 tweet went viral，转发破百万。

- term: trending
  aliases: [上热搜, 热门趋势]
  category: slang
  literal: 趋势中的
  meaning: 当下正热门的话题/内容。Twitter trending、GitHub trending、抖音热搜都是这个概念。
  example: 这个开源项目今天上 GitHub trending，star 数涨了一千。

- term: newbie
  aliases: [noob, 新人, 萌新]
  category: slang
  literal: 新手
  meaning: 行业新人/某技术初学者。比"beginner"更口语化，带点亲切意。"noob"是它的更口语版（游戏圈常用）。
  example: I'm a newbie to Rust = 我是 Rust 新手。

- term: guru
  aliases: [大佬, 高手]
  category: slang
  literal: 印度教/瑜伽里的"导师"
  meaning: 某领域顶级专家。"Linux guru"=Linux 大神。带敬意，不像"大佬"那么口语化。
  example: He's a Python guru = 他是 Python 大神。

- term: ship
  aliases: [shipping]
  category: slang
  literal: 装船发运
  meaning: 程序员圈把"上线/发布产品"叫 ship。"ship it"=发了！"shipping fast"=快速迭代上线。来自硅谷文化"做不出来不算，发出来才算"。
  example: We need to ship this feature by Friday = 这功能周五前必须上线。

- term: hype
  aliases: [炒作, 热捧]
  category: slang
  literal: 炒作
  meaning: 某事被吹得太厉害、过度热捧。"AI is overhyped"=AI 被吹过头了。和 buzzword 近义但 hype 更强调"被炒作的过程"。
  example: Don't believe the hype = 别信吹的那一套。

- term: opinionated
  aliases: [有主张的]
  category: slang
  literal: 有强烈主见的
  meaning: 形容工具/框架"自带强烈使用偏好"——比如 Rails / Prettier 是 opinionated（强制规则、不让你配）。和"unopinionated"（怎么用都行）相对。
  example: Prettier is opinionated by design = Prettier 设计上就是 opinionated 的，不让你瞎配。

- term: vibe
  aliases: [氛围, 感觉]
  category: slang
  literal: 氛围/感觉
  meaning: 一种说不清的整体感觉。"good vibes"=感觉很好；"weird vibe"=气场怪怪的。"vibe check"=测一下氛围。vibe coding 就借了这词的"凭感觉"意思。
  example: This cafe has good vibes = 这家咖啡店氛围好。

- term: lit
  aliases: [牛, 炸裂]
  category: slang
  literal: 字面"被点燃"
  meaning: 美国年轻人的"超棒""炸裂"。"This party is lit"=这派对牛炸了。
  example: That new model is lit = 那个新模型炸裂。

- term: based
  aliases: []
  category: slang
  meaning: Twitter/Reddit 圈表态用语——"基于事实/真实/不在乎别人怎么想"。"That's based"=这就对了/这才是真。略带反主流意味。
  example: His take is based = 他这观点很到位。

- term: cringe
  aliases: [尴尬到脚趾抠地]
  category: slang
  literal: 退缩、畏缩
  meaning: 看了让人尴尬到脚趾抠地。和"social embarrassment"近义。中国互联网也直接用 cringe，意思接近"拉胯"+"社死"的尴尬版。
  example: That video is so cringe = 那视频太尴尬了看不下去。

- term: vanilla
  aliases: [原版, 不加修饰]
  category: slang
  literal: 香草口味（最普通）
  meaning: 不加任何修饰/插件/魔改的原始版本。"vanilla JavaScript"=不用框架的原生 JS；"vanilla Linux"=未定制的 Linux 发行版。
  example: 写个 demo 用 vanilla JS 就行，不用 React。

- term: stack
  aliases: [技术栈, tech stack]
  category: slang
  literal: 叠在一起的一摞
  meaning: 程序员说"stack"通常指"技术栈"——你这个项目用的所有技术加一起。"My stack is React + Node + MongoDB"=我用这套技术。
  example: 这家公司的 stack 是全套阿里系，主要技术是 Java + Spring + MySQL。

# ====================
# 2024-2025 新流行语补遗
# ====================


- term: 媚男
  aliases: [媚男文学]
  category: slang
  meaning: 女性主义讨论里指"讨好男性、迎合男性凝视"的言论或作品——女德书、传统女性美德文章常被批"媚男"。豆瓣小组高频词。
  example: 这本书媚男气息太重，看不下去。

- term: 男大
  aliases: [男大学生]
  category: slang
  meaning: 字面"男大学生"——但小红书/微博语境里特指"幼稚、不成熟、自我感觉良好的年轻男性"。"男大思维"是吐槽。
  example: 25 岁了还一身男大味。

- term: 那咋了
  aliases: [那咋啦]
  category: slang
  meaning: 2024 年抖音爆火的赵小棠口头禅——配着不在乎的表情。"我已读不回怎么了？那咋了！"用来表达"不在乎、就这样、爱咋咋地"的反抗态度。
  example: 老板说我加班少。那咋了？

- term: 我嘞个豆
  aliases: [我勒个豆]
  category: slang
  meaning: 2024 年"郭言郭语"火出圈的口头禅——惊讶/无语时说。"我嘞个豆，这都行？"既无奈又荒诞。配抽象表情包用。
  example: 我嘞个豆，加班到 11 点还要写周报。

- term: 已老实求放过
  aliases: [已老实]
  category: slang
  meaning: 2024 年流行语——表达"我认怂了别再玩了"的求饶态度。源自一些恶搞视频里被整完瘫坐说的"已老实"。微博/小红书评论高频出现。
  example: 这季度 KPI 翻倍？已老实求放过。

- term: 清醒梦
  aliases: [lucid dream]
  category: slang
  meaning: 字面是"做梦时知道自己在做梦"的睡眠现象——2024 年成网络梗指"脱离现实但又清醒的感觉"。常吐槽"上班如清醒梦"。
  example: 这周末加班三天，整个人像清醒梦。

- term: 发疯文学
  aliases: [发疯]
  category: slang
  meaning: 一种夸张戏剧的表达方式——遇到不爽的事用"啊啊啊我不想活了"、"妈我成神了"这种夸张语气表达。微博/小红书评论区主流之一。是 emo 的进化版。
  example: 又被甲方改第八版，立刻发疯文学。

- term: City 不 City
  aliases: [city 不 city]
  category: slang
  meaning: 2024 年外国博主在中国旅游问"这里 city 吗？"火出圈——中国人解读为"洋气不洋气、城市感强不强"。后泛化为问"够不够好玩/酷"。
  example: 这家咖啡店 city 不 city？

- term: 厝内厝外
  aliases: [家里家外]
  category: slang
  meaning: 2024 年闽南语网红词——"厝"=家。本是闽南家庭概念，被网友用来调侃"显眼包"或区分"内向场合 vs 外向人设"。
  example: 厝内是社恐，厝外是显眼包。

- term: 那么普通却那么自信
  aliases: [普却信]
  category: slang
  meaning: 2024 年流行话——杨笠脱口秀名句。讽刺有些男性能力一般但自信爆棚。后泛用于吐槽各种"实力配不上自信"的人。
  example: 这人代码写得稀烂，演讲贼自信，那么普通却那么自信。



- term: 上 班
  aliases: []
  category: slang
  meaning: 2024-2025 间隔加空格的反讽写法——"上班"加间隔表达"上 班 但只剩躯壳"的抽象感。打工人 emo 表达方式。
  example: 又要 上 班 了，没动力。

- term: 拽姐
  aliases: []
  category: slang
  meaning: 2024 年流行人设——"不在乎别人眼光、独立自我、有钱花得也潇洒"的女性。小红书人设标签。和"女王"同类但更年轻气。
  example: 这身穿搭拽姐 vibe 拉满。




- term: 反向 X
  aliases: [反向操作]
  category: slang
  meaning: 一种构词法——"反向带货"=博主推荐一个东西反而让人不想买；"反向通勤"=高峰期反方向人少；"反向 PUA"=被领导 PUA 反过来 PUA 领导。
  example: 这博主推啥啥不火，纯反向带货。

- term: 鼠人
  aliases: [鼠鼠]
  category: slang
  meaning: 网络自嘲——形容自己像老鼠一样卑微、努力但不被看见。豆瓣"鼠鼠我啊"=自降身份的卖萌+诉苦。
  example: 鼠鼠我啊，又被退稿了。

- term: 哈基米
  aliases: []
  category: slang
  meaning: 2024 年抖音爆梗——某猫咪叫"哈基米"，本是日语"蜂蜜"。后被各种鬼畜配音玩坏，泛用表达"萌、可爱、无脑欢乐"。
  example: 看猫视频哈基米一晚上。
