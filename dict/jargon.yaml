# 互联网黑话 —— 大厂会议室高频词
- term: 对齐
  aliases: [对齐一下, 拉齐, sync up, align]
  category: jargon
  literal: 排成一条线
  meaning: 想象军训时教官喊"向左看齐"——大家原本朝不同方向，立刻调成一条线。大厂里"对齐一下"就是这种"找几个人开短会同步信息、确认大家理解一致"。常发生在做事前先开半小时碰需求/方向。
  example: 这事儿我先和产品对齐一下需求再开发，免得做完发现理解错了。

- term: 颗粒度
  aliases: [粒度, granularity]
  category: jargon
  literal: 颗粒的粗细
  meaning: 想象食材切法——切丝是细颗粒、切块是粗颗粒。"颗粒度"形容任务/数据/计划的细致程度。"颗粒度太粗"=拆得不够细，看不出每步谁干什么；"颗粒度细"=拆到每天每人具体做啥。开会常被问"你的颗粒度能不能再细一点"。
  example: 这版项目排期颗粒度太粗，按周给的，按天再拆一下让大家明确每天该干啥。

- term: 抓手
  aliases: [核心抓手, 关键抓手]
  category: jargon
  literal: 能抓住的把手
  meaning: 想象搬一个奇形怪状的箱子——你得先找到能抓住的把手才搬得动。"抓手"就是推动一件大事的具体切入点。"找抓手"=找一个能下手干活的点。"用户留存是今年的核心抓手"=今年绕着"提升留存"这个具体目标干，比"做好业务"具体多了。
  example: 老板让今年业务上一个台阶，先得找抓手——光说目标没用，得有具体能动的点。

- term: 赋能
  aliases: [赋能业务, empower]
  category: jargon
  literal: 给予能力
  meaning: 想象工厂供电——总电厂不直接做产品，只把电送给各车间让他们造东西。"赋能"就是"提供工具/数据/方法让别人能把事干成"。基础平台部门最爱说："我们组赋能业务"——意思是"我们造基础设施，你们造业务"。
  example: 我们组维护数据中台，赋能业务方做精细化运营，他们不用自己处理数据底层。

- term: 闭环
  aliases: [闭环了, 形成闭环]
  category: jargon
  literal: 环路闭合
  meaning: 想象洒水后水流回水库再循环——头尾相接形成闭环就持续运转。互联网里"闭环"指流程从头跑到尾且结果回流到起点形成反馈："投放→点击→购买→数据回到投放系统优化下次投放"。"这事闭环了"=端到端跑通且有反馈数据。
  example: 我们的广告投放-转化-复购数据要打通形成闭环，才能基于真实数据优化下一波投放。

- term: 心智
  aliases: [用户心智, 心智模型]
  category: jargon
  literal: 心理上的认知
  meaning: 想象提"高端白酒"你脑子立刻跳出茅台——这种"听到 X 立刻想到 Y"就是心智。营销圈说"占领用户心智"=让你一想到某场景就先想到我家牌子。建立心智成本巨高但护城河深。
  example: 提"国民老婆"想到新垣结衣、提"凉茶"想到王老吉——都是用户心智的体现。

- term: 复盘
  aliases: [复盘一下, retrospect, retro]
  category: jargon
  literal: 围棋术语，下完棋再重摆一遍找问题
  meaning: 想象球队赛后看录像——回顾每个传球是不是最优、防守哪儿漏了。复盘就这思路：事后回看整个过程，哪步对哪步错、为啥成功为啥失败、下次怎么改进。项目结束、季度末、事故后都会复盘。
  example: 这次大促结束我们开个复盘会，看哪些招有效、哪些是白花钱。

- term: 漏斗
  aliases: [funnel]
  category: jargon
  literal: 漏斗形状，上宽下窄
  meaning: 想象 100 个人路过店门口——80 个看了一眼、30 个进店、10 个看商品、3 个下单付款。每步流失一批，画出来像漏斗。优化转化率本质就是"放大漏斗每层的通过率"，找出"哪一环掉得最多"是分析的核心。
  example: 看下用户转化漏斗，咱们是加购少还是付款失败多？针对最大流失环节优化。

- term: 打法
  aliases: [战术打法]
  category: jargon
  literal: 怎么打仗的方法
  meaning: 想象打篮球——同样是想赢比赛，强攻篮下是一种打法、外线投三分是另一种。互联网"打法"就是"做某事的策略路径"。"换个打法"=换种思路做。
  example: 这个市场纯砸钱拉新成本越来越高，得换个打法，靠内容自传播。

- term: 破圈
  aliases: [出圈]
  category: jargon
  literal: 突破自己的小圈子
  meaning: 想象一段视频原本只在小众动漫圈传播——突然有天微博、抖音、广场舞大妈都在转。这种"内容/产品从核心粉丝群扩散到全民"叫破圈。破圈成功一夜暴富，但流量来得快走得也快。
  example: 这条短视频破圈了，连完全不玩游戏的中老年人都在朋友圈转。

- term: 中台
  aliases: [业务中台, 数据中台]
  category: jargon
  literal: 中间的台子
  meaning: 想象连锁餐厅——前台门店面对顾客（前台/前线），后台是供应链仓库（后台/基础设施），中间需要一层"半成品加工厂"统一处理食材发给各门店（中台）。把账户、订单、营销这些多业务线共用的能力沉淀成统一平台就叫中台。2018 阿里带火，近几年在退潮。
  example: 把账户/订单/营销做成中台，公司每条业务线都能复用，不重复造轮子。

- term: 沉淀
  aliases: [沉淀下来, 沉淀文档]
  category: jargon
  literal: 沉到底
  meaning: 把临时经验/做法整理成可复用的文档/工具/流程。
  example: 这次踩的坑要沉淀成 wiki，下次别再踩。

- term: 拉通
  aliases: [拉通一下]
  category: jargon
  literal: 拉直/打通
  meaning: 跨团队/跨部门把信息和资源连起来。比"对齐"范围更大。
  example: 这事涉及三个部门，我去拉通一下。

- term: 包装
  aliases: [包装一下]
  category: jargon
  literal: 给商品包包装
  meaning: 把已做的事换个角度讲得更亮眼，多用于汇报/晋升 PPT 场景。
  example: 这个项目效果一般，但你包装一下还是能讲。

- term: 高频
  aliases: [低频, 高频场景]
  category: jargon
  literal: 频率高
  meaning: 用户使用次数多的场景/功能。和低频相对，做产品都想抢高频入口。
  example: 微信支付是高频，所以是巨大入口。

# --- batch 1 expansion ---

- term: 落地
  aliases: [落地实施, 真正落地]
  category: jargon
  literal: 落到地上
  meaning: 想法变成可执行的产品/流程/方案。"怎么落地？"=怎么真正做起来。
  example: 方案讨论一周了，下周必须落地，先做个原型。

- term: 对标
  aliases: [对标一下, benchmark]
  category: jargon
  literal: 对照标杆
  meaning: 拿别家成熟产品/数据当参照。"对标抖音"=照着抖音的样子来。
  example: 这个功能对标小红书的笔记流。

- term: 倒逼
  aliases: [倒逼机制]
  category: jargon
  literal: 反向逼迫
  meaning: 从下游/结果反过来推上游做改变。常用于"用 deadline 倒逼进度"。
  example: 用季度 OKR 倒逼业务方提早提需求。

- term: 输出
  aliases: [有输出, 输出物]
  category: jargon
  literal: 把东西输出来
  meaning: 大厂语境=交付文档/PPT/方案/代码这类可见成果。"你这周有什么输出？"=你交了啥。
  example: 这次调研要有输出，至少一份分析文档。

- term: 提炼
  category: jargon
  meaning: 从一堆杂事/数据里抽出核心要点。常用于汇报、文档总结场景。
  example: 这次复盘把三个核心问题提炼出来。

- term: 踩坑
  aliases: [踩了坑, 避坑]
  category: jargon
  literal: 踩到坑里
  meaning: 遇到没预料到的麻烦/bug。"踩过坑"=有相关经验。
  example: 我之前接 OAuth 踩过这坑，给你避一下。

- term: 填坑
  aliases: [填一下坑]
  category: jargon
  literal: 把坑填上
  meaning: 收拾别人或之前留下的烂摊子。前任甩锅、技术债，都得有人填。
  example: 我这季度主要在填上家留的 bug 坑。

- term: 兜底
  aliases: [兜底方案]
  category: jargon
  literal: 兜住底
  meaning: 主链路挂了/出问题时的保底方案。一定要有兜底，不然就翻车。
  example: 推荐服务挂了走兜底，返回热门列表。

- term: 协同
  aliases: [协同作战, 协同效应]
  category: jargon
  meaning: 多团队/多业务线一起干，1+1>2。比"配合"更端着。
  example: 这事要市场+产品+研发三方协同。

- term: 联动
  aliases: [联动一下]
  category: jargon
  meaning: 几方一起做个事产生连锁效果。常见跨品牌联动、跨部门联动。
  example: 抖音和瑞幸联动了一波营销。

- term: 打通
  aliases: [打通一下]
  category: jargon
  literal: 打成一条通路
  meaning: 把原本割裂的系统/数据/流程连起来。"打通账户体系"=用户登录一处全通用。
  example: 我们要打通 APP 和小程序的会员积分。

- term: 抹平
  aliases: [抹平差异]
  category: jargon
  literal: 抹得平整
  meaning: 把多端/多系统的差异在某一层屏蔽掉，让上层看不出来。
  example: 这个 SDK 抹平了 iOS 和安卓的接口差异。

- term: 解耦
  aliases: [decouple]
  category: jargon
  literal: 解开耦合
  meaning: 把原本互相依赖的两块拆开各干各的，谁挂了不影响谁。架构师最爱说。
  example: 把支付和订单解耦，订单写库不等支付回调。

- term: 耦合
  aliases: [强耦合, coupling]
  category: jargon
  meaning: 两块东西绑得太死，改 A 必动 B。和"解耦"反义。
  example: 这俩模块耦合太重，重构得连带改。

- term: 复用
  aliases: [reuse]
  category: jargon
  meaning: 一个东西多个地方使。代码复用、组件复用、能力复用。
  example: 这个登录组件抽出来给三条业务线复用。

- term: 封装
  aliases: [encapsulation]
  category: jargon
  literal: 包装起来
  meaning: 把实现细节藏起来，只露出干净的接口给别人调。
  example: 这段重复逻辑封装成一个 hook。

- term: 抽象
  aliases: [抽象一层]
  category: jargon
  meaning: 把多个具体场景的共同点提出来变成通用接口/模型。抽象做对了好用，做错了过度设计。
  example: 别过度抽象，先把第一个版本写死再说。

- term: 聚合
  aliases: [aggregate, 聚合接口]
  category: jargon
  meaning: 把多个数据源/接口/事件合并成一个统一的输出。
  example: 这个聚合接口一次返回订单+物流+优惠券。

- term: 集成
  aliases: [integrate]
  category: jargon
  meaning: 把别人的东西接进来用。集成第三方 SDK、集成 CI/CD。
  example: 这周要集成钉钉登录。

- term: 下沉
  aliases: [能力下沉, 下沉市场]
  category: jargon
  literal: 沉到下面
  meaning: 两个用法：(1) 把上层重复逻辑沉到底层框架；(2) 业务从一线城市拓展到三四线/县城。
  example: 把鉴权下沉到网关，业务层不用关心。

- term: 拉新
  aliases: [新客获取]
  category: jargon
  literal: 拉来新用户
  meaning: 获取新注册用户。"拉新成本"=买一个新用户花多少钱。
  example: 双十一拉新成本飙到 80 块一个用户。

- term: 留存
  aliases: [retention]
  category: jargon
  literal: 留下来
  meaning: 新用户/老用户后续还回来用的比例。次日留存=注册第二天还来的占比。
  example: 30 日留存只有 5%，这个产品有问题。

- term: 促活
  aliases: [激活]
  category: jargon
  literal: 促使活跃
  meaning: 让已沉默的用户重新打开 App。常见手段：推送、短信、优惠券。
  example: 这波促活活动拉回了 10 万沉睡用户。

- term: 召回
  aliases: [用户召回, 召回策略]
  category: jargon
  meaning: 把流失的用户拉回来。短信/电话/Push 三件套。
  example: 一个月没登录的发短信召回。

- term: 流失
  aliases: [用户流失, churn]
  category: jargon
  meaning: 用户不再来用了。流失率高=产品有大问题。
  example: 这周 DAU 跌 10%，看下哪个渠道流失最猛。

- term: 获客
  aliases: []
  category: jargon
  meaning: 拿到一个新客户。"获客成本"=买一个新客户花多少。
  example: SEM 渠道获客成本 200，太贵了。

- term: 投放
  aliases: [广告投放, 投流]
  category: jargon
  meaning: 花钱买广告位/流量。"投放 ROI"=投了多少换了多少。
  example: 信息流投放这周烧了 50 万。

- term: 裂变
  aliases: [裂变玩法]
  category: jargon
  literal: 像核裂变那样扩散
  meaning: 老用户拉新用户、新用户再拉新用户，几何级增长。拼多多砍一刀就是裂变。
  example: 设计个裂变红包，让用户帮我们拉新。

- term: 跨界
  aliases: [跨界合作]
  category: jargon
  meaning: 不同行业/品类的品牌一起做联名。常见为了破圈/吸新客。
  example: 旺旺和卫龙跨界出了联名零食。

- term: 共建
  aliases: [共建生态]
  category: jargon
  meaning: 几方一起出力建一个东西。常用于平台对外说辞，听起来比"你给我打工"好听。
  example: 邀请开发者共建小程序生态。

- term: 画饼
  aliases: [画大饼]
  category: jargon
  literal: 用嘴画一张饼
  meaning: 老板/上级讲愿景但没实际兑现的承诺。"老板又画饼了"=又许了个空愿。
  example: 入职时画饼期权，三年后公司没上市。

- term: 死磕
  aliases: [死磕到底]
  category: jargon
  meaning: 一件事不出结果不放手，硬刚到底。
  example: 这个性能问题死磕了一周才定位到。

- term: 深耕
  aliases: [深耕领域]
  category: jargon
  literal: 深深耕作
  meaning: 长期专注做某一个垂直领域，做到很深。和"广撒网"反义。
  example: 我们在物流领域深耕十年。

- term: 攻坚
  aliases: [攻坚战]
  category: jargon
  meaning: 集中力量啃硬骨头。常用于推动卡了很久的项目。
  example: Q4 我们要打个技术攻坚战，把架构升级完。

- term: 破题
  aliases: [怎么破题]
  category: jargon
  literal: 解开题目
  meaning: 想清楚问题该从哪下手解。"先破题"=先弄明白问题本质。
  example: 留存低这个问题，怎么破题？

- term: 破局
  aliases: [破局之道]
  category: jargon
  literal: 打破僵局
  meaning: 现有局面卡死了，找一招打开新局面。
  example: 在红海里破局，必须做差异化。

- term: 风口
  aliases: [风口浪尖, 站风口]
  category: jargon
  literal: 风吹来的口
  meaning: 一个突然变热的行业方向。"站在风口上猪都能飞"，但风一停先掉的也是猪。
  example: AI Agent 是今年的风口，融资都疯了。

- term: 赛道
  aliases: [选赛道]
  category: jargon
  literal: 比赛跑道
  meaning: 一个细分市场方向。"换赛道"=换一个行业/方向重新做。
  example: 这个赛道太挤了，我们换个赛道。

- term: 红海
  aliases: [红海市场]
  category: jargon
  literal: 染红的海（杀红了眼）
  meaning: 竞争极度激烈、利润薄如刀片的市场。和蓝海相对。
  example: 外卖是红海，新人进来纯亏钱。

- term: 蓝海
  aliases: [蓝海市场]
  category: jargon
  literal: 蓝色的海（没人）
  meaning: 还没什么人做、利润空间大的市场。但蓝海会迅速变红海。
  example: 五年前直播带货还是蓝海，现在不是了。

- term: 头部
  aliases: [头部玩家, top]
  category: jargon
  literal: 头的部分
  meaning: 行业里排在最前面的几家/几个。和腰部、尾部相对。
  example: 短视频头部就抖音和快手两家。

- term: 腰部
  aliases: [腰部玩家]
  category: jargon
  meaning: 行业里中等规模的玩家，不是龙头但也活得不错。
  example: 这家公司是 SaaS 腰部，营收 5 亿左右。

- term: 痛点
  aliases: [用户痛点]
  category: jargon
  literal: 痛的点
  meaning: 用户实际遇到、不解决就难受的问题。做产品的口头禅。
  example: 通勤无聊是痛点，所以播客起来了。

- term: 爽点
  aliases: [用户爽点]
  category: jargon
  meaning: 用户用了立刻爽到的功能。和痛点配对：解决痛点+制造爽点=好产品。
  example: 拼多多砍一刀就是爽点，每砍一下进度往前一截。

- term: 痒点
  category: jargon
  meaning: 不解决也能活、但解决了让人小欢喜的需求。痛点之下的浅层需求。
  example: 头像戴圣诞帽是痒点，挠到就传播。

- term: 公域
  aliases: [公域流量]
  category: jargon
