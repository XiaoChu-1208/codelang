# 产品 / 运营 / 增长 术语
# —— 互联网公司产品经理、运营、数据分析、增长岗位日常对话高频词

# --- 用户经济指标 ---

- term: LTV
  aliases: [Lifetime Value, 用户生命周期价值]
  category: abbr
  literal: Lifetime Value
  meaning: 一个用户从注册到流失的整个生命周期里，平均贡献多少营收。"算 LTV"是评估"花多少钱拉一个用户划算"的核心。LTV 大于 CAC 才是赚钱的生意。
  example: 这款 App LTV 200 块，CAC 80 块——能扩大投放。

- term: CAC
  aliases: [Customer Acquisition Cost, 获客成本]
  category: abbr
  literal: Customer Acquisition Cost
  meaning: 获取一个新用户花多少钱——广告投放费、邀请奖励、内容生产成本都算。CAC 越低生意越赚，但好渠道往往 CAC 高。和 LTV 配对看，LTV/CAC > 3 是健康。
  example: 双 11 期间 CAC 飙到 150 块，太贵了不投。

- term: ARPU
  aliases: [Average Revenue Per User, 每用户平均收入]
  category: abbr
  literal: Average Revenue Per User
  meaning: 全体活跃用户人均贡献多少营收（一段时间内）。"ARPU 50 块"=平均每个用户给公司带来 50 块。常见月 ARPU、季 ARPU、年 ARPU。
  example: 这季度 ARPU 涨了 20%，主要靠 VIP 用户拉的。

- term: ARPPU
  aliases: [Average Revenue Per Paying User]
  category: abbr
  literal: Average Revenue Per Paying User
  meaning: 只算"付费用户"的人均收入。和 ARPU 区别：ARPU 包含白嫖用户，ARPPU 只看付费的。游戏、直播、知识付费类业务都看这个。
  example: 游戏整体 ARPU 5 块，但 ARPPU 是 500 块——靠少数大 R 撑起来的。

- term: 客单价
  aliases: [average order value, AOV]
  category: jargon
  literal: 平均每单成交金额
  meaning: 一个用户/订单平均花多少钱。"客单价 200 块"=平均一笔订单 200 块。电商核心指标之一。提客单价靠组合销售、推荐、满减门槛。
  example: 这家奶茶店客单价 35 块，是 9.9 价格带的三倍。

- term: 复购率
  aliases: [回购率]
  category: jargon
  meaning: 老用户重复购买的比例——"30 天复购率 40%"=买过一次后 40% 的人 30 天内再买一次。复购率高的生意才能长期盈利。
  example: 这款洗发水复购率才 5%，说明用户用一次不再回头。

- term: ROAS
  aliases: [Return on Ad Spend, 广告投资回报率]
  category: abbr
  literal: Return on Ad Spend
  meaning: 广告花一块钱换回多少营收。ROAS 1=亏本（不考虑成本），ROAS 3+=赚钱（看品类）。和 ROI 类似但只算广告这一项。投放策略最核心指标。
  example: 这个渠道 ROAS 0.8，比成本还低，立刻停。

- term: CPL
  aliases: [Cost Per Lead]
  category: abbr
  literal: Cost Per Lead
  meaning: 获取一条销售线索（潜在客户）花多少钱。B2B、保险、教育这类要"先线索后转化"的业务最关心 CPL。
  example: 教育公司一条 CPL 300 块，转化率 5% 才回本。

- term: CPS
  aliases: [Cost Per Sale]
  category: abbr
  literal: Cost Per Sale
  meaning: 按"实际成交"付广告费——卖出一单付一份钱。淘宝客、CPS 联盟营销用这种结算。
  example: 美妆品牌找 KOL 走 CPS，成交才付佣金。

# --- 留存与流失 ---

- term: 留存率
  aliases: [retention rate]
  category: jargon
  meaning: 用户在一段时间后还回来用的比例——"次日留存""7 日留存""30 日留存"是经典三档。留存高=产品有粘性。游戏圈"7 日留存 40%"是中等水平。
  example: 这款 App 30 日留存只 5%，运营怎么救都救不回来。

- term: 次日留存
  aliases: [D1 留存]
  category: jargon
  meaning: 用户注册第二天还会回来用的比例——拉新效果最直接的指标。次日留存低=用户第一天的体验出问题。游戏 50%+ 算优秀，工具类 30%+ 不错。
  example: 次日留存才 20%，新手引导得重做。

- term: 7 日留存
  aliases: [D7 留存]
  category: jargon
  meaning: 注册满 7 天还活跃的比例。"D7 留存 40%"算中上。这指标兼顾"用户第一周的体验+习惯养成"。
  example: 新版本 D7 留存涨了 8 个点，引导改对了。

- term: 30 日留存
  aliases: [D30 留存]
  category: jargon
  meaning: 一个月后还活跃的比例。判断"用户长期粘性"的关键。30 日留存 30%+ 已经是相当优秀的产品。
  example: 30 日留存稳在 35%，说明产品有真实价值。

- term: 流失率
  aliases: [churn rate]
  category: jargon
  meaning: 一段时间内流失用户占比。"月流失率 10%"=每月 10% 的人不再用。和留存互补：留存率 + 流失率 = 100%。
  example: 这个月流失率 15%，运营得搞召回活动。

- term: 召回率
  aliases: [recall rate, recall, 查全率]
  category: jargon
  meaning: 两层意思：(1) 运营：被召回回来的流失用户占比；(2) 算法/搜索：相关结果被检索出来的比例（recall）。语境决定。
  example: 短信召回这批沉默用户，召回率 8%——回本了。

# --- 流量 ---

- term: 流量
  aliases: [traffic, 站点流量]
  category: jargon
  meaning: 来访的用户量统称。"网站日流量 100 万"=每天 100 万 PV/UV。也指"流量入口"=用户从哪里来。
  example: 双 11 流量爆炸，服务器扩 5 倍才扛住。

- term: 流量池
  aliases: []
  category: jargon
  meaning: 一个平台/账号下你能反复触达的用户集合。微信群、企微好友、公众号粉丝都是"自己的流量池"。和"公域流量"相对——公域要花钱买，私域流量池是你"圈起来的"。
  example: 这条短视频导粉 1 万到企微，扩大私域流量池。

- term: 流量入口
  aliases: [入口流量]
  category: jargon
  meaning: 用户访问的"门口"——搜索、首页、推荐位、广告位都是流量入口。"抢入口"=抢用户必经之路。微信支付按钮是高频入口，所以兵家必争。
  example: 大牌品牌花几亿抢淘宝首页流量入口。

- term: 自然流量
  aliases: [自然搜索, organic traffic]
  category: jargon
  meaning: 不花钱来的流量——搜索引擎自然结果、用户主动分享、社交推荐都是。和"付费流量"相对。自然流量增长难但成本低且稳。
  example: 这个站 80% 是自然流量，SEO 做得好。

- term: 付费流量
  aliases: [paid traffic, 投放流量]
  category: jargon
  meaning: 花钱买的流量——广告投放、KOL 推广、信息流广告。和自然流量相对。付费流量快但贵，停投立刻没流量。
  example: 公司主要靠付费流量起家，但 ROAS 在下降。

# --- 转化漏斗 / 互动指标 ---

- term: 转化漏斗
  aliases: [conversion funnel]
  category: jargon
  meaning: 想象用户从看到 → 点击 → 加购 → 下单 → 付款，每步都掉一批人，画出来上宽下窄像漏斗。优化转化率就是放大漏斗每层的通过率。
  example: 看转化漏斗发现"加购到下单"环节流失最严重，得改下单页。

- term: 跳出率
  aliases: [bounce rate]
  category: jargon
  meaning: 用户进网站只看了一页就离开的比例。"跳出率 70%"=70% 的人进来一眼就走。低跳出率=用户被内容留住，高跳出率=吸引点击但内容失望。
  example: 这篇文章跳出率 90%，标题党了吧。

- term: 完播率
  aliases: [completion rate, 看完率]
  category: jargon
  meaning: 视频/直播被完整看完的比例。抖音/B 站算法最重视的指标之一——完播率高，系统就给你推更多流量。
  example: 这条短视频完播率 65%，算法判定优质内容，推荐量爆炸。

- term: 停留时长
  aliases: [time on page, 时长]
  category: jargon
  meaning: 用户在页面/App 上停留多久。停留时间长说明用户感兴趣。算法推荐很看这个——抖音首页一刷 30 分钟就是停留时长创造的。
  example: App 改版后人均停留时长从 8 分钟降到 5 分钟，要查原因。

- term: 互动率
  aliases: [engagement rate]
  category: jargon
  meaning: 用户主动操作（点赞、评论、转发、收藏）占曝光的比例。社交平台/内容平台核心指标。
  example: 这条小红书互动率 8%，远高于平均，算爆款雏形。

- term: 点赞率
  aliases: [like rate]
  category: jargon
  meaning: 看到内容里点赞的人占比。互动率细分指标。
  example: 这条朋友圈点赞率达到 30%——人缘真好。

- term: 触达率
  aliases: [reach rate]
  category: jargon
  meaning: 推送/通知/消息被用户实际看到的比例。"消息推送触达 70%"=发 100 条，70 条到了用户眼前。短信因为不被屏蔽，触达率最高。
  example: 短信召回触达率 95%，但 push 通知只有 40%。

# --- 用户分群 / 画像 ---

- term: 用户画像
  aliases: [user profile]
  category: jargon
  meaning: 一个虚拟的"典型用户长什么样"的描述——年龄、性别、收入、兴趣、行为习惯。做产品/做投放前都要画用户画像，避免凭感觉。
  example: 这款 App 用户画像是"25-35 一线城市白领"，新功能针对他们设计。

- term: persona
  aliases: [设计 persona, user persona]
  category: jargon
  meaning: 用户画像的英文。Persona 多用于设计圈/产品圈："为 Persona A（24 岁刚毕业小红书爱好者）做这个功能"。
  example: 产品文档每个 persona 都有专门解决方案。

- term: 用户分层
  aliases: [user segmentation, 分层运营]
  category: jargon
  meaning: 把用户按消费、活跃、忠诚度分成 N 层，对每层用不同策略。VIP 给折扣、流失风险者发挽留券、新人发体验券——精细化运营基本功。
  example: 用户分层后 VIP 用户保留率提升 20%。

- term: 用户分群
  aliases: [user cluster, 聚类]
  category: jargon
  meaning: 用算法/规则把用户分成几"群"——"价格敏感型""品质敏感型""图便宜型"。比"分层"颗粒度更细，常用 RFM/聚类算法做。
  example: 用 K-means 把用户分 5 群，针对性发优惠券。

- term: RFM
  aliases: [RFM 模型]
  category: abbr
  literal: Recency, Frequency, Monetary
  meaning: 一种经典用户分析模型——三个维度：最近一次消费时间（R）、消费频次（F）、消费金额（M）。把每个维度切几档组合，能把用户分成 8 类（如"高 R 高 F 高 M"=核心 VIP）。
  example: 用 RFM 把用户分群，针对"高价值流失"的下重金召回。

- term: 同期群
  aliases: [cohort, cohort analysis, 队列分析]
  category: jargon
  meaning: 按某个共同特征（如"同一周注册"）把用户分组，跟踪每组的行为变化。最常用：周同期群留存分析——看每周拉的新人后续怎么样。
  example: 同期群分析显示 9 月拉的新人留存比 8 月低，9 月广告渠道有问题。

- term: 归因
  aliases: [attribution, 渠道归因]
  category: jargon
  meaning: 用户最终下单了，功劳算给哪个渠道？广告？搜索？朋友推荐？归因模型决定怎么分功劳。常见模型：最后一次点击、首次点击、线性、时间衰减。
  example: 改成多触点归因后，朋友圈广告的贡献从 5% 变 20%。

- term: 北极星指标
  aliases: [North Star, North Star Metric, NSM]
  category: jargon
  literal: 像北极星一样永远指向北方
  meaning: 一个公司/产品最关心的"灯塔指标"——所有团队的工作都要服务于它。Airbnb 是"订房晚数"、Facebook 是"日活跃用户"。其他指标都是"支线"。
  example: 把北极星指标改成"次日留存"后，新人引导团队优先级全变。

- term: 数据看板
  aliases: [数据大盘, BI 看板]
  category: jargon
  meaning: 把关键指标可视化在一个页面——折线图、柱状图、漏斗图齐全。老板和运营每天看的"驾驶舱"。常用 Tableau、PowerBI、自建 BI 平台。
  example: 写完数据看板，老板每天早上必看才安心。

- term: 健康度
  aliases: [产品健康度, health score]
  category: jargon
  meaning: 综合衡量产品/业务"是否健康"的复合指标——留存+营收+增长+用户满意度加权。比单看 DAU 客观。
  example: 这个产品健康度连续三个月下降，要紧急复盘。

# --- 增长 / 营销 ---

- term: 增长黑客
  aliases: [growth hacker, growth hacking]
  category: jargon
  literal: 用工程方法做增长的人
  meaning: 用数据、A/B 测试、技术手段做用户增长的角色/方法论。Dropbox 邀请送空间、PayPal 给注册送 10 美元都是经典增长黑客案例。
  example: 找个增长黑客来优化注册转化，比堆产品功能管用。

- term: 病毒系数
  aliases: [K 因子, viral coefficient, K factor]
  category: jargon
  meaning: 衡量"产品自传播能力"的数字——一个用户能带来多少新用户。K > 1 意味着自然指数增长（拼多多砍一刀经典案例）。K < 1 就是普通转化。
  example: 设计了砍一刀邀请后 K 因子从 0.3 升到 1.2，注册量爆炸。

# --- 内容/社群运营 ---

- term: 种草
  aliases: [种草帖]
  category: jargon
  literal: 在心里种下购买欲的草
  meaning: 用内容（推荐/测评/晒物）激发用户购买欲。小红书的核心玩法。"被种草了"=被一篇内容打动想买。
  example: 这款相机被小红书种草，月销翻 5 倍。

- term: 拔草
  aliases: [拔了]
  category: jargon
  literal: 把种下的草拔掉（实际买了）
  meaning: 真正下单买了"被种草的东西"。"我拔草了那个口红"=我真的买了那只口红。也指"放弃种草"（看到差评不买了）。
  example: 看了三天测评终于拔草买了那把椅子。

- term: 平替
  aliases: [平价替代]
  category: jargon
  meaning: 比贵货便宜很多的替代品。小红书最热搜索词之一——"YSL 口红平替""LV 包平替"。年轻人消费降级背景下的高频词。
  example: 想买兰蔻贵，姐妹推荐一款平替才 80 块。

- term: 避雷
  aliases: [避雷指南]
  category: jargon
  literal: 避开雷区（不踩坑）
  meaning: 类似"别买这个/别去这家"的提醒帖。和种草相反——种草让你买，避雷让你别买。"求避雷"=求别人告诉我哪些不要买。
  example: 这家奶茶店避雷帖刷屏，难喝还贵。

- term: 红人
  aliases: [网红, internet celebrity]
  category: jargon
  meaning: 网络上有影响力的人——粉丝几万到几千万。带货能力是其核心商业价值。比"KOL"更口语化。
  example: 找几个本地红人合作推这家店。

- term: 达人
  aliases: [达人探店]
  category: jargon
  meaning: 某领域有专业度+影响力的人。和"红人"区别：达人偏专业，红人偏知名。淘宝/小红书/抖音都有"达人计划"。"达人探店"是常见短视频形式。
  example: 找美食达人探店，10 个 5 万粉的比 1 个百万粉划算。

- term: 社群运营
  aliases: [社群]
  category: jargon
  meaning: 通过微信群/QQ 群/Discord 等运营用户的工作。日常发优惠、组织活动、维护活跃。"社群"是私域运营的核心载体。
  example: 这家健身房靠社群运营，把会员复购率从 30% 提到 60%。

- term: 内容运营
  aliases: [content ops]
  category: jargon
  meaning: 生产/分发内容来吸引和留住用户的工作。包括公众号写文、小红书发笔记、视频脚本策划。和"用户运营""活动运营""产品运营"并列。
  example: 内容运营每天要发 5 条小红书，撑起品牌曝光。

# --- 通用产品词 ---

- term: feature
  aliases: [功能, 特性]
  category: devterm
  meaning: 产品的一个具体功能。"加个 feature"=做个新功能。和"bug"配对——feature 是有意为之的能力。开发者间还有梗"It's not a bug, it's a feature"（你以为是 bug 其实是设计）。
  example: 这次迭代加了"批量删除"feature，用户反馈很好。

- term: case
  aliases: [case study, 案例]
  category: devterm
  meaning: 两层意思：(1) 业务"案例"——真实使用场景或客户故事，用于学习/营销；(2) "case study"=深入剖析某个项目的文章。To B 销售/咨询特别看重 case。
  example: 这家 SaaS 公司主页全是大客户 case，方便潜客对号入座。

- term: use case
  aliases: [使用场景, 用例]
  category: devterm
  meaning: 产品/功能要被怎么用的具体场景描述。"这个 feature 的 use case 是 X"=它解决 X 场景下的问题。和 case 区别：use case 偏"功能用法"，case 偏"客户故事"。
  example: 写需求文档先列 5 个核心 use case，再设计功能。

- term: 用户故事
  aliases: [user story]
  category: jargon
  meaning: 敏捷开发里描述需求的格式："作为某用户，我想要 X，以便 Y"。比"功能列表"更聚焦用户视角。
  example: 用户故事"作为 VIP 我想一键导出订单方便报销"，列入下迭代。

- term: 用户旅程
  aliases: [user journey, customer journey]
  category: jargon
  meaning: 把用户从认知品牌→第一次试→反复使用→流失的全过程画成一张图。每个环节标出用户痛点+情绪。设计/运营圈高频词。
  example: 画完用户旅程图，发现客服环节是最大流失点。

- term: 产品经理
  aliases: [PM, Product Manager, Project Manager, 项目经理, PMP]
  category: jargon
  meaning: ① **产品经理（中国互联网默认含义）**——负责定义产品做什么、怎么做、什么时候做。需求写得好坏直接决定产品命运。常被吐槽"啥也不会但啥都管"。② **项目经理（欧美/传统行业含义）**——管时间、资源、风险，推进项目按时上线。PMP 认证就是给这种 PM 考的。互联网公司里"PM"基本指产品经理，但和欧美/外企同事说 PM 多半指 Project Manager，要小心歧义。③ **TPM**（Technical Program Manager）介于两者之间，偏技术、跨团队协调。
  example: 中国互联网公司说"我们 PM 还没出 PRD"——肯定是产品经理；美企 stand-up 里"PM is tracking the milestone"——多半是项目经理。

- term: PRD
  aliases: [Product Requirements Document, 需求文档]
  category: abbr
  literal: Product Requirements Document
  meaning: 产品需求文档——产品经理写给开发/设计/测试看的"做什么"说明书。包含用户场景、功能描述、交互逻辑、边界情况。
  example: PRD 评审会上设计师当场指出 3 个矛盾点。

- term: BRD
  aliases: [Business Requirements Document]
  category: abbr
  literal: Business Requirements Document
  meaning: 商业需求文档——比 PRD 更前置。讲"为什么做这事+商业价值"，给老板看的。常见结构：背景、问题、机会、方案、收益预估。
  example: 立项前先写 BRD 说服老板批资源。

- term: MRD
  aliases: [Market Requirements Document]
  category: abbr
  literal: Market Requirements Document
  meaning: 市场需求文档——介于 BRD 和 PRD 之间。讲"市场上有什么需求+竞品做了什么+我们怎么切入"。
  example: MRD 调研显示竞品都缺这个能力，我们做差异化优势。

- term: 周活
  aliases: [Weekly Active Users]
  category: abbr
  meaning: 周活跃用户数——一周内访问过的去重用户数。介于日活（DAU）和月活（MAU）之间。"WAU 占 MAU 比例"反映用户活跃强度。注：英文缩写 WAU 已在 DAU 词条里收录。
  example: 这款 App 周活 1000 万，月活 1500 万，活跃强度还行。

# ====================
# 数据分析 / 统计向
# ====================


- term: p-value
  aliases: [p 值]
  category: product
  meaning: A/B 测试结果"是不是真的、还是碰运气"的概率——p < 0.05 一般认为"显著"（不是巧合）。0.05 是行业惯例阈值。
  example: B 版提升 5%，p-value 0.02，可以发版。

- term: 置信区间
  aliases: [confidence interval]
  category: product
  meaning: 给一个估计值一个"区间范围"——比如 95% CI 是 [3%, 7%]=有 95% 把握真实提升在这区间。比一个点估计更靠谱。
  example: CTR 提升 5%，95% 置信区间 [2%, 8%]。

- term: 显著性
  aliases: [statistical significance, 统计显著]
  category: product
  meaning: 结果"不是随机巧合"的程度。"显著"=p 值小于阈值（通常 0.05）。"不显著"=数据看着有差异但可能只是噪音。
  example: B 版表面提升 2% 但不显著，再跑两周。

- term: effect size
  aliases: [效应量]
  category: product
  meaning: 差异的"实际大小"——不只问"是不是真的提升"（显著性），也问"提升了多少"（实际意义）。1 亿用户提 0.1% 显著但效应量小。
  example: p-value 显著但 effect size 太小，不值得上。

- term: 统计功效
  aliases: [statistical power]
  category: product
  meaning: A/B test"能不能检测出真实差异"的能力——样本不够大时即使有差异也测不出（功效低）。设计实验前要算出"至少跑多少样本"才有 80% 功效。
  example: 这实验样本太小，统计功效不足。

- term: 贝叶斯
  aliases: [Bayesian]
  category: product
  meaning: 一种统计学派——核心是"用先验+数据更新认知"。和频率派对立。Bayesian A/B 测试能给你"B 比 A 好的概率是 90%"这种直观结果。
  example: 我们的 A/B 测试平台改成 Bayesian 框架了。

- term: 频率派
  aliases: [Frequentist]
  category: product
  meaning: 经典统计学派——基于"假设检验+p 值"。和 Bayesian 对立。互联网 A/B 测试大多还是用频率派（p < 0.05 拍板）。
  example: 频率派 p-value 卡 0.05 太机械，老板天天问含义。

- term: multi-armed bandit
  aliases: [多臂老虎机, MAB]
  category: product
  meaning: A/B test 升级版——边测边调整流量分配，赢家慢慢拿到更多流量。比传统 A/B 探索-利用平衡更好。推荐系统、广告投放常用。
  example: 推荐策略用 multi-armed bandit，自动倾斜流量到表现好的。

- term: 因果推断
  aliases: [causal inference]
  category: product
  meaning: 不只看"相关"还看"是不是真因果"——A 涨 B 涨可能只是相关。因果推断用 DID、PSM、IV 等方法尽量逼近因果。互联网公司高级数据科学家核心技能。
  example: 这个增长归因要用因果推断方法，不能简单看相关。

- term: DID
  aliases: [Difference-in-Differences, 双重差分]
  category: product
  meaning: 因果推断经典方法——比较"实验组前后变化"和"对照组前后变化"的差。剔除时间趋势影响。常用于无法做 A/B 的政策评估。
  example: 涨价对销量影响用 DID 评估，对照组是没涨价的城市。

- term: RCT
  aliases: [Randomized Controlled Trial, 随机对照试验]
  category: product
  meaning: 医学和社会学的"金标准"——随机分组+对照。A/B test 本质就是互联网版的 RCT。能给出真因果。
  example: 这次研究做 RCT，1 万人随机分组。

- term: 辛普森悖论
  aliases: [Simpson's paradox]
  category: product
  meaning: 整体趋势和分组趋势相反——A 公司每个学院录取率都比 B 高，但总录取率 B 比 A 高。背后是分组比例不一样。数据分析陷阱必知。
  example: 别只看总转化率，可能掉进辛普森悖论。

- term: 幸存者偏差
  aliases: [survivorship bias]
  category: product
  meaning: 只看"活下来的"忽略"挂掉的"——分析"成功创业者特质"时漏掉失败的几万人。结论看似有理但完全偏。"取样偏差"的经典例子。
  example: 这调研只采访了在职员工，幸存者偏差严重。

- term: 一类错误
  aliases: [Type I error, 假阳性, 弃真]
  category: product
  meaning: 假阳性——本来没差异你错说有差异。p < 0.05 含义就是"一类错误概率 < 5%"。
  example: 一类错误率 5% 意味着 100 个"显著"结果有 5 个是假的。

- term: 二类错误
  aliases: [Type II error, 假阴性, 取伪]
  category: product
  meaning: 假阴性——本来有差异你没测出来。一类二类此消彼长。统计功效=1 - 二类错误率。
  example: 样本不够大二类错误率高，错过真改进。





- term: 留存曲线
  aliases: [retention curve]
  category: product
  meaning: 把"D1 留存、D7 留存、D30 留存"画成曲线——好产品曲线平、差产品曲线断崖。SaaS/App 健康度核心。
  example: 这版本留存曲线 D7 后变平，说明真留下了一批粉。

- term: LTV/CAC
  aliases: [LTV CAC 比]
  category: product
  meaning: 用户终身价值除以获客成本——> 3 是健康 SaaS、< 1 烧钱模式。投资人尽调必问的核心比率。
  example: LTV/CAC 1.5，离 3 还远，需要降 CAC 或提 LTV。

- term: payback period
  aliases: [回本周期]
  category: product
  meaning: 花 100 块拉一个客需要多少个月赚回来——12 个月内回本是 SaaS 健康线。24 个月 + 看 LTV 撑不撑得住。
  example: payback period 18 个月，给融资讲故事时还行。

- term: NPS
  aliases: [Net Promoter Score, 净推荐值]
  category: abbr
  literal: Net Promoter Score
  meaning: 用户调研问一题"你会推荐给朋友吗 0-10 分"——9-10 是推荐者、0-6 是诋毁者。% 推荐者 - % 诋毁者 = NPS。互联网产品健康度常用指标。
  example: 这版本 NPS 从 30 涨到 45，推荐意愿明显上升。

- term: CSAT
  aliases: [Customer Satisfaction]
  category: abbr
  literal: Customer Satisfaction Score
  meaning: 客户满意度——通常问"这次服务你打几分（1-5）"，算 4-5 分比例。客服/售后场景常用。和 NPS 互补，CSAT 看具体一次体验。
  example: 客服 CSAT 这季度 92%，达标。

# --- 实验设计 / A·B 测试 ---

- term: 实验组
  aliases: [treatment group, 处理组, 干预组]
  category: product
  literal: treatment group
  meaning: A/B 测试里用上"新东西"的那拨用户——看到新按钮、新策略的那组。它和对照组唯一的区别就是这个改动，这样两组一比，差异才能归因到改动本身。分组必须随机，否则差异说不清是改动的功劳还是人群本来就不同。
  example: 实验组上新推荐算法，对照组保持原样，比两周留存。

- term: 对照组
  aliases: [control group, 控制组, 基准组, 对照桶]
  category: product
  literal: control group
  meaning: A/B 测试里"啥也不改、保持原样"的那拨用户，当基准线用。没有它你根本不知道实验组的变化是改动带来的，还是大盘本来就在涨跌（节假日、季节都会动）。对照组就是用来扣掉这些大环境波动的。
  example: 没设对照组，这次提升根本说不清是不是改版的功劳。

- term: 流量分桶
  aliases: [bucketing, 分桶, 流量分流, traffic split]
  category: product
  literal: traffic bucketing
  meaning: 把用户按哈希切成若干"桶"，分别灌进实验组和对照组——这是 A/B 落地的第一步。讲究是同一个用户每次都进同一个桶（体验一致），且各桶人群随机均匀。分桶不均或串桶，实验数据就废了。
  example: 按 user_id 哈希做流量分桶，保证用户每次进同一组。

- term: AA 测试
  aliases: [A/A test, AA test, A/A 实验, AA 实验]
  category: product
  literal: A/A test
  meaning: 两组都用"同样的东西"先跑一轮——理论上不该有差异。它是 A/B 系统的体检：如果连 AA 都跑出"显著差异"，说明分桶有偏、埋点有 bug 或统计方法有问题，这时做 A/B 全是假信号。正式实验前的标准 sanity check。
  example: 先跑 AA 测试，两组没差异再上真实验，否则先查分桶。

- term: 最小可检测效应
  aliases: [MDE, minimum detectable effect, 最小可检出效应]
  category: product
  literal: minimum detectable effect
  meaning: 在给定样本量和功效下，这个实验"最小能看出多大的提升"。MDE=2% 意味着真实提升若小于 2% 你大概率检不出（会误判成没效果）。它和样本量互相牵制：想抓更小的提升，就得堆更多样本。设计实验时先想清楚要抓多大效应。
  example: 样本就这么多，MDE 算下来 3%，1% 的小优化根本测不出。

- term: 新奇效应
  aliases: [novelty effect, 新鲜感效应]
  category: product
  literal: novelty effect
  meaning: 新功能刚上线时用户因为"图新鲜"猛点，数据虚高，过阵子热度退了就打回原形。A/B 测试经典陷阱：跑两天看到暴涨就拍板，其实是新奇效应。解法是把实验跑够长（覆盖新鲜感消退），看稳定后的水平。
  example: 上线头三天点击翻倍，多半是新奇效应，再观察一周再下结论。

- term: 序贯检验
  aliases: [sequential testing, peeking, 偷看问题, 反复看数据]
  category: product
  literal: sequential testing / peeking
  meaning: A/B 实验"边跑边反复瞄 p 值，一看到显著就喊停"——这会把误报率严重放大（多看几次总能撞上一次偶然显著）。要么老实等预定样本量到了再看，要么用专门的序贯检验方法（已校正多次查看）。中途偷看就拍板是常见翻车点。
  example: 别天天盯着 p 值、一显著就停——这种偷看让结论根本不可信。

- term: CUPED
  aliases: [方差削减, variance reduction]
  category: product
  literal: Controlled-experiment Using Pre-Experiment Data
  meaning: 一种给 A/B 实验"提灵敏度"的技巧——用用户实验前的历史数据扣掉个体基线波动，让指标方差变小，于是更小的样本就能检出同样效应（或同样样本更快出结论）。大厂实验平台的标配优化，本质是"先减噪再比较"。
  example: 上了 CUPED 后方差降了一截，实验跑一半时间就够显著。

- term: 双盲
  aliases: [double-blind, 双盲实验, 单盲, 盲评]
  category: product
  literal: double-blind
  meaning: 实验里"参与者和执行者都不知道谁被分到哪组"，防的是心理暗示和主观打分作弊（知道自己用的是新版会自我感觉良好）。医学试验金标准。互联网 A/B 天然接近双盲（用户不知情），但人工评测打分时仍要做盲评防偏。
  example: 人工评两版输出要盲评——别让标注员知道哪个是新模型。

- term: 协变量
  aliases: [covariate, 控制变量, 协变项]
  category: product
  literal: covariate
  meaning: 不是你研究的主角、但会影响结果、需要"控制住"的变量——研究新功能对留存的影响时，用户活跃度、机型、地区都是协变量。分析时把它们对齐或纳入，才能把效果干净归因到你真正关心的因素，否则容易被带偏（见混杂变量）。
  example: 两组年龄结构不一样，得把年龄当协变量调整后再比。

- term: 交互效应
  aliases: [interaction effect, 交互作用, 调节效应]
  category: product
  literal: interaction effect
  meaning: 两个因素一起作用的效果不等于各自相加——新策略对新用户有用、对老用户反而有害，整体一平均看着"没影响"，其实是被交互效应掩盖了。所以 A/B 结论要分人群看，别只盯大盘平均，否则会错过"对某类人特别好/特别差"。
  example: 大盘没动，但分群一看是交互效应：新客涨、老客跌，抵消了。

- term: 安慰剂效应
  aliases: [placebo effect, 安慰剂]
  category: product
  literal: placebo effect
  meaning: 人只要"以为自己被特殊对待了"，哪怕啥也没真改，体验和反馈也会变好。这就是为什么要有对照组和盲评——不然你分不清提升是真功能带来的，还是用户"觉得有新东西"的心理作用。做用户调研、内测尤其要防它。
  example: 内测组都说变快了，但其实没改性能——典型安慰剂效应。

# ====================
# SaaS 计费 / 套餐 / 用量
# 订阅制时代的"定价模型"高频词
# ====================

- term: free tier
  aliases: [免费版, 免费档]
  category: jargon
  literal: free tier
  meaning: SaaS/云的免费档——通常限功能/限用量。AWS Free Tier 12 个月内 EC2 t2.micro 750 小时免费、OpenAI 给新用户 $5 试用、Notion 个人版功能基本全开。free tier 是 SaaS 标配获客手段，目标是把用户升级到付费档。
  example: 先用 free tier 把团队拉上来，三个月后再谈 paid。

- term: paid tier
  aliases: [付费档, paid plan]
  category: jargon
  literal: paid tier / paid plan
  meaning: SaaS 的付费档——常分 Starter/Pro/Business/Enterprise 几档，越往上越贵+越多功能/配额。SaaS 三层定价 freemium → paid → enterprise 是经典模式。Enterprise 通常"contact sales"不公开报价。
  example: 用户量超 50 必须升 Business tier，每月多 200 刀。

- term: freemium
  aliases: [免费增值, free + premium]
  category: jargon
  literal: freemium (free + premium)
  meaning: SaaS 商业模式——基础功能永久免费、高级功能付费。Spotify、Notion、Slack 都是典型。和"免费试用"区别：freemium 永远免费、试用版限时。"freemium 转化率"是 SaaS 健康度核心指标。
  example: Notion 是 freemium，95% 用户永远免费 + 5% 付费养整个公司。

- term: usage-based pricing
  aliases: [按量计费, pay as you go, PAYG, consumption pricing]
  category: jargon
  literal: usage-based / consumption-based pricing
  meaning: 按实际用量收费——AWS 按 CPU 小时、Snowflake 按查询计算单位、OpenAI 按 token、Twilio 按短信条数。和"按席位订阅"对立。"用多少花多少"看着合理但月底账单常常爆炸。
  example: 这家从 seat-based 转 usage-based，ARPU 涨 3 倍但 churn 也涨。

- term: seat-based pricing
  aliases: [按席位计费, per-seat pricing]
  category: jargon
  literal: seat-based / per-seat pricing
  meaning: 按用户数收费——Notion 每席 $10/月、Slack 每席 $7.25/月。SaaS 传统主流模式。优点：可预测；缺点：用户加得快公司利润涨不动（一个公司就一份钱）。
  example: 这家 50 人团队 Notion 每月 $500，seat-based 模式。

- term: overage
  aliases: [超额, 超量费, overage fee]
  category: jargon
  literal: overage / overage charge
  meaning: 超出套餐用量的额外收费——AWS 流量超 100GB 后 $0.09/GB、电信"流量包用完后按 5 元/GB"。"overage 收费"是 SaaS 利润大头之一。设计良好的定价让用户既不敢用太多（贵）也不敢用太少（不值）。
  example: 上月超用 50GB，overage 多收 $4.5。

- term: credit
  aliases: [信用额, 积分, API credit]
  category: jargon
  literal: credit (in SaaS/API context)
  meaning: SaaS/API 的"内部货币"——预充值 $10 credit 兑换 N 个 API 调用。OpenAI、Anthropic、Replicate 都用 credit 系统。优点：用户感觉不到具体金额、方便促销（送 $5 credit）；缺点：不透明（每个 endpoint 单价不同）。
  example: 充 $20 送 $5 credit，活动期间转化暴涨。

- term: billing cycle
  aliases: [计费周期, billing period]
  category: jargon
  literal: billing cycle
  meaning: 一个计费周期——通常按月或按年。月付灵活但贵 15-25%、年付便宜但绑死。"billing cycle reset"= 用量清零、月度限额重置。SaaS 财务/留存指标都按 billing cycle 算。
  example: 月初 billing cycle reset，quota 重置。

- term: annual contract
  aliases: [年单, annual commit, ACV 合同]
  category: jargon
  literal: annual contract
  meaning: 客户签 12 个月的合同——SaaS 销售最爱（一次锁住一年现金流）。常配合年付折扣（比月付便宜 15-20%）。"annual commit"是更弱版本（承诺一年但月付）。和 monthly subscription 相对。
  example: 这家年单 $120k 比月付节省 $30k。

- term: TCV
  aliases: [Total Contract Value, 合同总额]
  category: abbr
  literal: Total Contract Value
  meaning: 一份合同的总金额——多年合同尤其重要。3 年合同 $30k/年 → TCV $90k。和 ACV（Annual Contract Value，年度合同额）配套。投资人看 SaaS 估值常用 TCV 估算 backlog。
  example: 签了 3 年合同，TCV $300k。

- term: ACV
  aliases: [Annual Contract Value, 年度合同额]
  category: abbr
  literal: Annual Contract Value
  meaning: 一份合同每年贡献多少收入——多年合同就是 TCV/年数。和 ARR 区别：ARR 是全公司层面、ACV 是单合同层面。"new ACV"是销售团队的核心 KPI。
  example: 销售季度目标是 new ACV $500k。

- term: expansion revenue
  aliases: [扩张收入, 增购]
  category: jargon
  literal: expansion revenue
  meaning: 老客户多花的钱——加席位、升级套餐、买附加功能。NRR > 100% 全靠 expansion。"land and expand"是 SaaS 销售圣经：先小单进门，再做大。
  example: Snowflake NRR 158% 几乎都是 expansion 贡献。

- term: land and expand
  aliases: [先入门后增购, 渗透增购]
  category: jargon
  literal: land and expand
  meaning: SaaS 销售圣经——先签小单"落地"（land），再通过更多席位/部门/产品做大（expand）。Atlassian/Snowflake/Datadog 都是这套打法。bottom-up SaaS 必备策略。
  example: 这家 land and expand 玩得溜，3 年单客户合同涨 10 倍。

- term: onboarding
  aliases: [on-boarding, 入职引导, 新手引导, 首次引导, 用户引导]
  category: product
  literal: onboarding
  meaning: 想象去新公司第一天——HR 带你转一圈、办工卡、配电脑、加群、介绍同事。这套流程就是 onboarding。两种语境都常用：1) HR 圈：新员工入职引导；2) 产品圈：新用户首次打开产品到完成关键动作的引导流程（注册 → 验证 → 第一次用到核心功能）。决定首日留存。关键指标：完成率、Aha Moment 到达时间。坑：太长用户烦、太短用户懵。Notion / Linear / Superhuman 的产品 onboarding 是抄都抄不完的范本。AI Agent 产品兴起后，"AI 同事上岗 onboarding"成了新课题——Helio 一进门就是 HR Manager 帮你"招团队"。
  example: 新版 onboarding 砍了 3 步后首日留存涨了 8 个点。



# --- batch: SEO 搜索引擎优化 ---

- term: SEO
  aliases: [Search Engine Optimization, 搜索引擎优化, 自然排名优化]
  category: abbr
  literal: Search Engine Optimization
  meaning: 想象百度/谷歌是个大书架，谁排在第一排谁就被翻到——SEO 就是"不花广告费，靠优化网站让自己自然爬到搜索结果前排"的一整套功夫：选对关键词、把内容写好、让别的网站给你链接（外链）、把网页技术结构整干净（加载快、能被爬虫读懂）。和 SEM（花钱买排名）相对：SEO 慢但流量免费且持久，SEM 快但停投就没。是十几年的流量基本功，2025 年因为 AI 搜索崛起又派生出 GEO（让 AI 引用你）。
  example: 公司官网把 SPA 改成 SSR 就是为了 SEO，让百度爬虫能读到内容。

- term: SEM
  aliases: [Search Engine Marketing, 搜索引擎营销, 付费搜索]
  category: abbr
  literal: Search Engine Marketing
  meaning: 花钱买搜索结果排名——用户搜"减肥药"，你出价竞拍，价高者的广告显示在最上面（带"广告"小标）。和 SEO 对偶：SEM 立刻见效但烧钱、停投即停量；SEO 慢热但流量免费。广义 SEM 包含 SEO，但中文语境里 SEM 几乎专指"竞价/付费推广"。百度推广、Google Ads 就是 SEM 平台。
  example: 新品上线先用 SEM 砸量测转化，跑通了再补 SEO 做长期。

- term: SERP
  aliases: [Search Engine Results Page, 搜索结果页]
  category: abbr
  literal: Search Engine Results Page
  meaning: 你在搜索框敲完回车后看到的那一整页结果——SERP。它不只是十条蓝链接了：顶部有广告位、中间夹着"精选摘要"（直接给答案的方框）、"大家还在搜"、知识卡片、图片视频块。SEO 的目标就是抢占 SERP 上更靠前、更显眼的位置。AI 时代 SERP 顶部还多了"AI 概览"（AI Overviews），进一步挤压自然链接的点击。
  example: 这个词的 SERP 顶部三条全是广告，自然排名第一其实是第四个才被看到。

- term: 关键词
  aliases: [keyword, 关键字, 搜索词]
  category: jargon
  meaning: 用户在搜索框里敲的那几个字——"上海 火锅 推荐"。SEO/SEM 的一切都围着关键词转：先做"关键词研究"（哪些词有人搜、搜的人多不多、竞争激烈不激烈），再决定优化哪些、投放哪些。分头部词（搜的人多但竞争狠，如"手机"）和长尾词（搜的人少但精准、好转化，如"2000元拍照好的安卓手机"）。
  example: 先拉一份关键词清单，按搜索量和竞争度排个优先级再写内容。

- term: 长尾关键词
  aliases: [long-tail keyword, 长尾词]
  category: jargon
  literal: long-tail keyword
  meaning: 又长又具体、单个搜的人不多但加起来量巨大的搜索词——"手机"是头部词，"预算两千续航好的备用机"就是长尾词。长尾词竞争小、意图明确、转化率高，是中小站做 SEO 的主战场（抢不过大站的头部词，就靠海量长尾词聚沙成塔）。名字来自长尾分布——参见 [[长尾]]。
  example: 大词拼不过竞品，我们专做长尾关键词，几百个小词堆出来的流量比一个大词还多。

- term: 外链
  aliases: [backlink, 反链, 反向链接, 外部链接, 导入链接]
  category: jargon
  literal: backlink
  meaning: 别的网站指向你网站的链接——相当于"投票"或"被人引用"。搜索引擎的逻辑：越多高质量网站链接你，说明你越权威，排名给你往上提。所以"发外链/换外链"是 SEO 老三样之一。但注意质量＞数量：垃圾站群的外链（黑帽）会被判作弊降权，权威媒体的一条外链顶一万条垃圾链。锚文本（链接上挂的文字）也影响效果。
  example: 这篇被几个行业大号转载带了外链，关键词排名一周从第三页冲到首页。

- term: 内链
  aliases: [internal link, 站内链接]
  category: jargon
  literal: internal link
  meaning: 网站内部页面之间的互相链接——文章 A 里链到文章 B。作用有二：① 帮搜索引擎爬虫把全站页面都爬到、理解结构（哪些是重点）；② 把首页/高权重页的"权重"分流给深层页面。"内链建设"是 SEO 基本功，常配合面包屑导航、相关推荐做。和外链对偶：内链是自己站里走，外链是别的站过来。
  example: 给老文章补内链指向新落地页，没花一分钱排名就动了。

- term: 锚文本
  aliases: [anchor text, 锚文字]
  category: jargon
  literal: anchor text
  meaning: 一个超链接上能点的那段文字——比如"点这里下载"里的"点这里"，或"最好的 CRM 工具"里挂着链接的整句。SEO 上很关键：搜索引擎会拿锚文本理解"被链接的页面是讲啥的"。所以做外链时，用"减肥食谱"当锚文本指向你的减肥页，比用"点击查看"效果好得多。但全站锚文本都一模一样会被判作弊。
  example: 外链锚文本要自然多样化，全用同一个关键词反而被搜索引擎当成刷排名。

- term: 收录
  aliases: [indexing, 被收录, 建立索引]
  category: jargon
  literal: indexed
  meaning: 搜索引擎的爬虫爬到你的网页、并把它存进索引库——这页才"被收录"了，用户才可能搜到它。没被收录＝在搜索引擎眼里这页不存在，再好的内容也是 0 流量。新站/新页常遇到"迟迟不收录"，解决靠：提交 sitemap、主动推送、补内外链引爬虫来爬。和"排名"是两回事：先收录（进库），才谈排名（库里排第几）。
  example: 新站上线两周百度才收录三页，赶紧去站长平台手动提交链接催收录。

- term: 蜘蛛
  aliases: [spider, 搜索引擎蜘蛛, 爬虫, crawler, bot]
  category: jargon
  literal: spider / crawler
  meaning: 搜索引擎派出去自动抓网页的程序——像蜘蛛顺着网（链接）一页页爬，把内容抓回去建索引。Googlebot、百度蜘蛛是代表。SEO 很多功夫是"伺候好蜘蛛"：robots.txt 告诉它哪能爬、sitemap 给它一张地图、网页加载快/结构清晰它才爬得动爬得全。SPA 纯前端渲染的坑就在这——蜘蛛抓到一片空白，所以要 SSR。
  example: 日志里全是百度蜘蛛在爬深层页，说明 sitemap 提交生效了。

- term: 落地页
  aliases: [landing page, 着陆页]
  category: jargon
  literal: landing page
  meaning: 用户点了广告/链接后"落地"的第一个页面——专为转化设计，目标单一（留资、下单、下载）。和普通官网首页不同：落地页砍掉一切干扰（没有复杂导航），从头到尾就一条线"勾起兴趣→讲清价值→喊你行动（CTA）"。投放圈"落地页转化率"是命根子：CTR 再高，落地页留不住人也白搭。A/B 测试最常测的就是落地页。
  example: 同一批量投到两版落地页 A/B 测，短的那版转化率高 40%，全量切过去。

- term: 白帽 SEO
  aliases: [白帽, white hat SEO, 正规 SEO]
  category: jargon
  literal: white hat SEO
  meaning: 守规矩的 SEO——按搜索引擎官方规则来：写真正有用的内容、自然获取外链、优化用户体验。慢，但稳，不会被惩罚。和黑帽对偶（黑帽走捷径作弊，快但随时被封）。名字借自西部片：好人戴白帽、坏人戴黑帽。还有"灰帽"——游走在规则边缘的擦边操作。
  example: 我们只做白帽 SEO，宁可慢慢涨也不碰站群外链那套，怕哪天被一锅端。

- term: 黑帽 SEO
  aliases: [黑帽, black hat SEO, 作弊 SEO]
  category: jargon
  literal: black hat SEO
  meaning: 走捷径作弊的 SEO——关键词堆砌、买卖外链、站群刷链接、隐藏文字（给爬虫看一套给用户看另一套，叫 cloaking）、刷点击。短期排名暴涨，但搜索引擎算法一更新或被人举报，轻则降权重则整站被 K（踢出索引），多年积累一夜归零。和白帽对偶。赌徒玩法，正经品牌不碰。
  example: 那个站靠黑帽冲到首页，没俩月就被百度 K 站了，域名都废了。

- term: 死链
  aliases: [broken link, 死链接, 失效链接, 404 链接]
  category: jargon
  literal: dead link / broken link
  meaning: 点了打不开、跳 404 的链接——目标页被删了、改了地址、或域名挂了。对用户是糟糕体验，对 SEO 是减分项（搜索引擎觉得你站没人维护）。所以要定期用工具扫死链、做 301 跳转或删掉。和"友链"相关：交换的友链对方哪天撤了或站挂了，就成了你这边的死链。
  example: 站长工具扫出来三百条死链，全是早年下架商品页，批量做 301 跳到分类页。

- term: 友链
  aliases: [友情链接, link exchange, 互链]
  category: jargon
  literal: friendly link
  meaning: 两个网站互相在自己页面（通常底部）挂对方链接——你链我、我链你，互相导流量、互相增外链权重。SEO 早年的常规操作，讲究"门当户对"（找权重相近、行业相关的站换）。坑：对方是垃圾站会连累你降权；对方哪天偷偷撤链（单向占便宜）或站挂了变死链，得定期检查。
  example: 跟几个同行换了友链，互相导流，对双方排名都有点小帮助。

- term: 站群
  aliases: [PBN, 私有博客网络, 链接农场, link farm]
  category: jargon
  literal: PBN（Private Blog Network）
  meaning: 批量建一堆网站、专门用来给"主站"刷外链的玩法——相当于自己养一群"托儿"互相点赞。黑帽 SEO 的经典套路，短期能把主站排名顶上去。但搜索引擎识别站群的能力越来越强，一旦被判定，整个网络连同主站一起降权/封杀。高风险，正规品牌不碰。
  example: 竞品那波排名是靠站群刷的，扛不住算法更新，下个月估计就掉下来。

- term: nofollow
  aliases: [nofollow 标签, dofollow, rel=nofollow]
  category: devterm
  literal: rel="nofollow"
  meaning: 链接上的一个属性标记，告诉搜索引擎"这条链接别传递权重、别算作我对它的背书"。用途：评论区/论坛的用户发的链接加 nofollow，防止被人灌垃圾外链蹭权重；付费广告链接按规则也要标 nofollow。反义是 dofollow（默认就是，会传权重）。做外链时大家都想要 dofollow 的（才有 SEO 价值），nofollow 的只能带点直接流量。
  example: 这个大站给的外链是 nofollow，SEO 权重为零，但好歹能带点真人点击。

- term: PageRank
  aliases: [PR 值, 网页权重算法]
  category: ai
  literal: PageRank
  meaning: 谷歌起家的核心算法——用"网页之间的链接关系"给每个页面打权重分：被越多、越权威的页面链接，你的分越高，排名越靠前。本质是把"链接当投票"，且大佬的票更值钱（递归定义）。以谷歌创始人 Larry Page 命名（一语双关）。早年谷歌工具栏会显示 0–10 的 PR 值，后来停更隐藏了，但思想仍是现代搜索排名的地基。
  example: 这套页面权重传递的思路就是 PageRank，被高权重页链一次顶普通页十次。

- term: 域名权重
  aliases: [DA, PA, Domain Authority, Page Authority, 站点权重, 权重]
  category: jargon
  literal: Domain Authority / Page Authority
  meaning: 第三方工具（Moz 等）给网站算的一个综合"江湖地位"分（0–100），预测它在搜索里的竞争力。DA 是整站权重、PA 是单页权重，分越高越好排名、外链越值钱。注意：这是工具的估算指标，不是谷歌官方排名因子，但 SEO 圈拿它当通用尺子衡量"这站强不强、值不值得换友链"。中文也常笼统说"权重几"。
  example: 对方站 DA 才 15，换友链没多大用，找个 DA 50+ 的才划算。

- term: 沙盒期
  aliases: [谷歌沙盒, 新站考核期]
  category: jargon
  literal: sandbox effect
  meaning: 新网站/新页面上线后的一段"观察期"——即便内容和外链都做得好，搜索引擎也先把它压着，不给好排名，等几周到几个月确认你不是垃圾站、有持续更新，才慢慢放出来。像新员工的试用期。所以做 SEO 急不得，新站头几个月"投入没产出"是正常的，熬过沙盒期流量才起。
  example: 站上线两个月一直没排名，别慌，多半还在沙盒期，坚持更新就行。

- term: TDK
  aliases: [TKD, title description keywords, 三大标签]
  category: abbr
  literal: Title / Description / Keywords
  meaning: 网页 SEO 的三个 meta 标签合称：Title（标题，SERP 上的蓝色大字，权重最高）、Description（描述，标题下那段灰色摘要，影响点击率）、Keywords（关键词，早被滥用刷烂、现在主流搜索引擎基本无视）。"设置 TDK"是每个页面做 SEO 的第一步基本功。Title 写不好＝白干。
  example: 这批页面 TDK 全是默认模板没改，难怪一个都没排名，先把 Title 按关键词重写。

- term: sitemap
  aliases: [网站地图, 站点地图, sitemap.xml]
  category: devterm
  literal: sitemap
  meaning: 一份列出网站所有重要页面地址的清单文件（通常是 sitemap.xml）——交给搜索引擎，相当于给爬虫递一张"全站地图"，告诉它"这些页都来爬一下、这页多久更新一次"。能加速收录、尤其帮深层页/新页被爬到。在站长平台提交 sitemap 是 SEO 标准动作。注意和给用户看的 HTML 网站导航页不是一回事。
  example: 新站不收录？先生成 sitemap.xml 提交到百度站长平台催爬虫。

- term: robots.txt
  aliases: [robots 协议, 爬虫协议]
  category: devterm
  literal: robots.txt
  meaning: '放在网站根目录的一个文本文件，用约定的语法告诉搜索引擎爬虫"哪些目录能爬、哪些别爬"（如后台、搜索结果页别爬）。是君子协定——正规爬虫（谷歌/百度）会遵守，恶意爬虫可以无视。SEO 上要小心：写错一行 `Disallow: /` 就是禁止爬全站，整站从搜索消失。AI 时代还衍生出用它（或 llms.txt）拦/放 AI 爬虫的讨论。'
  example: '上线把测试环境的 `Disallow: /` 忘了删，结果正式站被屏蔽，搜索流量归零。'

- term: 关键词堆砌
  aliases: [keyword stuffing, 关键词堆叠, 堆关键词]
  category: jargon
  literal: keyword stuffing
  meaning: 在网页里硬塞大量重复关键词想骗排名——"减肥减肥减肥药哪个好减肥就找…"，或在页脚藏一堆白底白字的关键词。黑帽 SEO 的老套路，早年管用，现在搜索引擎一眼识破并降权。正路是自然地把关键词融进有价值的内容里。
  example: 这页一段话里"装修"出现二十遍，典型关键词堆砌，读着都难受，迟早被降权。

- term: 内容农场
  aliases: [content farm, 内容工厂]
  category: jargon
  literal: content farm
  meaning: 批量生产大量低质、东拼西凑文章，专为蹭搜索流量挂广告赚钱的网站——不在乎内容好不好，只要能命中关键词、被搜到、有人点、看到广告就行。AI 时代成本暴跌，AI 批量生成的"内容农场"泛滥（参见 [[AI slop]]），逼得搜索引擎反复更新算法打击。和正经内容站对立。
  example: 搜个菜谱前五条全是内容农场，AI 拼的废话，真方子翻三页才找到。

# --- batch: SEM 竞价投放 + 广告技术栈 ---

- term: 竞价排名
  aliases: [付费排名, paid search, 竞价推广, PPC]
  category: jargon
  literal: paid search / PPC（Pay Per Click）
  meaning: 搜索广告的计费/排序机制——广告主为关键词出价竞拍，谁出价高（×质量分）谁的广告排在搜索结果更靠前，用户点一次扣一次钱（PPC 按点击付费）。百度推广、Google Ads 的核心玩法。热词被几家互相抬价能贵到离谱（"减肥""贷款"单次点击几十上百块）。和自然排名（SEO）并列出现在搜索结果页，但带"广告"标识。
  example: 「律师咨询」这词竞价排名一次点击 80 块，几家律所天天互相抬价。

- term: CPA
  aliases: [Cost Per Action, Cost Per Acquisition, 单次行动成本]
  category: abbr
  literal: Cost Per Action
  meaning: 按"用户完成指定动作"付广告费——不是看了（CPM）、也不是点了（CPC），而是真注册/下单/下载了才扣钱。对广告主最划算（只为结果买单），所以出价也最高、平台门槛也高。和 CPC/CPM 是一组阶梯：CPM（曝光）→ CPC（点击）→ CPA（转化），越往后广告主风险越小、单价越贵。
  example: 这个渠道走 CPA，一个注册 50 块，比 CPC 投出来的注册成本还低，加预算。

- term: oCPM
  aliases: [oCPC, optimized CPM, 优化转化出价, 智能出价]
  category: abbr
  literal: optimized Cost Per Mille
  meaning: 信息流广告的"智能出价"——你设一个目标（如"一个下单我愿付 80 块"），平台用算法自动帮你找最可能转化的人、动态调每次曝光的出价，对外仍按曝光（CPM）结算但围着你的转化目标优化。比手动 CPC/CPM 省心、转化好，是巨量引擎/腾讯广告等信息流投放的主流出价方式。oCPC 同理（按点击结算的版本）。
  example: 手动出价跑不动量，换 oCPM 设个转化目标，让系统自己跑，成本反而稳了。

- term: 信息流广告
  aliases: [feed ads, native ads, 原生广告, 信息流]
  category: jargon
  literal: feed ads / native advertising
  meaning: 混在内容信息流里、长得跟正常帖子/视频几乎一样的广告——刷抖音/朋友圈/今日头条时夹在中间那条带"广告"小标的。特点是"原生"：不打断、伪装成内容、靠算法精准推给可能感兴趣的人。和搜索广告对偶（搜索是"人找货"用户主动搜，信息流是"货找人"算法主动推）。是过去十年中国互联网广告的最大金矿。
  example: 信息流广告素材是命根子，同一产品换十版视频跑，跑出爆款再放量。

- term: UTM
  aliases: [UTM 参数, utm, 追踪参数, UTM tracking]
  category: abbr
  literal: Urchin Tracking Module
  meaning: 加在链接末尾的一串追踪参数（?utm_source=weixin&utm_medium=...），用来标记"这个访客是从哪条渠道/哪个广告/哪次活动点进来的"。同一个落地页，发到微信、微博、邮件各挂一套不同 UTM，分析工具（GA 等）就能分清各渠道带来多少流量和转化。投放和运营做渠道归因的基本工具。
  example: 每条推广链接都打上 UTM，月底一拉报表就知道哪个渠道 ROI 最高。

- term: DSP
  aliases: [Demand-Side Platform, 需求方平台]
  category: abbr
  literal: Demand-Side Platform
  meaning: 程序化广告里"买广告"的一方平台——广告主在 DSP 上设好预算/人群/出价，DSP 替你去各大流量上自动竞价买曝光。和 SSP（卖方平台，媒体在上面卖广告位）相对，中间通过 ad exchange（广告交易所）实时撮合。一句话：DSP 是广告主的自动采购员，SSP 是媒体的自动销售员。
  example: 通过 DSP 跨几十家媒体一键投放，比一家家谈广告位效率高太多。

- term: SSP
  aliases: [Supply-Side Platform, 供给方平台, 媒体方平台]
  category: abbr
  literal: Supply-Side Platform
  meaning: 程序化广告里"卖广告位"的一方平台——有流量的媒体/App 把自己的广告位挂上 SSP，让它自动卖给出价最高的广告主，把每个曝光的收益最大化。和 DSP（买方）对偶，通过 ad exchange 实时撮合。一句话：SSP 帮媒体把广告位卖出好价钱。
  example: 网站接了 SSP，广告位自动竞价填充，比自己拉广告主收入高三成。

- term: DMP
  aliases: [Data Management Platform, 数据管理平台]
  category: abbr
  literal: Data Management Platform
  meaning: 广告投放里管"人群数据"的平台——把各处来的用户标签（性别、兴趣、行为、是否老客）收集打通、分群打包，再喂给 DSP 去精准投放。一句话：DMP 是广告系统的"人群仓库+分群工具"，决定了"广告投给谁"。和 CDP（客户数据平台）概念相近但侧重不同（DMP 偏匿名人群+投放，CDP 偏自有客户+运营）。
  example: 先在 DMP 圈出"近 30 天看过竞品的人"，再用 DSP 定向投他们。

- term: RTB
  aliases: [Real-Time Bidding, 实时竞价]
  category: abbr
  literal: Real-Time Bidding
  meaning: 程序化广告的核心机制——你打开一个网页的瞬间（几十毫秒内），后台就为"给你看哪条广告"完成一整场拍卖：SSP 把这次曝光机会喊价，各家 DSP 实时出价，价高者的广告立刻展示给你。每天发生千亿次。一句话：你每看一条广告，背后刚刚结束了一场毫秒级的自动拍卖。
  example: RTB 一次竞价全程几十毫秒，页面还没加载完广告就拍卖定了。

- term: ad exchange
  aliases: [广告交易平台, 广告交易所]
  category: jargon
  literal: ad exchange
  meaning: 程序化广告的"交易所"——撮合买方（DSP）和卖方（SSP）的中间市场，像股票交易所撮合买卖盘。每个广告曝光机会都在这里通过 RTB 实时竞价成交。Google AdX 是最大的一家。一句话：DSP/SSP 是买卖双方的代理，ad exchange 是他们做交易的那个market。
  example: 这次曝光在 ad exchange 上被三家 DSP 抢，最后 12 块千次成交。

# --- batch: 增长 / 内容运营缩写补充 ---

- term: AARRR
  aliases: [海盗模型, 海盗指标, 增长漏斗, Pirate Metrics]
  category: abbr
  literal: Acquisition / Activation / Retention / Revenue / Referral
  meaning: 增长运营的经典框架，把用户生命周期拆成五步漏斗：获取（Acquisition 拉新）→ 激活（Activation 首次用到核心价值）→ 留存（Retention 持续回来）→ 收入（Revenue 付费）→ 推荐（Referral 拉来更多人）。因为五个首字母连起来像海盗喊的"Aarrr!"得名"海盗模型"。做增长先按这五层定位"哪一环漏得最狠"，再针对性补。近年也有人主张把留存提到激活前（RARRA）。
  example: 按 AARRR 一拆发现卡在激活——拉来的人很多但没几个走到 Aha 时刻。

- term: ASO
  aliases: [App Store Optimization, 应用商店优化, 应用市场优化]
  category: abbr
  literal: App Store Optimization
  meaning: SEO 的 App 版——优化 App 在应用商店（App Store / 各安卓市场）里的搜索排名和转化：标题/副标题关键词、截图和预览视频、评分评论、下载量。用户在商店里搜"记账"，谁排前面谁白捡免费下载。和 SEO 一个道理，只是战场从搜索引擎换成应用商店。还有刷量刷评的灰黑产。
  example: 改了 App 标题里的关键词加 ASO，自然下载量两周涨了 60%。

- term: 内容营销
  aliases: [content marketing, 内容种草]
  category: jargon
  literal: content marketing
  meaning: 不直接吆喝卖货，而是持续产出对目标用户有用/有趣的内容（文章、视频、教程、白皮书），靠内容吸引、培养信任，再自然带到产品——"先给价值，后做生意"。和硬广对偶。SEO 的弹药库（有内容才有页面被搜到）、私域的养料、B2B 获客的主力打法。小红书"种草"是其消费版变体。坑：见效慢、要长期投入。
  example: 我们不投硬广，靠内容营销——每周发行业干货文，半年攒了几万精准粉。

- term: EDM
  aliases: [Email Direct Marketing, 邮件营销, 邮件直投]
  category: abbr
  literal: Email Direct Marketing
  meaning: 邮件营销——给用户/订阅者批量发邮件做触达：新品通知、促销、内容简报（newsletter）、召回沉睡用户。在国外是主力获客/留存渠道（ROI 极高、是自有渠道不看平台脸色）；在中国 toC 弱（大家不看邮箱）、但 toB 和外贸仍很重要。核心指标：打开率、点击率、退订率。坑：发太勤被标垃圾邮件。
  example: 外贸站靠 EDM 维护老客户，一封促销邮件就能盘活一批沉睡询盘。

- term: UGC
  aliases: [User Generated Content, 用户生成内容]
  category: abbr
  literal: User Generated Content
  meaning: 用户自己产出的内容——小红书笔记、抖音视频、淘宝评价、知乎回答、B站弹幕。平台不用自己生产内容，靠海量用户免费供养，是社区/电商的护城河。和 PGC（专业团队产出，如长视频、媒体稿）对偶；中间还有 PUGC（专业化的个人创作者，如头部 up 主）。UGC 多＝社区有活力，但质量参差、要审核。
  example: 这电商靠用户晒单的 UGC 撑起信任，比官方详情页说一百句都管用。

- term: PGC
  aliases: [Professionally Generated Content, 专业生产内容, PUGC]
  category: abbr
  literal: Professionally Generated Content
  meaning: 专业团队/机构生产的内容——电视台节目、出版社的书、媒体的深度稿、平台自制剧。特点是质量高、有门槛、成本高。和 UGC（用户随手产）对偶。中间地带是 PUGC（Professional User，专业化的个人创作者，如百万粉知识 up 主）——兼具 UGC 的亲和与 PGC 的质量，是现在平台最想要的。
  example: 平台早期靠 PGC 撑门面保质量，做大后再放开 UGC 拼数量和活跃。

- term: CTA
  aliases: [Call To Action, 行动号召, 行动召唤, 转化按钮]
  category: abbr
  literal: Call To Action
  meaning: 页面/广告/邮件里那个"催你立刻行动"的按钮或话术——"立即购买""免费注册""限时领取"。落地页和营销文案的临门一脚：前面铺垫再好，CTA 不够醒目/不够有诱惑，用户也不动手。讲究文案（动词+利益+紧迫感）、颜色对比、位置。A/B 测试的高频对象，一个按钮文案改改转化率能差一截。
  example: 把 CTA 从"了解更多"改成"免费试用 14 天"，点击率直接翻倍。

- term: 冷启动
  aliases: [cold start, 冷启动问题, 从 0 到 1]
  category: jargon
  literal: cold start
  meaning: 两个语境：① 产品/运营——新产品没用户、没数据、没口碑时怎么"从 0 拉起第一批种子用户"的难题（鸡生蛋问题：没用户就没内容、没内容更没用户）。常靠地推、补贴、KOL、社群冷启。② 推荐系统/ML——新用户或新物品没有历史行为数据，算法"不了解他"推不准，也叫冷启动。两者都是"啥都没有时怎么开局"。
  example: 社区产品最难是冷启动——头一千个活跃用户全靠创始人手动一个个拉。
